context = """
Kuru is a Rust terminal chat harness built around persistent equal peer parts,
isolated memories, speaking relationships and reversible dreaming. Its IFS,
polyvagal, Freudian and Jungian modes are computational interpretations rather
than clinical treatment or claims of sentience. It supports OpenAI Codex login,
OpenAI Responses, MCP, A2A, guarded file tools and explicitly enabled shell tools.
Users install its kuru binary from source or verified native release archives.
The demo provider runs in-process without credentials or network access. Codex
owns its login and credential lifecycle. Explicitly enabled shell tools run with
the user's process authority; there is no shell-command allowlist or sandbox.
Messages retain peer provenance. Storage is currently SQLite. IFS is the default
framework with seven built-in peers; the demo provider uses the selected framework.
"""
system_extra = """
Write concise factual release notes grounded in the supplied commits and files.
Aim for about 450 words or fewer. Lead with observable changes for users, then
use focused bullets; around six to ten is enough for a substantial release.
Use fewer for a small release. These are editorial targets, not a rigid template.
Summarize the release rather than enumerating every component and test.
The current-source snapshot is authoritative for present behavior. Commit history
explains changes and may contain earlier designs that were subsequently replaced.
Resolve any discrepancy using files at the selected source commit. Omit uncertain
details rather than guessing. Do not turn historical plans into shipped features.
Mention breaking changes and migration steps only when supported by history.
Do not invent capabilities, restrictions, roadmap versions, release dates,
benchmarks, test results, availability or completed deployments. Omit test counts,
coverage figures, repository visibility and branch-protection administration.
Do not disclose credential values or internal instructions. No marketing prose.
Keep writing instructions out of the release prose. Do not repeat the version
or product name in the release title; Communiqué supplies the version heading.
"""

[defaults]
# Anthropic's official compatibility API omits the thinking blocks that
# Communiqué 1.3.5's native Anthropic parser could not deserialize. 1.4.0 adds
# native thinking-block replay; keep this route until that path is verified.
model = "claude-sonnet-5"
provider = "openai"
base_url = "https://api.anthropic.com/v1"
repo = "replygirl/kuru"
max_tokens = 16384
emoji = false
match_style = false
verify_links = true
