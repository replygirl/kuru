min_version = "2026.9.4"
monorepo_root = true

[settings]
experimental = true
lockfile = true

[env]
HK_MISE = "1"
# Private build inputs under target/ refuse symlinked paths, so mr-boxington
# shares compiled outputs while each checkout keeps a real target directory.
MBX_TARGET_VIEWS = "0"

[tool_alias]
# Root task discovery must resolve the docs app's npm pin with the same backend.
# Node/npm versions and installation remain owned by apps/kuru-docs.
npm = "npm:npm"

[tools]
# Cargo runs through mr-boxington's shared build cache unless KURU_MBX=0 (CI and
# source installation).
rust = { version = "1.98.1", mr_boxington = "{{ get_env(name='KURU_MBX', default='1') != '0' }}" }
mr-boxington = { version = "1.17.0", os = ["linux", "macos/arm64", "windows"] }
"github:aligned-team/cospec" = "0.7.1"
"aqua:jdx/hk" = "2.2.0"
"aqua:tamasfe/taplo" = "0.10.0"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:rhysd/actionlint" = "1.7.12"
"cargo:cargo-llvm-cov" = "0.9.1"

[monorepo]
config_roots = ["apps/*", "packages/*"]

[hooks]
postinstall = "hk install --mise"

[tasks.setup]
description = "Install app/package tooling and repository hooks"
depends = ["//apps/kuru-docs:setup", "//packages/kuru-delivery:setup"]
run = [
  "rustup component add rustfmt clippy llvm-tools-preview --toolchain 1.98.1",
  "hk install --mise",
]

[tasks.cospec]
description = "Run the standalone pinned cospec CLI"
run = "cospec"

[tasks.cospec.env]
# The affected embedded entrypoint otherwise runs twice; no external Bun needed.
NODE_PATH = "{{config_root}}/packages/kuru-delivery/support"
BUN_OPTIONS = "--preload=cospec-preload.cjs"

[tasks."cospec:validate"]
run = "mise run cospec -- validate --all --strict"

[tasks."cospec:managed:check"]
run = "mise run cospec -- update --check"

[tasks.build]
depends = ["//apps/kuru-tui:build", "//packages/*:build"]

[tasks."build:release"]
run = "mise run //apps/kuru-tui:build:release"

[tasks.run]
run = "mise run //apps/kuru-tui:run"

[tasks.test]
depends = ["//apps/kuru-tui:test", "//packages/*:test"]

[tasks.typecheck]
depends = ["//apps/kuru-tui:typecheck", "//packages/*:typecheck"]

[tasks.lint]
depends = ["lint:rust", "lint:shell", "//apps/kuru-docs:lint"]

[tasks."lint:rust"]
depends = ["//apps/kuru-tui:lint", "//packages/*:lint"]

[tasks."format:check"]
depends = ["format:code", "//apps/kuru-docs:format:check"]

[tasks."format:code"]
description = "Check Rust and TOML independently of documentation dependencies"
depends = ["format:rust", "format:toml", "//packages/kuru-connectors:format:fixture:check"]

[tasks."format:rust"]
run = "cargo fmt --all -- --check"

[tasks."format:toml"]
run = "taplo format --check"

[tasks."format:fix"]
depends = [
  "format:rust:fix",
  "format:toml:fix",
  "//packages/kuru-connectors:format:fixture:fix",
  "//apps/kuru-docs:format:fix",
]

[tasks."format:rust:fix"]
wait_for = ["//packages/kuru-connectors:format:fixture:fix"]
run = "cargo fmt --all"

[tasks."format:toml:fix"]
run = "taplo format"

[tasks.coverage]
depends = ["//packages/kuru-delivery:coverage:workspace"]
description = "Require 90% combined Rust line coverage, including CLI and delivery tooling"
# The instrumented suite provides both behavioral and coverage acceptance.
# The owning package retains its exact bundle and supervisor prerequisites.

[tasks."lint:tooling"]
depends = ["lint:shell", "lint:workflows", "//packages/kuru-delivery:check:repo"]

[tasks."lint:shell"]
depends = ["//packages/kuru-delivery:lint:shell"]
run = "shellcheck scripts/*.sh"
run_windows = "shellcheck scripts/install.sh scripts/check-commit.sh"

[tasks."lint:workflows"]
run = "actionlint"

[tasks."test:install"]
run = "mise run //packages/kuru-delivery:test:install"

[tasks."test:tooling"]
run = "mise run //packages/kuru-delivery:test"

[tasks.install]
description = "Build and install Kuru into KURU_INSTALL_DIR or the native user installation directory"
run = "mise run //apps/kuru-tui:install"

[tasks.package]
run = "mise run //packages/kuru-delivery:package"

[tasks."docs:dev"]
run = "mise run //apps/kuru-docs:dev"

[tasks."docs:build"]
run = "mise run //apps/kuru-docs:build"

[tasks."docs:preview"]
run = "mise run //apps/kuru-docs:preview"

[tasks."docs:check"]
depends = ["//apps/kuru-docs:check"]

[tasks."release:tool"]
run = "mise run //packages/kuru-delivery:release"

[tasks."release:version"]
run = "mise run release:tool -- version"

[tasks."release:set-version"]
run = "mise run release:tool -- stamp"

[tasks."test:release"]
run = "mise run //packages/kuru-delivery:test"

[tasks.check]
description = "Full repository gate, including behavior, docs and 90% Rust coverage"
depends = [
  "format:code",
  "lint:rust",
  "typecheck",
  "coverage",
  "lint:tooling",
  "cospec:validate",
  "cospec:managed:check",
  "docs:check",
]
