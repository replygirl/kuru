min_version = "2026.7.7"
monorepo_root = true

[settings]
experimental = true
lockfile = true

[env]
HK_MISE = "1"
HK_PKL_BACKEND = "pklr"

[tools]
rust = "1.98.1"
codex = "0.153.4"
"github:aligned-team/cospec" = "0.7.0"
"aqua:jdx/hk" = "1.58.1"
"aqua:tamasfe/taplo" = "0.10.0"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:rhysd/actionlint" = "1.7.12"
"cargo:cargo-llvm-cov" = "0.9.1"

[monorepo]
config_roots = ["apps/*", "packages/*"]

[hooks]
postinstall = "hk install --mise"

[tasks.setup]
description = "Install app/package tooling and repository hooks"
depends = ["//apps/kuru-docs:setup", "//packages/kuru-delivery:setup"]
run = [
  "rustup component add rustfmt clippy llvm-tools-preview --toolchain 1.98.1",
  "hk install --mise",
]

[tasks.cospec]
description = "Run the standalone pinned cospec CLI"
run = "cospec"

[tasks.cospec.env]
# cospec 0.7.0's embedded entrypoint otherwise runs twice; no external Bun needed.
NODE_PATH = "{{config_root}}/packages/kuru-delivery/support"
BUN_OPTIONS = "--preload=cospec-preload.cjs"

[tasks."cospec:validate"]
run = "mise run cospec -- validate --all --strict"

[tasks."cospec:managed:check"]
run = "mise run cospec -- update --check"

[tasks.build]
depends = ["//apps/kuru-tui:build", "//packages/*:build"]

[tasks."build:release"]
run = "mise run //apps/kuru-tui:build:release"

[tasks.run]
run = "mise run //apps/kuru-tui:run"

[tasks.test]
depends = ["//apps/kuru-tui:test", "//packages/*:test"]

[tasks.typecheck]
depends = ["//apps/kuru-tui:typecheck", "//packages/*:typecheck"]

[tasks.lint]
depends = ["//apps/kuru-tui:lint", "//packages/*:lint", "//apps/kuru-docs:lint"]

[tasks."format:check"]
depends = ["//apps/kuru-docs:format:check"]
run = [
  "cargo fmt --all -- --check",
  "rustfmt --edition 2024 --check packages/kuru-connectors/tests/fixtures/stdio_peer.rs",
  "taplo format --check",
]

[tasks."format:fix"]
depends = ["//apps/kuru-docs:format:fix"]
run = [
  "cargo fmt --all",
  "rustfmt --edition 2024 packages/kuru-connectors/tests/fixtures/stdio_peer.rs",
  "taplo format",
]

[tasks.coverage]
description = "Require 90% combined Rust line coverage, including CLI and delivery tooling"
# The delivery package supplies its pinned external fixture tools to the combined run.
run = "mise run //packages/kuru-delivery:coverage:workspace"

[tasks."lint:tooling"]
depends = ["//packages/kuru-delivery:check:repo", "//packages/kuru-delivery:lint:shell"]
run = ["shellcheck scripts/*.sh", "actionlint"]

[tasks."test:install"]
run = "mise run //packages/kuru-delivery:test:install"

[tasks."test:tooling"]
run = "mise run //packages/kuru-delivery:test"

[tasks.install]
description = "Build and install Kuru into KURU_INSTALL_DIR or ~/.local/bin"
run = "mise run //apps/kuru-tui:install"

[tasks.package]
run = "mise run //packages/kuru-delivery:package"

[tasks."docs:dev"]
run = "mise run //apps/kuru-docs:dev"

[tasks."docs:build"]
run = "mise run //apps/kuru-docs:build"

[tasks."docs:preview"]
run = "mise run //apps/kuru-docs:preview"

[tasks."docs:check"]
run = "mise run //apps/kuru-docs:check"

[tasks."release:tool"]
run = "mise run //packages/kuru-delivery:release"

[tasks."release:version"]
run = "mise run release:tool -- version"

[tasks."release:set-version"]
run = "mise run release:tool -- stamp"

[tasks."test:release"]
run = "mise run //packages/kuru-delivery:test"

[tasks.check]
description = "Full repository gate, including behavior, docs and 90% Rust coverage"
depends = [
  "format:check",
  "lint",
  "typecheck",
  "test",
  "coverage",
  "lint:tooling",
  "cospec:validate",
  "cospec:managed:check",
  "docs:check",
]
