[workspace]
resolver = "3"
members = [
  "apps/kuru-tui",
  "packages/kuru-core",
  "packages/kuru-connectors",
  "packages/kuru-runtime",
  "packages/kuru-delivery",
  "packages/kuru-memory",
  "packages/kuru-platform",
  "packages/kuru-archive",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/replygirl/kuru"

[workspace.dependencies]
anyhow = "=1.0.104"
base64 = "=0.23.1"
ignore = "=0.4.33"
grep-regex = "=0.1.14"
grep-matcher = "=0.1.9"
grep-searcher = "=0.1.17"
async-trait = "=0.1.92"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml_ng = "=0.10.0"
toml = "=1.1.6"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "mysql"] }
uuid = { version = "=1.26.1", features = ["v4", "v5", "serde"] }
sha2 = "=0.11.0"
getrandom = "=0.4.3"
tokio = { version = "=1.53.1", features = ["full"] }
tracing = "=0.1.44"
tiktoken-rs = "=0.12.0"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
  "registry",
  "std",
] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rcgen = "=0.14.10"
tokio-rustls = "=0.26.5"
httpdate = "=1.0.3"
futures = "=0.3.34"
axum = "=0.8.9"
tower = { version = "=0.5.3", features = ["util"] }
ratatui = { version = "=0.30.2", default-features = false, features = [
  "crossterm_0_29",
  "layout-cache",
] }
crossterm = "=0.29.0"
clap = { version = "=4.6.7", features = ["derive", "env"] }
usage-lib = { version = "=6.11.1", features = ["clap"] }
# usage-cli has no optional features (verified against its published Cargo.toml):
# every dependency it declares — including rmcp's "server" transport, tera, tokio
# and env_logger — is unconditional, so there is no narrower feature set to select
# here. Kuru links only its `complete_answer` function; see the process-launching
# audit above `native_completion_answer_output` in apps/kuru-tui/src/cli.rs for
# which of its process-spawning code paths are actually reachable from that call.
usage-cli = "=6.11.1"
usage-argv = { version = "=6.11.1", features = ["complete"] }
tempfile = "=3.27.0"
url = "=2.5.8"
unicode-width = "=0.2.2"
jsonschema = { version = "=0.56.0", default-features = false }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
nix = { version = "=0.31.3", features = ["signal", "process", "term", "poll", "fs", "user"] }
rustix = { version = "=1.1.4", features = ["termios"] }
vt100 = "=0.16.2"
tar = "=0.4.46"
flate2 = "=1.1.10"
scraper = "=0.27.0"
roxmltree = "=0.21.1"
windows-sys = { version = "=0.61.2", default-features = false }
keyring = { version = "=4.2.0", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
crc32fast = "=1.5.2"
portable-pty = "=0.9.0"
kuru-core = { path = "packages/kuru-core" }
kuru-connectors = { path = "packages/kuru-connectors" }
kuru-runtime = { path = "packages/kuru-runtime" }
kuru-delivery = { path = "packages/kuru-delivery" }
kuru-memory = { path = "packages/kuru-memory" }
kuru-platform = { path = "packages/kuru-platform" }
kuru-archive = { path = "packages/kuru-archive" }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# Full-image update verification must also remain responsive in development.
# Tests inherit this dependency-only optimization; workspace code stays at opt 0.
[profile.dev.package."sha2:0.11.0"]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
