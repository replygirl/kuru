[vars]
kuru_runtime_build_target = "{{env.CARGO_BUILD_TARGET | default(value='host')}}"

[tasks."build"]
shell = "{% if os() == 'windows' %}cmd /d /s /c{% else %}sh -c{% endif %}"
usage = 'flag "--target <target>" default="{{vars.kuru_runtime_build_target}}"'
env.CARGO_BUILD_TARGET = false
depends = [
  { task = "//packages/kuru-memory:bundle:prepare", args = [
    "--target",
    "{{usage.target}}",
  ] },
]
run = 'cargo build -p kuru-runtime --all-features --locked {% if usage.target != "host" %}--target "${usage_target?}"{% endif %}'
run_windows = 'cargo build -p kuru-runtime --all-features --locked {% if usage.target != "host" %}--target "%usage_target%"{% endif %}'

[tasks."build:release"]
shell = "{% if os() == 'windows' %}cmd /d /s /c{% else %}sh -c{% endif %}"
usage = 'flag "--target <target>" default="{{vars.kuru_runtime_build_target}}"'
env.CARGO_BUILD_TARGET = false
depends = [
  { task = "//packages/kuru-memory:bundle:prepare", args = [
    "--target",
    "{{usage.target}}",
  ] },
]
run = 'cargo build -p kuru-runtime --release --all-features --locked {% if usage.target != "host" %}--target "${usage_target?}"{% endif %}'
run_windows = 'cargo build -p kuru-runtime --release --all-features --locked {% if usage.target != "host" %}--target "%usage_target%"{% endif %}'

[tasks."test"]
env.RUST_TEST_THREADS = "2"
env.KURU_TEST_SUPERVISOR_PREPARED = "1"
depends = ["//packages/kuru-memory:prefetch"]
run = "cargo test -p kuru-runtime --all-targets --all-features --locked --no-fail-fast"

[tasks."typecheck"]
depends = ["//packages/kuru-memory:bundle:prepare"]
run = "cargo check -p kuru-runtime --all-targets --all-features --locked"

[tasks."lint"]
depends = ["//packages/kuru-memory:bundle:prepare"]
run = "cargo clippy -p kuru-runtime --all-targets --all-features --locked -- -D warnings"

[tasks."lint:windows"]
description = "Lint Windows-only Rust for x86_64-pc-windows-msvc; off Windows the delivery stand-in C toolchain lets build scripts finish without compiling C"
depends = [
  { task = "//packages/kuru-memory:bundle:prepare", args = [
    "--target",
    "x86_64-pc-windows-msvc",
  ] },
]
env.CARGO_BUILD_TARGET = false
run = "CC_x86_64_pc_windows_msvc='{{config_root}}/../kuru-delivery/support/windows-lint-cc.sh' AR_x86_64_pc_windows_msvc='{{config_root}}/../kuru-delivery/support/windows-lint-ar.sh' cargo clippy -p kuru-runtime --target x86_64-pc-windows-msvc --all-targets --all-features --locked -- -D warnings"
run_windows = "cargo clippy -p kuru-runtime --target x86_64-pc-windows-msvc --all-targets --all-features --locked -- -D warnings"
[env]
RUST_TEST_THREADS = "2"
