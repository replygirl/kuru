[tasks."build"]
run = "cargo build -p kuru-connectors --all-features --locked"

[tasks."build:release"]
run = "cargo build -p kuru-connectors --release --all-features --locked"

[tasks."test"]
env.RUST_TEST_THREADS = "2"
run = "cargo test -p kuru-connectors --all-targets --all-features --locked --no-fail-fast"

[tasks."typecheck"]
run = "cargo check -p kuru-connectors --all-targets --all-features --locked"

[tasks."lint"]
run = "cargo clippy -p kuru-connectors --all-targets --all-features --locked -- -D warnings"
