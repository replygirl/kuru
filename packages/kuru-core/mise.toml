[tasks."build"]
run = "cargo build -p kuru-core --all-features --locked"

[tasks."build:release"]
run = "cargo build -p kuru-core --release --all-features --locked"

[tasks."test"]
run = "cargo test -p kuru-core --all-targets --all-features --locked"

[tasks."typecheck"]
run = "cargo check -p kuru-core --all-targets --all-features --locked"

[tasks."lint"]
run = "cargo clippy -p kuru-core --all-targets --all-features --locked -- -D warnings"
