[vars]
kuru_go_version = "1.26.2"
kuru_llvm_mingw_version = "20260922"
# Capture the consumer target before the preparation task clears Cargo's target.
kuru_memory_bundle_target = "{{env.CARGO_BUILD_TARGET | default(value='host')}}"

[tasks."bundle:prepare"]
description = "Prepare the verified engine archive embedded by the next build"
dir = "{{config_root}}/../.."
env.CARGO_BUILD_TARGET = false
env.RUSTFLAGS = false
env.CARGO_ENCODED_RUSTFLAGS = false
env.CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = false
env.CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS = false
env.KURU_DOLT_BUNDLE_TARGET = "{{vars.kuru_memory_bundle_target}}"
run = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-delivery -- bundle prepare"

[tasks."setup:build-tools"]
description = "Install only the pinned Go and llvm-mingw toolchains used by bundle:build"
# Repeat bundle:build's linux-x64 asset option so the locked install matches
# its packages/kuru-memory/mise.lock entry.
run = "mise install go@{{vars.kuru_go_version}} 'github:mstorsjo/llvm-mingw[asset_pattern=llvm-mingw-{{vars.kuru_llvm_mingw_version}}-ucrt-ubuntu-22.04-x86_64.tar.xz]@{{vars.kuru_llvm_mingw_version}}'"

# Source-built engine archives (manifest `provenance: built`). The recipe's
# only build host is linux-x64; the delivery helper refuses any other host
# unless KURU_BUNDLE_BUILD_HOST_OVERRIDE=1 requests non-authoritative iteration.
[tasks."bundle:build"]
description = "Build a pinned source-built engine archive on the linux-x64 build host"
dir = "{{config_root}}/../.."
env.CARGO_BUILD_TARGET = false
env.RUSTFLAGS = false
env.CARGO_ENCODED_RUSTFLAGS = false
env.CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = false
tools.go = "{{vars.kuru_go_version}}"
# Only the linux-x64 package is pinned: its target runtimes define the bytes.
tools."github:mstorsjo/llvm-mingw" = { version = "{{vars.kuru_llvm_mingw_version}}", platforms = { linux-x64 = { asset_pattern = "llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64.tar.xz" } } }
run = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-delivery -- bundle build"

[tasks.build]
shell = "{% if os() == 'windows' %}cmd /d /s /c{% else %}sh -c{% endif %}"
usage = 'flag "--target <target>" default="{{vars.kuru_memory_bundle_target}}"'
env.CARGO_BUILD_TARGET = false
depends = [{ task = "bundle:prepare", args = ["--target", "{{usage.target}}"] }]
run = 'cargo build -p kuru-memory --locked {% if usage.target != "host" %}--target "${usage_target?}"{% endif %}'
run_windows = 'cargo build -p kuru-memory --locked {% if usage.target != "host" %}--target "%usage_target%"{% endif %}'

[tasks."build:release"]
shell = "{% if os() == 'windows' %}cmd /d /s /c{% else %}sh -c{% endif %}"
usage = 'flag "--target <target>" default="{{vars.kuru_memory_bundle_target}}"'
env.CARGO_BUILD_TARGET = false
depends = [{ task = "bundle:prepare", args = ["--target", "{{usage.target}}"] }]
run = 'cargo build -p kuru-memory --release --locked {% if usage.target != "host" %}--target "${usage_target?}"{% endif %}'
run_windows = 'cargo build -p kuru-memory --release --locked {% if usage.target != "host" %}--target "%usage_target%"{% endif %}'

[tasks.test]
env.RUST_TEST_THREADS = "2"
env.KURU_TEST_SUPERVISOR_PREPARED = "1"
depends = ["prefetch", "bundle:test-fixtures"]
run = "cargo test -p kuru-memory --all-targets --all-features --locked --no-fail-fast"

# Opt-in measurements, never part of `test`, coverage or CI partitions: the
# harnesses are #[ignore]d and the Dolt trace is inert unless
# KURU_TEST_DOLT_LOG_DIR is set. The usage-scan check below runs in its own
# CI job. See docs/development.md.
[tasks."measure:lifecycle"]
description = "Run the ignored candidate-cleanup and close-time lifecycle measurements on demand"
env.RUST_TEST_THREADS = "2"
env.KURU_TEST_SUPERVISOR_PREPARED = "1"
depends = ["prefetch"]
run = "cargo test -p kuru-memory --lib --all-features --locked lifecycle_measurement_tests -- --ignored --test-threads=2"

[tasks."measure:cold-open"]
description = "Run the ignored cold-path open-latency measurement on demand"
env.RUST_TEST_THREADS = "1"
env.KURU_TEST_SUPERVISOR_PREPARED = "1"
depends = ["prefetch"]
run = "cargo test -p kuru-memory --lib --all-features --locked stage_worker::tests::measure_cold_open_latency -- --ignored --test-threads=1"

# Ages the one existing project store under --data-dir (create it with one
# `kuru` run first) through the facade's real write paths while holding its
# owner lock. Deterministic logical content per seed, size and turn count.
# --profile release lets the usage-scan check reuse one release build.
[tasks."measure:age-store"]
description = "Age an isolated project store through the real write paths for open-time measurement"
depends = ["bundle:prepare"]
usage = '''
flag "--data-dir <dir>" required=#true
flag "--conversations <n>" required=#true
flag "--turns <n>" default="1"
flag "--seed <seed>" default="1"
flag "--profile <profile>" default="dev"
'''
run = 'cargo run -p kuru-memory --features test-support --locked --profile "${usage_profile?}" -- age-store --data-dir "${usage_data_dir?}" --conversations "${usage_conversations?}" --turns "${usage_turns?}" --seed "${usage_seed?}"'

# The usage-scan scaling check's aged fixture (Unix): create one empty store
# per size (`create --root <dir> --conversations <n>`) and seal the stores
# once measure:age-store has aged them (`seal --root <dir>`). CI ages it
# in-job on every run and never caches it.
# Never sets KURU_OPEN_TIMELINE, so the fixture holds no timeline. See
# docs/development.md.
[tasks."measure:usage-scan:fixture"]
description = "Create the usage-scan fixture stores or seal them (Unix)"
depends = ["bundle:prepare"]
run = "cargo run -p kuru-memory --features test-support --locked --profile release -- usage-scan-fixture"

# Cold gated owner opens over the sealed fixture, asserting the provisional
# growth bounds with --assert (Unix): `--root <dir> --evidence <dir>
# [--samples <odd n>] [--assert] [--summary <file>]`.
[tasks."measure:usage-scan"]
description = "Measure the usage-ledger scan on aged stores from owner open timelines (Unix)"
depends = ["bundle:prepare"]
env.KURU_OPEN_TIMELINE = "1"
run = "cargo run -p kuru-memory --features test-support --locked --profile release -- measure-usage-scan"

[tasks."bundle:test-fixtures"]
description = "Prepare the actual upstream Windows ZIP for host-independent decoder tests"
depends = [{ task = "bundle:prepare", args = ["--target", "x86_64-pc-windows-msvc"] }]

[tasks."bundle:verify-native-build"]
description = "Verify that the source-installed build is the fresh offline control, then actual offline Windows Cargo rejection of missing/corrupt prepared inputs"
# Let stock PowerShell reconstruct its module paths when mise was launched by pwsh.
env.PSModulePath = false
env.CARGO_BUILD_TARGET = false
env.CARGO_NET_OFFLINE = "true"
env.KURU_DOLT_BUNDLE_OFFLINE = "true"
env.CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = "-C target-feature=+crt-static"
env.CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS = "-C target-feature=+crt-static"
run = "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File support/verify-bundle-build.ps1"

[tasks.typecheck]
depends = ["bundle:prepare"]
run = "cargo check -p kuru-memory --all-targets --all-features --locked"

[tasks.lint]
depends = ["bundle:prepare"]
run = "cargo clippy -p kuru-memory --all-targets --all-features --locked -- -D warnings"

[tasks."lint:windows"]
description = "Lint Windows-only Rust for x86_64-pc-windows-msvc; off Windows the delivery stand-in C toolchain lets build scripts finish without compiling C"
depends = [{ task = "bundle:prepare", args = ["--target", "x86_64-pc-windows-msvc"] }]
env.CARGO_BUILD_TARGET = false
run = "CC_x86_64_pc_windows_msvc='{{config_root}}/../kuru-delivery/support/windows-lint-cc.sh' AR_x86_64_pc_windows_msvc='{{config_root}}/../kuru-delivery/support/windows-lint-ar.sh' cargo clippy -p kuru-memory --target x86_64-pc-windows-msvc --all-targets --all-features --locked -- -D warnings"
run_windows = "cargo clippy -p kuru-memory --target x86_64-pc-windows-msvc --all-targets --all-features --locked -- -D warnings"

[tasks.prefetch]
description = "Extract and verify the bundled full-Dolt runtime, then build or verify its store template, for local tests"
depends = ["bundle:prepare"]
run = "cargo run -p kuru-memory --features test-support --locked -- prefetch"

[tasks."deps:lock"]
description = "Resolve exact workspace dependency changes"
run = "cargo generate-lockfile"

[tasks."deps:fetch"]
run = "cargo fetch --locked"
[env]
RUST_TEST_THREADS = "2"
