[vars]
kuru_go_version = "1.26.2"
kuru_llvm_mingw_version = "20260922"
# Capture the consumer target before the preparation task clears Cargo's target.
kuru_memory_bundle_target = "{{env.CARGO_BUILD_TARGET | default(value='host')}}"

[tasks."bundle:prepare"]
description = "Prepare the verified engine archive embedded by the next build"
dir = "{{config_root}}/../.."
env.CARGO_BUILD_TARGET = false
env.RUSTFLAGS = false
env.CARGO_ENCODED_RUSTFLAGS = false
env.CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = false
env.KURU_DOLT_BUNDLE_TARGET = "{{vars.kuru_memory_bundle_target}}"
run = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-delivery -- bundle prepare"

[tasks."setup:build-tools"]
description = "Install only the pinned Go and llvm-mingw toolchains used by bundle:build"
run = "mise install go@{{vars.kuru_go_version}} github:mstorsjo/llvm-mingw@{{vars.kuru_llvm_mingw_version}}"

# Source-built engine archives (manifest `provenance: built`). The recipe's
# only build host is linux-x64; the delivery helper refuses any other host
# unless KURU_BUNDLE_BUILD_HOST_OVERRIDE=1 requests non-authoritative iteration.
[tasks."bundle:build"]
description = "Build a pinned source-built engine archive on the linux-x64 build host"
dir = "{{config_root}}/../.."
env.CARGO_BUILD_TARGET = false
env.RUSTFLAGS = false
env.CARGO_ENCODED_RUSTFLAGS = false
env.CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = false
tools.go = "{{vars.kuru_go_version}}"
# Only the linux-x64 package is pinned: its target runtimes define the bytes.
tools."github:mstorsjo/llvm-mingw" = { version = "{{vars.kuru_llvm_mingw_version}}", platforms = { linux-x64 = { asset_pattern = "llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64.tar.xz" } } }
run = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-delivery -- bundle build"

[tasks.build]
shell = "{% if os() == 'windows' %}cmd /d /s /c{% else %}sh -c{% endif %}"
usage = 'flag "--target <target>" default="{{vars.kuru_memory_bundle_target}}"'
env.CARGO_BUILD_TARGET = false
depends = [{ task = "bundle:prepare", args = ["--target", "{{usage.target}}"] }]
run = 'cargo build -p kuru-memory --locked {% if usage.target != "host" %}--target "${usage_target?}"{% endif %}'
run_windows = 'cargo build -p kuru-memory --locked {% if usage.target != "host" %}--target "%usage_target%"{% endif %}'

[tasks."build:release"]
shell = "{% if os() == 'windows' %}cmd /d /s /c{% else %}sh -c{% endif %}"
usage = 'flag "--target <target>" default="{{vars.kuru_memory_bundle_target}}"'
env.CARGO_BUILD_TARGET = false
depends = [{ task = "bundle:prepare", args = ["--target", "{{usage.target}}"] }]
run = 'cargo build -p kuru-memory --release --locked {% if usage.target != "host" %}--target "${usage_target?}"{% endif %}'
run_windows = 'cargo build -p kuru-memory --release --locked {% if usage.target != "host" %}--target "%usage_target%"{% endif %}'

[tasks.test]
env.RUST_TEST_THREADS = "2"
env.KURU_TEST_SUPERVISOR_PREPARED = "1"
depends = ["prefetch", "bundle:test-fixtures"]
run = "cargo test -p kuru-memory --all-targets --all-features --locked --no-fail-fast"

[tasks."bundle:test-fixtures"]
description = "Prepare the actual upstream Windows ZIP for host-independent decoder tests"
depends = [{ task = "bundle:prepare", args = ["--target", "x86_64-pc-windows-msvc"] }]

[tasks."bundle:verify-native-build"]
description = "Verify actual offline Windows Cargo rejection of missing/corrupt prepared inputs after source installation"
# Let stock PowerShell reconstruct its module paths when mise was launched by pwsh.
env.PSModulePath = false
env.CARGO_BUILD_TARGET = false
env.CARGO_NET_OFFLINE = "true"
env.KURU_DOLT_BUNDLE_OFFLINE = "true"
env.CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS = "-C target-feature=+crt-static"
run = "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File support/verify-bundle-build.ps1"

[tasks.typecheck]
depends = ["bundle:prepare"]
run = "cargo check -p kuru-memory --all-targets --all-features --locked"

[tasks.lint]
depends = ["bundle:prepare"]
run = "cargo clippy -p kuru-memory --all-targets --all-features --locked -- -D warnings"

[tasks.prefetch]
description = "Extract and verify the bundled full-Dolt runtime for local tests"
depends = ["bundle:prepare"]
run = "cargo run -p kuru-memory --features test-support --locked -- prefetch"

[tasks."deps:lock"]
description = "Resolve exact workspace dependency changes"
run = "cargo generate-lockfile"

[tasks."deps:fetch"]
run = "cargo fetch --locked"
[env]
RUST_TEST_THREADS = "2"
