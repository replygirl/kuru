[package]
name = "kuru-delivery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Kuru installation, packaging and maintainer tooling"

[features]
default = []
tooling = ["dep:clap", "dep:toml", "dep:scraper", "dep:roxmltree", "dep:base64", "dep:rustix"]

[[bin]]
name = "kuru-delivery"
path = "src/main.rs"
required-features = ["tooling"]

[[bin]]
name = "kuru-release"
path = "src/bin/kuru-release.rs"
required-features = ["tooling"]

[[bin]]
name = "kuru-delivery-fixture"
path = "tests/fixtures/delivery.rs"
required-features = ["tooling"]

[dependencies]
anyhow.workspace = true
kuru-platform.workspace = true
kuru-archive.workspace = true
base64 = { workspace = true, optional = true }
sha2.workspace = true
tar.workspace = true
flate2.workspace = true
tempfile.workspace = true
url.workspace = true
reqwest.workspace = true
tokio.workspace = true
uuid.workspace = true
clap = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
toml = { workspace = true, optional = true }
scraper = { workspace = true, optional = true }
roxmltree = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true, features = ["fs", "process"] }

[dev-dependencies]
axum.workspace = true

[lints]
workspace = true
