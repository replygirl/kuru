[vars]
kuru_cargo_audit_version = "0.22.2"
kuru_cocogitto_version = "7.0.0"
kuru_communique_version = "1.5.0"

[tasks.setup]
description = "Install package task tools without running release commands"
run = "mise install --include-task-tools"

[tasks."setup:test-tools"]
description = "Install only the package's pinned behavioral fixture tools"
run = "mise install aqua:cocogitto/cocogitto@{{vars.kuru_cocogitto_version}} github:jdx/communique@{{vars.kuru_communique_version}}"

[tasks."setup:advisories"]
description = "Install only the pinned cargo-audit scanner used by advisory tasks"
run = "mise install --locked \"cargo:cargo-audit[default-features=false,locked=true]@{{vars.kuru_cargo_audit_version}}\""

[tasks."audit:advisories:refresh"]
description = "Explicitly refresh the isolated public RustSec advisory database"
dir = "{{config_root}}"
run = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-delivery -- audit refresh --database \"$KURU_ADVISORY_DB\""
run_windows = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-delivery -- audit refresh --database \"$env:KURU_ADVISORY_DB\""

[tasks."audit:advisories"]
description = "Scan the root Cargo.lock against an already-refreshed RustSec database"
dir = "{{config_root}}"
tools."cargo:cargo-audit" = { version = "{{vars.kuru_cargo_audit_version}}", locked = true, default-features = false }
run = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-delivery -- audit scan --database \"$KURU_ADVISORY_DB\" --audit-bin \"$(command -v cargo-audit)\""
run_windows = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-delivery -- audit scan --database \"$env:KURU_ADVISORY_DB\" --audit-bin \"$((Get-Command cargo-audit).Source)\""

[tasks."coverage:workspace"]
depends = ["//packages/kuru-memory:bundle:prepare", "//packages/kuru-memory:bundle:test-fixtures"]
description = "Combine all package coverage with the delivery fixture toolchain"
dir = "{{config_root}}/../.."
tools."aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
tools."aqua:cocogitto/cocogitto" = "{{vars.kuru_cocogitto_version}}"
tools."github:jdx/communique" = "{{vars.kuru_communique_version}}"
run = '''
llvm_cov="$(mise bin-paths aqua:taiki-e/cargo-llvm-cov@0.9.1)/cargo-llvm-cov"
test "$("$llvm_cov" llvm-cov --version)" = "cargo-llvm-cov 0.9.1"
"$llvm_cov" llvm-cov --workspace --all-targets --all-features --locked --no-fail-fast --fail-under-lines 95 --lcov --output-path target/coverage.lcov
'''
run_windows = '''
$llvmCov = Join-Path ((mise bin-paths 'aqua:taiki-e/cargo-llvm-cov@0.9.1').Trim()) 'cargo-llvm-cov.exe'
if ((& $llvmCov llvm-cov --version).Trim() -ne 'cargo-llvm-cov 0.9.1') { throw 'Wrong cargo-llvm-cov version' }
& $llvmCov llvm-cov --workspace --all-targets --all-features --locked --no-fail-fast --fail-under-lines 95 --lcov --output-path target/coverage.lcov
'''

[tasks."coverage:workspace".env]
RUST_TEST_THREADS = "2"
KURU_TEST_SUPERVISOR_PREPARED = false

[tasks."coverage:shard"]
depends = ["//packages/kuru-memory:bundle:prepare", "//packages/kuru-memory:bundle:test-fixtures"]
description = "Run one fail-closed instrumented workspace coverage partition from KURU_COVERAGE_* inputs (CI)"
dir = "{{config_root}}/../.."
tools."aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
tools."aqua:cocogitto/cocogitto" = "{{vars.kuru_cocogitto_version}}"
tools."github:jdx/communique" = "{{vars.kuru_communique_version}}"
run = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-delivery -- coverage shard"

[tasks."coverage:shard".env]
RUST_TEST_THREADS = "2"
KURU_TEST_SUPERVISOR_PREPARED = false
# Gated owners stream their open timeline, so a readiness deadline in any
# coverage partition names the owner phase it reached. The usage-scan
# scaling job refuses the variable; this task is not that job.
KURU_OPEN_TIMELINE = "1"

[tasks."test:partition"]
depends = ["//packages/kuru-memory:bundle:prepare", "//packages/kuru-memory:bundle:test-fixtures"]
description = "Run one fail-closed uninstrumented test partition of KURU_COVERAGE_PACKAGES from KURU_COVERAGE_* inputs (CI)"
dir = "{{config_root}}/../.."
tools."aqua:cocogitto/cocogitto" = "{{vars.kuru_cocogitto_version}}"
tools."github:jdx/communique" = "{{vars.kuru_communique_version}}"
run = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-delivery -- coverage shard --uninstrumented"

[tasks."test:partition".env]
RUST_TEST_THREADS = "2"
KURU_TEST_SUPERVISOR_PREPARED = "1"

[tasks."coverage:merge"]
description = "Require one OS's partition receipts to agree and be complete, then enforce its coverage gate (CI)"
dir = "{{config_root}}/../.."
run = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-delivery -- coverage merge"

[tasks."build"]
run = "cargo build -p kuru-delivery --all-features --locked"

[tasks."build:release"]
run = "cargo build -p kuru-delivery --release --all-features --locked"

[tasks."test"]
env.RUST_TEST_THREADS = "2"
tools."aqua:cocogitto/cocogitto" = "{{vars.kuru_cocogitto_version}}"
tools."github:jdx/communique" = "{{vars.kuru_communique_version}}"
run = "cargo test -p kuru-delivery --all-targets --all-features --locked --no-fail-fast"

[tasks."typecheck"]
run = "cargo check -p kuru-delivery --all-targets --all-features --locked"

[tasks."lint"]
run = "cargo clippy -p kuru-delivery --all-targets --all-features --locked -- -D warnings"

[tasks."lint:windows"]
description = "Lint Windows-only Rust for x86_64-pc-windows-msvc; off Windows the stand-in C toolchain lets build scripts finish without compiling C"
env.CARGO_BUILD_TARGET = false
run = "CC_x86_64_pc_windows_msvc='{{config_root}}/support/windows-lint-cc.sh' AR_x86_64_pc_windows_msvc='{{config_root}}/support/windows-lint-ar.sh' cargo clippy -p kuru-delivery --target x86_64-pc-windows-msvc --all-targets --all-features --locked -- -D warnings"
run_windows = "cargo clippy -p kuru-delivery --target x86_64-pc-windows-msvc --all-targets --all-features --locked -- -D warnings"

[tasks."lint:shell"]
description = "Check the compiler-free release bootstrap"
run = "shellcheck support/install.sh support/windows-lint-cc.sh support/windows-lint-ar.sh"

[tasks.tool]
dir = "{{config_root}}/../.."
run = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-delivery --"

[tasks.release]
dir = "{{config_root}}/../.."
tools."aqua:cocogitto/cocogitto" = "{{vars.kuru_cocogitto_version}}"
tools."github:jdx/communique" = "{{vars.kuru_communique_version}}"
run = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-release --"

[tasks."check:repo"]
run = "mise run tool -- repo --root ."

[tasks.package]
run = "mise run tool -- package"

[tasks."package:shell-support"]
run = "mise run tool -- package-shell-support"

[tasks."test:install"]
env.RUST_TEST_THREADS = "2"
run = [
  "cargo test -p kuru-delivery --all-features --locked archive::tests",
  "cargo test -p kuru-delivery --all-features --locked --test bootstrap_install",
]

[tasks."test:previous-release-update"]
description = "Run the previous published release's own updater against this tree's release build on the native host"
# Inputs: KURU_UPDATE_CANDIDATE_BINARY (required) is the absolute path to the
# release-profile kuru executable built from this tree. GITHUB_TOKEN (optional)
# authenticates only the GitHub release-listing request; it never reaches a
# download or a Kuru child. Needs outbound HTTPS to api.github.com and github.com.
run = "cargo test -p kuru-delivery --features tooling --locked --test previous_release_update previous_published_release_updates_to_this_tree -- --ignored --exact --nocapture --test-threads=1"

[tasks."measure:open-time"]
description = "Open-time measurement of a release kuru executable from outside the binary; gates engine starts and two median budgets when the gate variables are set"
# Inputs: KURU_OPEN_TIME_BINARY (required) is the release-profile kuru to
# measure and KURU_OPEN_TIME_OUTPUT (required) receives records.jsonl and
# summary.md. KURU_OPEN_TIME_SCRATCH (parent of the private scratch root),
# KURU_OPEN_TIME_ITERATIONS (default 10), KURU_OPEN_TIME_LABEL,
# KURU_OPEN_TIME_INTERVAL_MS (sampling period, default 20),
# KURU_OPEN_TIME_FILES (on, or off for the processes-only control) and
# KURU_OPEN_TIME_RETIRE_WAIT (on, or off for the ramp series) are optional;
# GITHUB_STEP_SUMMARY, when set, also receives the summary. Offline demo
# conversations only: no network, login or credential store.
# Gate, all six or none: KURU_OPEN_TIME_EXPECT_FIRST_LAUNCH_STARTS,
# KURU_OPEN_TIME_EXPECT_COLD_EXISTING_STARTS and
# KURU_OPEN_TIME_EXPECT_NEW_PROJECT_STARTS (exact engine starts of every run
# of the case), KURU_OPEN_TIME_EXPECT_WARM_REOPEN_STARTS (per owner path, for
# example attached=0,spawned-owner=1; a path not listed fails), and
# KURU_OPEN_TIME_BUDGET_NEW_PROJECT_MS and
# KURU_OPEN_TIME_BUDGET_COLD_EXISTING_MS (budgets for the median open to
# ready). Counts are checked first, the medians only once every count holds;
# any violation exits non-zero after the records and summary are written. A
# median budget miss with every count held measures one more full series
# (records in retry/records.jsonl), which decides; a count violation or
# failed open in either series fails without another.
# The gate applies to the main series only (files and retirement wait on);
# without the gate variables the task is report only and only an
# infrastructure failure exits non-zero. ci.yml's open-time job sets them;
# see docs/development.md#open-time-gate for the budget rule.
dir = "{{config_root}}/../.."
run = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-delivery -- open-time"

[tasks."verify:published-windows"]
description = "Verify the exact published Windows release through ordinary mise"
# Inputs: RELEASE_VERSION, RELEASE_SHA, RELEASE_RUN_URL and
# KURU_PUBLISHED_WINDOWS_RECEIPT (required); KURU_PUBLISHED_TARGET (optional)
# names the Windows target and must equal the runner's native host target.
dir = "{{config_root}}/../.."
run = "echo 'verify:published-windows requires native Windows' >&2; exit 1"
run_windows = "pwsh.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packages/kuru-delivery/support/verify-published-windows.ps1"
