[vars]
kuru_cargo_audit_version = "0.22.2"
kuru_cocogitto_version = "7.0.0"
kuru_communique_version = "1.3.5"

[tasks.setup]
description = "Install package task tools without running release commands"
run = "mise install --include-task-tools"

[tasks."setup:test-tools"]
description = "Install only the package's pinned behavioral fixture tools"
run = "mise install aqua:cocogitto/cocogitto@{{vars.kuru_cocogitto_version}} github:jdx/communique@{{vars.kuru_communique_version}}"

[tasks."setup:advisories"]
description = "Install only the pinned cargo-audit scanner used by advisory tasks"
run = "mise install --locked \"cargo:cargo-audit[default-features=false,locked=true]@{{vars.kuru_cargo_audit_version}}\""

[tasks."audit:advisories:refresh"]
description = "Explicitly refresh the isolated public RustSec advisory database"
dir = "{{config_root}}"
run = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-delivery -- audit refresh --database \"$KURU_ADVISORY_DB\""
run_windows = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-delivery -- audit refresh --database \"$env:KURU_ADVISORY_DB\""

[tasks."audit:advisories"]
description = "Scan the root Cargo.lock against an already-refreshed RustSec database"
dir = "{{config_root}}"
tools."cargo:cargo-audit" = { version = "{{vars.kuru_cargo_audit_version}}", locked = true, default-features = false }
run = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-delivery -- audit scan --database \"$KURU_ADVISORY_DB\" --audit-bin \"$(command -v cargo-audit)\""
run_windows = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-delivery -- audit scan --database \"$env:KURU_ADVISORY_DB\" --audit-bin \"$((Get-Command cargo-audit).Source)\""

[tasks."coverage:workspace"]
depends = ["//packages/kuru-memory:bundle:prepare", "//packages/kuru-memory:bundle:test-fixtures"]
description = "Combine all package coverage with the delivery fixture toolchain"
dir = "{{config_root}}/../.."
tools."cargo:cargo-llvm-cov" = "0.9.1"
tools."aqua:cocogitto/cocogitto" = "{{vars.kuru_cocogitto_version}}"
tools."github:jdx/communique" = "{{vars.kuru_communique_version}}"
run = '''
llvm_cov="$(mise bin-paths cargo:cargo-llvm-cov@0.9.1)/cargo-llvm-cov"
test "$("$llvm_cov" llvm-cov --version)" = "cargo-llvm-cov 0.9.1"
"$llvm_cov" llvm-cov --workspace --all-targets --all-features --locked --no-fail-fast --fail-under-lines 90 --lcov --output-path target/coverage.lcov
'''
run_windows = '''
$llvmCov = Join-Path ((mise bin-paths 'cargo:cargo-llvm-cov@0.9.1').Trim()) 'cargo-llvm-cov.exe'
if ((& $llvmCov llvm-cov --version).Trim() -ne 'cargo-llvm-cov 0.9.1') { throw 'Wrong cargo-llvm-cov version' }
& $llvmCov llvm-cov --workspace --all-targets --all-features --locked --no-fail-fast --fail-under-lines 90 --lcov --output-path target/coverage.lcov
'''

[tasks."coverage:workspace".env]
RUST_TEST_THREADS = "2"
KURU_TEST_SUPERVISOR_PREPARED = false

[tasks."coverage:windows:shard"]
depends = ["//packages/kuru-memory:bundle:prepare", "//packages/kuru-memory:bundle:test-fixtures"]
description = "Run one fail-closed Windows workspace coverage package shard"
dir = "{{config_root}}/../.."
tools."cargo:cargo-llvm-cov" = "0.9.1"
tools."aqua:cocogitto/cocogitto" = "{{vars.kuru_cocogitto_version}}"
tools."github:jdx/communique" = "{{vars.kuru_communique_version}}"
run = "echo 'coverage:windows:shard requires native Windows' >&2; exit 1"
run_windows = "pwsh.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packages/kuru-delivery/support/windows-coverage.ps1 -Mode Shard"

[tasks."coverage:windows:shard".env]
RUST_TEST_THREADS = "2"
KURU_TEST_SUPERVISOR_PREPARED = false

[tasks."coverage:windows:collect"]
depends = ["//packages/kuru-memory:bundle:prepare", "//packages/kuru-memory:bundle:test-fixtures"]
description = "Validate Windows coverage shard receipts and enforce one workspace report"
dir = "{{config_root}}/../.."
tools."cargo:cargo-llvm-cov" = "0.9.1"
run = "echo 'coverage:windows:collect requires native Windows' >&2; exit 1"
run_windows = "pwsh.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packages/kuru-delivery/support/windows-coverage.ps1 -Mode Collect"

[tasks."coverage:windows:collect".env]
KURU_TEST_SUPERVISOR_PREPARED = false

[tasks."build"]
run = "cargo build -p kuru-delivery --all-features --locked"

[tasks."build:release"]
run = "cargo build -p kuru-delivery --release --all-features --locked"

[tasks."test"]
env.RUST_TEST_THREADS = "2"
tools."aqua:cocogitto/cocogitto" = "{{vars.kuru_cocogitto_version}}"
tools."github:jdx/communique" = "{{vars.kuru_communique_version}}"
run = "cargo test -p kuru-delivery --all-targets --all-features --locked --no-fail-fast"

[tasks."typecheck"]
run = "cargo check -p kuru-delivery --all-targets --all-features --locked"

[tasks."lint"]
run = "cargo clippy -p kuru-delivery --all-targets --all-features --locked -- -D warnings"

[tasks."lint:shell"]
description = "Check the compiler-free release bootstrap"
run = "shellcheck support/install.sh"

[tasks.tool]
dir = "{{config_root}}/../.."
run = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-delivery --"

[tasks.release]
dir = "{{config_root}}/../.."
tools."aqua:cocogitto/cocogitto" = "{{vars.kuru_cocogitto_version}}"
tools."github:jdx/communique" = "{{vars.kuru_communique_version}}"
run = "cargo run -p kuru-delivery --features tooling --locked --bin kuru-release --"

[tasks."check:repo"]
run = "mise run tool -- repo --root ."

[tasks.package]
run = "mise run tool -- package"

[tasks."test:install"]
run = [
  "cargo test -p kuru-delivery --all-features --locked archive::tests",
  "cargo test -p kuru-delivery --all-features --locked --test bootstrap_install",
]

[tasks."verify:published-windows"]
description = "Verify the exact published Windows release through ordinary mise"
dir = "{{config_root}}/../.."
run = "echo 'verify:published-windows requires native Windows' >&2; exit 1"
run_windows = "pwsh.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packages/kuru-delivery/support/verify-published-windows.ps1"
