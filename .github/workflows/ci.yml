name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise run setup
      - name: Tool lock drift
        run: git diff --exit-code -- mise.lock apps/kuru-docs/mise.lock apps/kuru-docs/package-lock.json packages/kuru-delivery/mise.lock Cargo.lock
      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
      - run: mise run check
      - name: Source install smoke
        env:
          KURU_INSTALL_DIR: ${{ runner.temp }}/kuru-bin
        run: |
          mise run install
          "$KURU_INSTALL_DIR/kuru" --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}
          path: target/coverage.lcov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: documentation-preview
          path: apps/kuru-docs/.vitepress/dist
          include-hidden-files: true

  ci-gate:
    if: always()
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform check
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$CHECK_RESULT" = success
