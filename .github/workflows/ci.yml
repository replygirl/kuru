name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_LOCKED: "1"
  MISE_NO_HOOKS: "1"
  # CI and release builds stay outside the maintainer mr-boxington cache.
  KURU_MBX: "0"

# DRAFT: not for merge. This branch only gathers macOS Dolt failure evidence;
# the quality, native-build and native-platform legs are removed and native
# tests run on macos-latest only.
jobs:
  native-tests:
    strategy:
      fail-fast: false
      matrix:
        # DRAFT: not for merge. macOS 26 only.
        os: [macos-latest]
    uses: ./.github/workflows/native-tests.yml
    with:
      ref: ${{ github.sha }}
      os: ${{ matrix.os }}
      install: true
      artifact-prefix: ci

  ci-gate:
    if: always()
    # DRAFT: not for merge. Only the retained macOS evidence legs gate.
    needs: [native-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every static and native check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$RESULTS"
