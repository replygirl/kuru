name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_LOCKED: "1"
  MISE_NO_HOOKS: "1"
  # CI and release builds stay outside the maintainer mr-boxington cache.
  KURU_MBX: "0"
  # Jobs install only their mise-action install_args. Windows exe shims run
  # `mise x`, which would otherwise download every other configured tool.
  MISE_EXEC_AUTO_INSTALL: "false"
  # `mise run` would otherwise install every missing configured tool first.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ github.sha }}
      artifact-prefix: ci

  windows-lint:
    # Rust compiles `cfg(windows)` items only for a Windows target, so the
    # Ubuntu Lint job never sees them. This static job lints them by
    # cross-target Clippy on Ubuntu: the delivery package's stand-in C
    # toolchain lets build scripts finish without compiling C, and Clippy
    # never links. The native-tests Windows jobs still prove that the code
    # compiles, links and behaves on Windows.
    name: Lint (x86_64-pc-windows-msvc)
    needs: bundle-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      # Import the run's verified bundle inputs; never download them here.
      KURU_DOLT_BUNDLE_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select private bundle build inputs
        shell: bash
        # Leave the leaf absent so the preparer creates this runner's private ACLs.
        run: printf 'KURU_DOLT_BUNDLE_DIR=%s/kuru-bundles\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install the Windows standard library and Clippy
        run: |
          rustup target add x86_64-pc-windows-msvc --toolchain 1.98.1
          rustup component add clippy --toolchain 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: windows-lint
          # Restrict saves to main so PR runs never thrash the shared cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Download the run's verified bundle inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-bundle-inputs-ubuntu-latest
          path: ${{ runner.temp }}/bundle-inputs
      - name: Import the run's verified bundle inputs
        shell: bash
        run: |
          # bundle:prepare checks each archive against its committed pin again.
          cd -- "$RUNNER_TEMP/bundle-inputs"
          shopt -s nullglob
          archives=(*.archive)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo 'The verified bundle input artifact holds no archive' >&2
            exit 1
          fi
          cd -- "$GITHUB_WORKSPACE"
          for archive in "${archives[@]}"; do
            mise run //packages/kuru-memory:bundle:prepare -- --target "${archive%.archive}" --archive "$RUNNER_TEMP/bundle-inputs/$archive" --offline
          done
      - name: Lint Windows-only Rust
        run: mise run lint:windows
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- mise.lock Cargo.lock

  bundle-inputs:
    # Partitions never download engine archives: this job prepares each
    # pinned upstream archive once, through the same checksum-verifying
    # bundle:prepare, and publishes one set per partition runner label. Each
    # partition imports its set with --archive --offline into its own private
    # bundle directory, where bundle:prepare checks the committed pin again.
    # Windows on Arm's engine is built from source by bundle-build instead.
    name: Verified bundle inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select private bundle build inputs
        shell: bash
        # Leave the leaf absent so the preparer creates this runner's private ACLs.
        run: printf 'KURU_DOLT_BUNDLE_DIR=%s/kuru-bundles\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: bundle-inputs
          # Restrict saves to main so PR runs never thrash the shared cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare each pinned upstream archive once
        shell: bash
        run: |
          manifest=packages/kuru-memory/support/dolt-assets.json
          inputs="$RUNNER_TEMP/kuru-bundle-inputs"
          # Each label's partitions need their host engine and the Windows x64
          # archive that the host-independent decoder tests read.
          fixture=x86_64-pc-windows-msvc
          declare -A sets=(
            [ubuntu-latest]="x86_64-unknown-linux-gnu $fixture"
            [ubuntu-24.04-arm]="aarch64-unknown-linux-gnu $fixture"
            [macos-latest]="aarch64-apple-darwin $fixture"
            [windows-latest]="$fixture"
            [windows-11-arm]="$fixture"
          )
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin "$fixture"; do
            mise run //packages/kuru-memory:bundle:prepare -- --target "$target"
          done
          for label in "${!sets[@]}"; do
            mkdir -p "$inputs/$label"
            for target in ${sets[$label]}; do
              sha=$(jq -er --arg target "$target" '.assets[] | select(.target == $target) | .archive_sha256' "$manifest")
              cp -- "$KURU_DOLT_BUNDLE_DIR/$sha.archive" "$inputs/$label/$target.archive"
            done
          done
      # One artifact per label, named without the attempt so that rerun
      # partitions import the set this run already verified.
      - name: Publish the ubuntu-latest bundle inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-bundle-inputs-ubuntu-latest
          path: ${{ runner.temp }}/kuru-bundle-inputs/ubuntu-latest
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Publish the ubuntu-24.04-arm bundle inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-bundle-inputs-ubuntu-24.04-arm
          path: ${{ runner.temp }}/kuru-bundle-inputs/ubuntu-24.04-arm
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Publish the macos-latest bundle inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-bundle-inputs-macos-latest
          path: ${{ runner.temp }}/kuru-bundle-inputs/macos-latest
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Publish the windows-latest bundle inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-bundle-inputs-windows-latest
          path: ${{ runner.temp }}/kuru-bundle-inputs/windows-latest
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Publish the windows-11-arm bundle inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-bundle-inputs-windows-11-arm
          path: ${{ runner.temp }}/kuru-bundle-inputs/windows-11-arm
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  native-tests:
    needs: bundle-inputs
    strategy:
      fail-fast: false
      matrix:
        # Windows on Arm runs its partitions uninstrumented as behavioral
        # evidence until a pinned toolchain carries the fix for
        # rust-lang/rust#150123. native-tests.yml selects that mode from the
        # windows-11-arm label; coverage::PARTITIONS only validates the
        # label and mode, failing closed on any other combination.
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    uses: ./.github/workflows/native-tests.yml
    with:
      ref: ${{ github.sha }}
      os: ${{ matrix.os }}
      install: true
      artifact-prefix: ci
      bundle-inputs: ci-bundle-inputs

  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      MISE_LOCKED: "1"
      # Native archive and memory tests need only the pinned Rust toolchain.
      MISE_NO_HOOKS: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select private bundle build inputs
        shell: bash
        # Leave the leaf absent so the preparer creates this runner's private ACLs.
        # Cargo's restored target/ cache must not supply these directory grants.
        run: printf 'KURU_DOLT_BUNDLE_DIR=%s/kuru-bundles\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The save-time cleanup keeps only build, .fingerprint and deps in each
      # profile directory, so no private kuru-test-supervisors snapshot under
      # target/<profile> is ever archived.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: native-build-${{ matrix.target }}
          # Restrict saves to main so PR runs never thrash the shared cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and package native executable
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          mise run //apps/kuru-tui:build:release -- --target "$RELEASE_TARGET"
          version=$("target/$RELEASE_TARGET/release/kuru" --version)
          version=${version#kuru }
          mise run package -- --binary "target/$RELEASE_TARGET/release/kuru" --target "$RELEASE_TARGET" --version "$version"
          git diff --exit-code --name-only HEAD
      - name: Verify packaged offline runtime
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/kuru
        run: mise run //apps/kuru-tui:test:embedded-runtime

  native-memory:
    # The arm64 host runs the complete real-memory suite through the same
    # checked partitions as coverage, uninstrumented: every partition builds
    # the kuru-memory test inventory into a fresh target, lists each test
    # executable and runs only its assigned tests by exact name.
    name: Native memory partition (ubuntu-24.04-arm, ${{ matrix.partition }})
    needs: bundle-inputs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Must equal PARTITIONS in packages/kuru-delivery/src/coverage.rs.
        partition: [1, 2, 3]
    env:
      MISE_LOCKED: "1"
      MISE_NO_HOOKS: "1"
      CARGO_INCREMENTAL: "0"
      # Import the run's verified bundle inputs; never download them here.
      KURU_DOLT_BUNDLE_OFFLINE: "true"
    steps:
      - name: Record the job start for the inner test deadline
        shell: bash
        run: printf 'KURU_COVERAGE_JOB_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select private bundle build inputs
        shell: bash
        # Leave the leaf absent so the preparer creates this runner's private ACLs.
        # Cargo's restored target/ cache must not supply these directory grants.
        run: printf 'KURU_DOLT_BUNDLE_DIR=%s/kuru-bundles-partition-${{ matrix.partition }}-${{ github.run_attempt }}\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: helper-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          # The partition targets live in runner.temp and are never cached here.
          shared-key: native-memory-aarch64-unknown-linux-gnu
          save-if: ${{ matrix.partition == 1 && github.ref == 'refs/heads/main' }}
      # test:partition declares these pinned fixture tools and task auto-install
      # is disabled, so install them explicitly as the coverage partitions do.
      - name: Install package-owned test tools
        run: mise run //packages/kuru-delivery:setup:test-tools
      # Allow-listed non-workspace dependency outputs exported by a successful
      # main partition. A missing or evicted seed only makes the build slower.
      - id: seed
        name: Restore the uninstrumented dependency seed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kuru-coverage-seed
          key: kuru-coverage-seed-v1-ubuntu-24.04-arm-uninstrumented-${{ hashFiles('Cargo.lock', 'mise.toml', 'mise.lock') }}
          restore-keys: kuru-coverage-seed-v1-ubuntu-24.04-arm-uninstrumented-
      - name: Select the dependency seed export
        if: github.ref == 'refs/heads/main' && matrix.partition == 1 && steps.seed.outputs.cache-hit != 'true'
        shell: bash
        # Absent everywhere else, so only this partition exports after its receipt.
        run: printf 'KURU_COVERAGE_SEED_EXPORT=%s/kuru-coverage-seed-export\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Download the run's verified bundle inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-bundle-inputs-ubuntu-24.04-arm
          path: ${{ runner.temp }}/bundle-inputs
      - name: Import the run's verified bundle inputs
        shell: bash
        run: |
          # bundle:prepare checks each archive against its committed pin again.
          cd -- "$RUNNER_TEMP/bundle-inputs"
          shopt -s nullglob
          archives=(*.archive)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo 'The verified bundle input artifact holds no archive' >&2
            exit 1
          fi
          cd -- "$GITHUB_WORKSPACE"
          for archive in "${archives[@]}"; do
            mise run //packages/kuru-memory:bundle:prepare -- --target "${archive%.archive}" --archive "$RUNNER_TEMP/bundle-inputs/$archive" --offline
          done
      - name: Run one checked memory partition
        shell: bash
        env:
          KURU_COVERAGE_OS: ubuntu-24.04-arm
          KURU_COVERAGE_PACKAGES: kuru-memory
          # One fixed path per job, so seeded build-script and dep-info paths match.
          KURU_COVERAGE_TARGET: ${{ runner.temp }}/kuru-coverage-target
          KURU_COVERAGE_SOURCE: ${{ github.sha }}
          KURU_COVERAGE_ATTEMPT: ${{ github.run_attempt }}
          KURU_COVERAGE_PARTITION: ${{ matrix.partition }}
          KURU_COVERAGE_PARTITIONS: "3"
          KURU_COVERAGE_OUTPUT: ${{ runner.temp }}/kuru-coverage-evidence-${{ matrix.partition }}-${{ github.run_attempt }}
          KURU_COVERAGE_DIAGNOSTICS: ${{ runner.temp }}/kuru-coverage-diagnostics-${{ matrix.partition }}-${{ github.run_attempt }}
          KURU_COVERAGE_SEED: ${{ runner.temp }}/kuru-coverage-seed
          KURU_COVERAGE_HELPER_CACHE: ${{ steps.helper-cache.outputs.cache-hit }}
          KURU_COVERAGE_SEED_CACHE: ${{ steps.seed.outputs.cache-hit }}
          KURU_COVERAGE_SEED_MATCHED_KEY: ${{ steps.seed.outputs.cache-matched-key }}
          # Must equal this job's timeout-minutes.
          KURU_COVERAGE_JOB_MINUTES: "45"
        run: mise run //packages/kuru-delivery:test:partition
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- mise.lock Cargo.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-coverage-ubuntu-24.04-arm-partition-${{ matrix.partition }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuru-coverage-evidence-${{ matrix.partition }}-${{ github.run_attempt }}
          if-no-files-found: error
      - name: Upload failed partition diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-coverage-diagnostics-ubuntu-24.04-arm-partition-${{ matrix.partition }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuru-coverage-diagnostics-${{ matrix.partition }}-${{ github.run_attempt }}
          if-no-files-found: warn
      - name: Stage the exported dependency seed
        if: env.KURU_COVERAGE_SEED_EXPORT != ''
        shell: bash
        run: |
          # Import moved entries out of the restored seed; never save that remainder.
          rm -rf -- "$RUNNER_TEMP/kuru-coverage-seed"
          if [ -d "$KURU_COVERAGE_SEED_EXPORT" ]; then
            mv -- "$KURU_COVERAGE_SEED_EXPORT" "$RUNNER_TEMP/kuru-coverage-seed"
            echo 'KURU_COVERAGE_SEED_READY=true' >> "$GITHUB_ENV"
          else
            echo '::notice::No dependency seed export was produced; nothing will be saved'
          fi
      - name: Save the uninstrumented dependency seed
        if: env.KURU_COVERAGE_SEED_READY == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kuru-coverage-seed
          key: ${{ steps.seed.outputs.cache-primary-key }}

  native-memory-merge:
    if: always()
    needs: native-memory
    # Receipt agreement without instrumentation: identical source, toolchain,
    # profile and inventory identity across the three partitions, and
    # per-executable test lists that are disjoint and complete.
    name: Native memory merge (ubuntu-24.04-arm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Require every memory partition job to have succeeded
        shell: bash
        env:
          KURU_COVERAGE_SHARDS_RESULT: ${{ needs.native-memory.result }}
        run: |
          if [ "$KURU_COVERAGE_SHARDS_RESULT" != success ]; then
            echo "Memory partitions finished as '$KURU_COVERAGE_SHARDS_RESULT'; the merge requires success" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: native-memory-merge
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Download every memory partition's evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-coverage-ubuntu-24.04-arm-partition-*
          merge-multiple: false
          path: ${{ runner.temp }}/kuru-coverage-inputs
      - name: Require agreeing memory partition receipts
        shell: bash
        env:
          KURU_COVERAGE_OS: ubuntu-24.04-arm
          KURU_COVERAGE_SOURCE: ${{ github.sha }}
          KURU_COVERAGE_ATTEMPT: ${{ github.run_attempt }}
          KURU_COVERAGE_MODE: uninstrumented
          KURU_COVERAGE_PACKAGES: kuru-memory
          KURU_COVERAGE_PARTITIONS: "3"
          KURU_COVERAGE_INPUTS: ${{ runner.temp }}/kuru-coverage-inputs
          KURU_COVERAGE_REPORT: ${{ runner.temp }}/kuru-coverage-report-${{ github.run_attempt }}/coverage.lcov
        run: |
          mkdir -p "$(dirname "$KURU_COVERAGE_REPORT")"
          mise run //packages/kuru-delivery:coverage:merge
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- mise.lock Cargo.lock
      # merge-summary.json only: an uninstrumented merge writes no LCOV.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ci-coverage-ubuntu-24.04-arm-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuru-coverage-report-${{ github.run_attempt }}
          if-no-files-found: error

  native-platform:
    # The x64 leg enforces the 90% platform coverage gate. Windows on Arm runs
    # the same package tests through the distinct uninstrumented test task, as
    # separately named behavioral evidence that never reports or satisfies
    # coverage, until a pinned toolchain carries the fix for rust-lang/rust#150123.
    name: ${{ matrix.mode == 'coverage' && 'Native platform primitives' || 'Native platform behavior' }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            mode: coverage
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            mode: behavior
    env:
      MISE_LOCKED: "1"
      MISE_NO_HOOKS: "1"
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          install_args: ${{ matrix.mode == 'coverage' && 'rust aqua:taiki-e/cargo-llvm-cov' || 'rust' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Set up platform Rust components
        if: matrix.mode == 'coverage'
        run: mise run //packages/kuru-platform:setup
      - name: Cache platform Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: native-platform-${{ matrix.target }}
          # Restrict saves to main so PR runs never thrash the shared cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test native platform primitives and require 90% coverage
        if: matrix.mode == 'coverage'
        run: mise run //packages/kuru-platform:coverage
      - name: Test native platform primitives uninstrumented as behavioral evidence
        if: matrix.mode == 'behavior'
        run: mise run //packages/kuru-platform:test
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- mise.lock Cargo.lock
      - name: Upload native platform coverage
        if: ${{ matrix.mode == 'coverage' && !cancelled() && (success() || hashFiles('target/kuru-platform-coverage.lcov') != '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-native-platform-${{ matrix.target }}
          path: target/kuru-platform-coverage.lcov
          if-no-files-found: error

  usage-scan-scaling:
    # Gating check that the usage-ledger startup scan grows at most linearly
    # with ledger size: cold gated owner opens of aged stores at 1,000 and
    # 5,000 conversations (4,000 and 20,000 usage rows), timed from the owner
    # open timeline (usage-pool to usage-scan-1). The bounds are provisional
    # until the validation-record change lands calibrated bounds with their
    # derivation. Unix only: the owner timeline is inert on Windows.
    name: Usage scan scaling (ubuntu-latest, provisional bounds)
    needs: bundle-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      # Import the run's verified bundle inputs; never download them here.
      KURU_DOLT_BUNDLE_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select private bundle build inputs and the fixture root
        shell: bash
        # Leave the leaf absent so the preparer creates this runner's private ACLs.
        # Cargo's restored target/ cache must not supply these directory grants.
        # The fixture root is one fixed path: the owner binds each store's
        # scope to its project's canonical path, which the seal records.
        run: |
          {
            printf 'KURU_DOLT_BUNDLE_DIR=%s/kuru-bundles-usage-scan-${{ github.run_attempt }}\n' "$RUNNER_TEMP"
            printf 'KURU_USAGE_SCAN_ROOT=%s/kuru-usage-scan\n' "$RUNNER_TEMP"
            printf 'KURU_USAGE_SCAN_EVIDENCE=%s/kuru-usage-scan-evidence\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
      - name: Reserve space for the aged fixtures and the release build
        shell: bash
        run: |
          # This Rust job does not use the hosted image's mobile or Swift SDKs.
          df -h /
          for sdk in /usr/local/lib/android /usr/share/swift; do
            if [ -d "$sdk" ]; then
              sudo du -sh "$sdk"
              sudo rm -rf -- "$sdk"
            fi
          done
          df -h /
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The save-time cleanup keeps only build, .fingerprint and deps in each
      # profile directory, so no private kuru-test-supervisors snapshot under
      # target/release is ever archived.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: usage-scan-scaling
          # Restrict saves to main so PR runs never thrash the shared cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Download the run's verified bundle inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-bundle-inputs-ubuntu-latest
          path: ${{ runner.temp }}/bundle-inputs
      - name: Import the run's verified bundle inputs
        shell: bash
        run: |
          # bundle:prepare checks each archive against its committed pin again.
          cd -- "$RUNNER_TEMP/bundle-inputs"
          shopt -s nullglob
          archives=(*.archive)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo 'The verified bundle input artifact holds no archive' >&2
            exit 1
          fi
          cd -- "$GITHUB_WORKSPACE"
          for archive in "${archives[@]}"; do
            mise run //packages/kuru-memory:bundle:prepare -- --target "${archive%.archive}" --archive "$RUNNER_TEMP/bundle-inputs/$archive" --offline
          done
      # Builds the release kuru-memory test-support tooling once, through the
      # first store's creation; every later step reuses it.
      - name: Build the release tooling and create the fixture stores
        shell: bash
        run: |
          started=$(date +%s)
          for n in 1000 5000; do
            mise run //packages/kuru-memory:measure:usage-scan:fixture -- create --root "$KURU_USAGE_SCAN_ROOT" --conversations "$n"
          done
          echo "Release tooling build and store creation: $(( $(date +%s) - started )) s"
      # The fixture is never cached: even after DOLT_GC the two aged stores
      # exceed the shared Actions cache budget (see docs/development.md), so
      # every run ages them here and never skips the check. Sequential, so the
      # 5k ageing time is a clean number for the decision rule.
      - name: Age the fixture stores in-job
        shell: bash
        run: |
          root=$KURU_USAGE_SCAN_ROOT
          mkdir -p -- "$KURU_USAGE_SCAN_EVIDENCE"
          for n in 1000 5000; do
            if ! mise run //packages/kuru-memory:measure:age-store -- --profile release \
              --data-dir "$root/data-$n" --conversations "$n" --turns 1 --seed 1 \
              > "$root/age-$n.json" 2> "$KURU_USAGE_SCAN_EVIDENCE/age-$n.log"; then
              tail -n 50 -- "$KURU_USAGE_SCAN_EVIDENCE/age-$n.log" >&2
              exit 1
            fi
            cat -- "$root/age-$n.json"
          done
          mise run //packages/kuru-memory:measure:usage-scan:fixture -- seal --root "$root"
          # Each file also holds the task's dependency output before the report.
          elapsed() {
            jq -enR '[inputs | fromjson? | select(.format? == "kuru.aged-store") | .elapsed_ms] | if length == 1 then .[0] else error("expected one kuru.aged-store line") end' "$1"
          }
          small=$(elapsed "$root/age-1000.json")
          large=$(elapsed "$root/age-5000.json")
          verdict=keep
          if [ "$large" -gt 1200000 ]; then verdict='switch to a bulk-seeded fixture'; fi
          line="Cold in-job ageing on ubuntu-latest: 1000 conversations ${small} ms, 5000 conversations ${large} ms (decision rule: fall back to a bulk-seeded fixture if 5000 exceeds 1200000 ms): ${verdict}"
          echo "$line"
          printf '%s\n\n' "$line" >> "$GITHUB_STEP_SUMMARY"
          du -sh -- "$root"/data-*/memory
      # Prints the per-size scan rows, the ratio and the provisional bounds on
      # every run, and every timeline on a failed assertion. After the
      # validation-record change it also asserts that a recorded reopen
      # decodes 0 usage rows; not asserted now, because every writable open
      # scans until then.
      - name: Measure and assert the usage scan growth (provisional bounds)
        shell: bash
        run: |
          mise run //packages/kuru-memory:measure:usage-scan -- --root "$KURU_USAGE_SCAN_ROOT" \
            --evidence "$KURU_USAGE_SCAN_EVIDENCE" --samples 5 --assert \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- mise.lock Cargo.lock
      - name: Upload the usage scan records and timelines
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-usage-scan-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kuru-usage-scan-evidence
            ${{ runner.temp }}/kuru-usage-scan/fixture.json
            ${{ runner.temp }}/kuru-usage-scan/age-*.json
            ${{ runner.temp }}/kuru-usage-scan/create-*.log
          if-no-files-found: warn

  ci-gate:
    if: always()
    needs: [bundle-inputs, quality, windows-lint, native-tests, native-build, native-memory, native-memory-merge, native-platform, usage-scan-scaling]
    runs-on: ubuntu-latest
    steps:
      - name: Require every static and native check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$RESULTS"
