name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise run setup
      - run: mise run check
      - name: Match tag to workspace version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'release tag must match workspace version'
          PY

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.3
          install_args: rust python
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build native executable
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo build --release --locked -p kuru --target "$RELEASE_TARGET"
          "target/$RELEASE_TARGET/release/kuru" --version
          python3 scripts/package_release.py --binary "target/$RELEASE_TARGET/release/kuru" --target "$RELEASE_TARGET" --version "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Assemble and verify checksums
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          cd dist
          sha256sum --check SHA256SUMS
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes dist/*.tar.gz dist/SHA256SUMS
