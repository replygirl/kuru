name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Conventional version bump
        type: choice
        options: [auto, major, minor, patch]
        default: auto

permissions:
  contents: read

env:
  # Root aliases launch nested mise processes; freeze their lock writers too.
  MISE_LOCKED: "1"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GitHub preserves this event SHA when rerunning all jobs.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check release prerequisites
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_COMMUNIQUE }}
        run: |
          test -n "$RELEASE_APP_ID" || { echo 'Missing RELEASE_APP_ID variable'; exit 1; }
          test -n "$RELEASE_APP_PRIVATE_KEY" || { echo 'Missing RELEASE_APP_PRIVATE_KEY secret'; exit 1; }
          test -n "$ANTHROPIC_API_KEY" || { echo 'Missing ANTHROPIC_API_KEY_COMMUNIQUE secret'; exit 1; }
      - run: mise run setup
      - run: mise run check
      - name: Select immutable release base and version
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
        run: mise run release:tool -- plan --bump "$BUMP"

  bump:
    needs: plan
    runs-on: ubuntu-24.04
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust aqua:jdx/hk
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify tool setup preserved the release source
        run: git diff --exit-code --name-only HEAD
      - name: Stamp workspace package versions
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: mise run release:tool -- stamp "$RELEASE_VERSION"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Create or recover the exact signed version commit
        id: commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          EXPECTED_SHA: ${{ needs.plan.outputs.base_sha }}
        run: mise run release:tool -- commit --version "$RELEASE_VERSION" --expected-sha "$EXPECTED_SHA"

  verify:
    needs: bump
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise run setup
      - run: mise run check

  build:
    needs: [plan, bump, verify]
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      # Archive jobs do not write Git commits or need repository-hook setup.
      MISE_NO_HOOKS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build and package native executable
        if: runner.os != 'Windows'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mise run //apps/kuru-tui:build:release -- --target "$RELEASE_TARGET"
          test "$("target/$RELEASE_TARGET/release/kuru" --version)" = "kuru $RELEASE_VERSION"
          mise run package -- --binary "target/$RELEASE_TARGET/release/kuru" --target "$RELEASE_TARGET" --version "$RELEASE_VERSION"
      - name: Build and package native Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mise run //apps/kuru-tui:build:release -- --target $env:RELEASE_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          $binary = "target/$env:RELEASE_TARGET/release/kuru.exe"
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "kuru $env:RELEASE_VERSION") { throw 'Release version mismatch' }
          mise run package -- --binary $binary --target $env:RELEASE_TARGET --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Release packaging failed' }
      - name: Verify packaged offline runtime
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/kuru${{ runner.os == 'Windows' && '.exe' || '' }}
        run: mise run //apps/kuru-tui:test:embedded-runtime
      - name: Inspect native shipping DLL imports
        if: runner.os == 'Windows'
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/kuru.exe
        run: mise run //apps/kuru-tui:verify:windows-imports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          overwrite: true

  notes:
    # Generate read-only notes alongside final validation to surface failures
    # earlier. Publication still requires every native build.
    needs: [plan, bump]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust aqua:jdx/hk
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install package-owned release tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run //packages/kuru-delivery:setup
      - name: Generate notes without publishing
        env:
          # Communiqué's OpenAI wire adapter calls Anthropic's compatibility API.
          OPENAI_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_COMMUNIQUE }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.bump.outputs.sha }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: mise run release:tool -- notes --sha "$RELEASE_SHA" --version "$RELEASE_VERSION" --output RELEASE_NOTES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [plan, bump, build, notes]
    runs-on: ubuntu-24.04
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust aqua:jdx/hk
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*-*-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
      - name: Verify assets and publish complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.bump.outputs.sha }}
        run: mise run release:tool -- publish --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --directory dist --notes RELEASE_NOTES.md

  # Keep documentation in this release run, built from its published commit.
  # To recover a docs-only failure, rerun these jobs on the same release run.
  build-docs:
    name: Build docs
    needs: [bump, publish]
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust aqua:jdx/hk
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise run //apps/kuru-docs:setup
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Build and validate public documentation
        env:
          KURU_DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          mise run docs:build
          mise run //packages/kuru-delivery:tool -- docs --base "$KURU_DOCS_BASE"
      - name: Select this build attempt's Pages artifact
        id: artifact
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: printf 'name=github-pages-%s\n' "$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: apps/kuru-docs/.vitepress/dist

  deploy-docs:
    name: Deploy docs
    needs: build-docs
    runs-on: ubuntu-24.04
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        with:
          # A deploy-only retry retains the prior successful build's output.
          artifact_name: ${{ needs.build-docs.outputs.artifact_name }}
