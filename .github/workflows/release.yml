name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Conventional version bump
        type: choice
        options: [auto, major, minor, patch]
        default: auto

permissions:
  contents: read

env:
  # Root aliases launch nested mise processes; freeze their lock writers too.
  MISE_LOCKED: "1"
  # CI and release builds stay outside the maintainer mr-boxington cache.
  KURU_MBX: "0"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  source-quality:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ github.sha }}
      artifact-prefix: validation-plan

  tests:
    if: github.ref == 'refs/heads/main'
    # One ordinary native test pass on the dispatch SHA. The 90% coverage gate
    # is enforced per OS by CI on pull requests, merge groups and main, and the
    # staged candidate is accepted on every supported platform below.
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MISE_NO_HOOKS: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Keep the genuine test-profile Kuru input below its production archive bound.
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select private bundle build inputs
        shell: bash
        # Leave the leaf absent so the preparer creates this runner's private ACLs.
        run: printf 'KURU_DOLT_BUNDLE_DIR=%s/kuru-bundles\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Reserve space for bundled runtime tests
        shell: bash
        run: |
          # This Rust/Node job does not use the hosted image's mobile or Swift SDKs.
          df -h /
          for sdk in /usr/local/lib/android /usr/share/swift; do
            if [ -d "$sdk" ]; then
              sudo du -sh "$sdk"
              sudo rm -rf -- "$sdk"
            fi
          done
          df -h /
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          # Cospec is exercised by delivery's real standalone contract tests.
          install_args: rust github:aligned-team/cospec
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install package-owned test tools
        run: mise run //packages/kuru-delivery:setup:test-tools
      - name: Install Ubuntu native secret-store fixture tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus gnome-keyring libsecret-tools
      - name: Run Ubuntu native tests with the OS secret store
        shell: bash
        run: |
          # The Linux keyring backend requires the real Secret Service default
          # collection. Give this headless runner its own session and fixture
          # collection; never use a file-backed replacement or provider store.
          fixture_root=$(mktemp -d "$RUNNER_TEMP/kuru-native-store.XXXXXX")
          chmod 700 "$fixture_root"
          mkdir -m 700 "$fixture_root/data" "$fixture_root/runtime"
          # Preserve the installed pinned tools before XDG_DATA_HOME is made
          # private for this test session's native keyring.
          export MISE_DATA_DIR="${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}"
          export XDG_DATA_HOME="$fixture_root/data"
          export XDG_RUNTIME_DIR="$fixture_root/runtime"
          cleanup_fixture() {
            status=$?
            trap - EXIT
            rm -rf -- "$fixture_root"
            exit "$status"
          }
          trap cleanup_fixture EXIT
          dbus-run-session -- bash -euo pipefail <<'KURU_NATIVE_STORE'
            printf '%s' 'kuru-ci-fixture-only-password' |
              gnome-keyring-daemon --foreground --unlock --components=secrets \
                >"$XDG_RUNTIME_DIR/daemon.log" 2>&1 &
            daemon_pid=$!
            cleanup_daemon() {
              status=$?
              trap - EXIT
              kill "$daemon_pid" 2>/dev/null || true
              wait "$daemon_pid" 2>/dev/null || true
              exit "$status"
            }
            trap cleanup_daemon EXIT
            # NameHasOwner queries the bus itself and cannot auto-activate a
            # second keyring daemon before this owned one claims the name.
            owned=0
            for attempt in {1..10}; do
              if ! kill -0 "$daemon_pid" 2>/dev/null; then
                break
              fi
              owner_reply=$(dbus-send --session --print-reply \
                --dest=org.freedesktop.DBus /org/freedesktop/DBus \
                org.freedesktop.DBus.NameHasOwner \
                string:org.freedesktop.secrets 2>/dev/null || true)
              if [[ "$owner_reply" == *'boolean true'* ]]; then
                owned=1
                break
              fi
              sleep 1
            done
            if [ "$owned" -ne 1 ]; then
              echo 'Owned Secret Service daemon did not claim the session bus' >&2
              exit 1
            fi
            # Probe the default collection with fake bytes before running the
            # actual OS-store tests. A missing service fails setup, not coverage.
            ready=0
            for attempt in {1..10}; do
              if ! kill -0 "$daemon_pid" 2>/dev/null; then
                break
              fi
              if printf '%s' 'kuru-ci-probe-only' |
                timeout 5s secret-tool store --label='Kuru CI probe' kuru-ci-fixture probe \
                  >/dev/null 2>&1; then
                if [ "$(timeout 5s secret-tool lookup kuru-ci-fixture probe)" = 'kuru-ci-probe-only' ]; then
                  ready=1
                  break
                fi
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo 'Native Secret Service default collection did not start' >&2
              exit 1
            fi
            secret-tool clear kuru-ci-fixture probe >/dev/null
            mise run test
          KURU_NATIVE_STORE
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- mise.lock apps/kuru-docs/mise.lock apps/kuru-docs/package-lock.json packages/kuru-delivery/mise.lock Cargo.lock

  plan:
    if: github.ref == 'refs/heads/main'
    needs: [source-quality, tests]
    runs-on: ubuntu-24.04
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_NO_HOOKS: "1"
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GitHub preserves this event SHA when rerunning all jobs.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check release prerequisites
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_COMMUNIQUE }}
        run: |
          test -n "$RELEASE_APP_ID" || { echo 'Missing RELEASE_APP_ID variable'; exit 1; }
          test -n "$RELEASE_APP_PRIVATE_KEY" || { echo 'Missing RELEASE_APP_PRIVATE_KEY secret'; exit 1; }
          test -n "$ANTHROPIC_API_KEY" || { echo 'Missing ANTHROPIC_API_KEY_COMMUNIQUE secret'; exit 1; }
      - run: mise run //packages/kuru-delivery:setup:test-tools
      - name: Select immutable release base and version
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
        run: mise run release:tool -- plan --bump "$BUMP"

  bump:
    needs: plan
    runs-on: ubuntu-24.04
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust aqua:jdx/hk
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify tool setup preserved the release source
        run: git diff --exit-code --name-only HEAD
      - name: Stamp workspace package versions
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: mise run release:tool -- stamp "$RELEASE_VERSION"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Create or recover the exact signed version commit
        id: commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          EXPECTED_SHA: ${{ needs.plan.outputs.base_sha }}
        run: mise run release:tool -- commit --version "$RELEASE_VERSION" --expected-sha "$EXPECTED_SHA"

  verify:
    needs: bump
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}
      artifact-prefix: validation-verify

  build:
    needs: [plan, bump, verify]
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      # Archive jobs do not write Git commits or need repository-hook setup.
      MISE_NO_HOOKS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build and package native executable
        if: runner.os != 'Windows'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mise run //apps/kuru-tui:build:release -- --target "$RELEASE_TARGET"
          binary="$PWD/target/$RELEASE_TARGET/release/kuru"
          test "$("$binary" --version)" = "kuru $RELEASE_VERSION"
          before="$(openssl dgst -sha256 "$binary")"
          export KURU_SHELL_SUPPORT_BINARY="$binary"
          export KURU_SHELL_SUPPORT_OUTPUT="$RUNNER_TEMP/kuru-shell-support-$RELEASE_TARGET"
          mise run //apps/kuru-tui:shell-support:generate
          mise run package -- --binary "$binary" --target "$RELEASE_TARGET" --version "$RELEASE_VERSION"
          mise run //packages/kuru-delivery:package:shell-support -- --input "$KURU_SHELL_SUPPORT_OUTPUT" --target "$RELEASE_TARGET" --version "$RELEASE_VERSION"
          test "$before" = "$(openssl dgst -sha256 "$binary")"
      - name: Build and package native Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mise run //apps/kuru-tui:build:release -- --target $env:RELEASE_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          $binary = (Resolve-Path "target/$env:RELEASE_TARGET/release/kuru.exe").Path
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "kuru $env:RELEASE_VERSION") { throw 'Release version mismatch' }
          $before = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash
          $env:KURU_SHELL_SUPPORT_BINARY = $binary
          $env:KURU_SHELL_SUPPORT_OUTPUT = Join-Path $env:RUNNER_TEMP "kuru-shell-support-$env:RELEASE_TARGET"
          mise run //apps/kuru-tui:shell-support:generate
          if ($LASTEXITCODE -ne 0) { throw 'Shell support generation failed' }
          mise run package -- --binary $binary --target $env:RELEASE_TARGET --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Release packaging failed' }
          mise run //packages/kuru-delivery:package:shell-support -- --input $env:KURU_SHELL_SUPPORT_OUTPUT --target $env:RELEASE_TARGET --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Shell support packaging failed' }
          if ($before -ne (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash) { throw 'Release binary changed during support generation' }
      - name: Verify packaged offline runtime
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/kuru${{ runner.os == 'Windows' && '.exe' || '' }}
        run: mise run //apps/kuru-tui:test:embedded-runtime
      - name: Inspect native shipping DLL imports
        if: runner.os == 'Windows'
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/kuru.exe
        run: mise run //apps/kuru-tui:verify:windows-imports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          overwrite: true

  notes:
    # Generate read-only notes alongside final validation to surface failures
    # earlier. Publication still requires every native build.
    needs: [plan, bump]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust aqua:jdx/hk
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install package-owned release tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run //packages/kuru-delivery:setup
      - name: Generate notes without publishing
        env:
          # Communiqué's OpenAI wire adapter calls Anthropic's compatibility API.
          OPENAI_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_COMMUNIQUE }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.bump.outputs.sha }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: mise run release:tool -- notes --sha "$RELEASE_SHA" --version "$RELEASE_VERSION" --output RELEASE_NOTES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error
          overwrite: true

  assemble-candidate:
    needs: [plan, bump, build, notes]
    runs-on: ubuntu-24.04
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust aqua:jdx/hk
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*-*-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
      - name: Validate the complete release candidate
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: mise run release:tool -- assemble --version "$RELEASE_VERSION" --directory dist --notes RELEASE_NOTES.md
      - name: Select this candidate's artifact
        id: artifact
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: printf 'name=release-candidate-%s\n' "$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            dist/*
            RELEASE_NOTES.md
          if-no-files-found: error

  verify-staged:
    # Every leg must pass: jobs that need this matrix wait for all of its legs.
    name: Verify staged release (${{ matrix.target }})
    needs: [plan, bump, assemble-candidate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_NO_HOOKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
      - name: Select private bundle build inputs
        shell: pwsh
        # Leave the leaf absent so the preparer creates this runner's private ACLs.
        run: Add-Content -LiteralPath $env:GITHUB_ENV "KURU_DOLT_BUNDLE_DIR=$env:RUNNER_TEMP/kuru-bundles-staged"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.assemble-candidate.outputs.artifact_name }}
          path: candidate
      # Interim Unix leg: it proves the exact staged executable's checksum, cold
      # offline runtime and previous-release update, but not the mise
      # installation route that the Windows leg proves.
      - name: Extract the exact staged Unix archive
        if: runner.os != 'Windows'
        env:
          RELEASE_ARCHIVE: kuru-${{ needs.plan.outputs.version }}-${{ matrix.target }}.tar.gz
        run: |
          grep -F "  $RELEASE_ARCHIVE" candidate/dist/SHA256SUMS > "$RUNNER_TEMP/kuru-staged.sha256"
          test "$(wc -l < "$RUNNER_TEMP/kuru-staged.sha256")" -eq 1
          (cd candidate/dist && shasum -a 256 -c "$RUNNER_TEMP/kuru-staged.sha256")
          mkdir "$RUNNER_TEMP/kuru-staged"
          tar -xzf "candidate/dist/$RELEASE_ARCHIVE" -C "$RUNNER_TEMP/kuru-staged"
          test -x "$RUNNER_TEMP/kuru-staged/kuru"
      - name: Verify the staged Unix executable's offline runtime
        if: runner.os != 'Windows'
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ runner.temp }}/kuru-staged/kuru
        run: mise run //apps/kuru-tui:test:embedded-runtime
      - name: Accept the staged Unix executable from the previous published release
        if: runner.os != 'Windows'
        env:
          KURU_UPDATE_CANDIDATE_BINARY: ${{ runner.temp }}/kuru-staged/kuru
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run //packages/kuru-delivery:test:previous-release-update
      - name: Verify the exact staged package
        if: runner.os == 'Windows'
        env:
          KURU_STAGED_WINDOWS_ARCHIVE: ${{ github.workspace }}/candidate/dist/kuru-${{ needs.plan.outputs.version }}-x86_64-pc-windows-msvc.zip
          # The task re-runs previous-release update acceptance; the token
          # authenticates only its release listing on api.github.com.
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run //apps/kuru-tui:verify:staged-windows

  # Documentation and staged acceptance must finish before public promotion.
  build-docs:
    name: Build docs
    needs: [bump, assemble-candidate]
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust aqua:jdx/hk
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise run //apps/kuru-docs:setup
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Build and validate public documentation
        env:
          KURU_DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          mise run docs:build
          mise run //packages/kuru-delivery:tool -- docs --base "$KURU_DOCS_BASE"
      - name: Select this build attempt's Pages artifact
        id: artifact
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: printf 'name=github-pages-%s\n' "$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: apps/kuru-docs/.vitepress/dist

  deploy-docs:
    name: Deploy docs
    needs: [build-docs, verify-staged]
    runs-on: ubuntu-24.04
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        with:
          # A deploy-only retry retains the prior successful build's output.
          artifact_name: ${{ needs.build-docs.outputs.artifact_name }}

  # Public promotion follows every acceptance gate. Public-download verification
  # below observes the immutable release and never rolls publication back.
  publish:
    needs: [plan, bump, assemble-candidate, verify-staged, deploy-docs]
    runs-on: ubuntu-24.04
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust aqua:jdx/hk
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.assemble-candidate.outputs.artifact_name }}
      - name: Publish the verified complete candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.bump.outputs.sha }}
        run: mise run release:tool -- publish --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --directory dist --notes RELEASE_NOTES.md

  verify-published-windows:
    name: Verify published Windows download
    needs: [plan, bump, publish]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_NO_HOOKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify the exact public download and cold offline reopen
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.bump.outputs.sha }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KURU_PUBLISHED_WINDOWS_RECEIPT: ${{ runner.temp }}/published-windows-receipt.json
        run: mise run //packages/kuru-delivery:verify:published-windows
      - name: Retain public-download verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-windows-${{ needs.plan.outputs.version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-windows-receipt.json
          if-no-files-found: error
