name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Conventional version bump
        type: choice
        options: [auto, major, minor, patch]
        default: auto

permissions:
  contents: read

env:
  # Root aliases launch nested mise processes; freeze their lock writers too.
  MISE_LOCKED: "1"
  # CI and release builds stay outside the maintainer mr-boxington cache.
  KURU_MBX: "0"
  # Jobs install only their mise-action install_args. Windows exe shims run
  # `mise x`, which would otherwise download every other configured tool.
  MISE_EXEC_AUTO_INSTALL: "false"
  # `mise run` would do the same before each task; jobs install task tools by name.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  source-quality:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ github.sha }}
      artifact-prefix: validation-plan

  tests:
    if: github.ref == 'refs/heads/main'
    # One ordinary native test pass on the dispatch SHA. The coverage gate
    # is enforced per OS by CI on pull requests, merge groups and main, and the
    # staged candidate is accepted on every supported platform below.
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MISE_NO_HOOKS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Keep the genuine test-profile Kuru input below its production archive bound.
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      # The delivery tests bound launches with no budget of their own by this
      # job's inner test deadline, as coverage jobs do, instead of a window
      # from their own first launch.
      - name: Record the job start for the inner test deadline
        shell: bash
        run: printf 'KURU_COVERAGE_JOB_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select private bundle build inputs
        shell: bash
        # Leave the leaf absent so the preparer creates this runner's private ACLs.
        run: printf 'KURU_DOLT_BUNDLE_DIR=%s/kuru-bundles\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Reserve space for bundled runtime tests
        shell: bash
        run: |
          # This Rust/Node job does not use the hosted image's mobile or Swift SDKs.
          df -h /
          for sdk in /usr/local/lib/android /usr/share/swift; do
            if [ -d "$sdk" ]; then
              sudo du -sh "$sdk"
              sudo rm -rf -- "$sdk"
            fi
          done
          df -h /
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          # Cospec is exercised by delivery's real standalone contract tests.
          install_args: rust github:aligned-team/cospec
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install package-owned test tools
        run: mise run //packages/kuru-delivery:setup:test-tools
      - name: Install Ubuntu native secret-store fixture tools
        shell: bash
        # Backstop if a timed-out apt outlives its signal: 2 attempts x 2
        # fetches x 187 s = 748 s, rounded up to whole minutes (GitHub takes
        # integer minutes) = 13; the 32 s left covers the guard and the attempt
        # messages, which take well under a second.
        timeout-minutes: 13
        run: |
          # These packages come from the Ubuntu archive. apt reads only its deb822
          # list and no other sources.list.d entry, so an outage of a third-party
          # repository on the runner image cannot fail this step; errors from the
          # archive still fail it.
          if [ ! -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            echo 'The runner image has no Ubuntu archive list at /etc/apt/sources.list.d/ubuntu.sources' >&2
            exit 1
          fi
          # Runner mirror-list entries can route package indexes through a slow
          # HTTP Azure mirror. Pin only that deb822 URI to the official HTTPS
          # archive, preserving the signed suites and components.
          ubuntu_source=/etc/apt/sources.list.d/ubuntu.sources
          if grep -Fxq 'URIs: mirror+file:/etc/apt/apt-mirrors.txt' "$ubuntu_source"; then
            sudo sed -i 's#^URIs: mirror+file:/etc/apt/apt-mirrors\.txt$#URIs: https://archive.ubuntu.com/ubuntu#' "$ubuntu_source"
          elif ! grep -Eq '^URIs: https://archive\.ubuntu\.com/ubuntu/?$' "$ubuntu_source"; then
            echo 'The Ubuntu archive list has no recognized mirror-list or official HTTPS archive URI' >&2
            exit 1
          fi
          # Job 110454097537 stalled 42 minutes inside apt-get update, past apt's
          # own bounds, so coreutils timeout caps each fetch. The cap lets apt's
          # bounds end a failure first, with apt's own error; derivation in the
          # Measured basis of openspec change bound-apt-fixture-tools-step:
          #   127 s  one stalled item under apt 2.8.3 defaults: (1 + 3 retries)
          #          x 30 s per wait + 1 + 2 + 4 s retry delays (basehttp.cc
          #          TimeOut(30), acquire-item.cc Acquire::Retries 3,
          #          acquire-worker.cc Acquire::Retries::Delay)
          #  + 17 s  that hang's mirror fallback, mirror list to first Hit:
          #  + 43 s  slowest whole step over 200 healthy partition jobs
          #  = 187 s for each fetch
          budget=187
          # The update and install pair runs at most twice; nothing else retries.
          for attempt in 1 2; do
            echo "Ubuntu archive apt attempt $attempt of 2"
            status=0
            timeout "$budget" sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=/dev/null update || status=$?
            if [ "$status" -eq 0 ]; then
              timeout "$budget" sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=/dev/null \
                install -y --no-install-recommends dbus gnome-keyring libsecret-tools || status=$?
            fi
            if [ "$status" -eq 0 ]; then
              exit 0
            elif [ "$attempt" -eq 1 ]; then
              echo "::warning::Ubuntu archive apt attempt 1 of 2 failed with exit status $status (124 = timed out after $budget s), retrying once"
            fi
          done
          echo "::error::Ubuntu archive apt attempt 2 of 2 failed with exit status $status (124 = timed out after $budget s)"
          exit "$status"
      - name: Run Ubuntu native tests with the OS secret store
        shell: bash
        env:
          # Must equal this job's timeout-minutes.
          KURU_COVERAGE_JOB_MINUTES: "60"
        run: |
          # The Linux keyring backend requires the real Secret Service default
          # collection. Give this headless runner its own session and fixture
          # collection; never use a file-backed replacement or provider store.
          fixture_root=$(mktemp -d "$RUNNER_TEMP/kuru-native-store.XXXXXX")
          chmod 700 "$fixture_root"
          mkdir -m 700 "$fixture_root/data" "$fixture_root/runtime"
          # Preserve the installed pinned tools before XDG_DATA_HOME is made
          # private for this test session's native keyring.
          export MISE_DATA_DIR="${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}"
          export XDG_DATA_HOME="$fixture_root/data"
          export XDG_RUNTIME_DIR="$fixture_root/runtime"
          cleanup_fixture() {
            status=$?
            trap - EXIT
            rm -rf -- "$fixture_root"
            exit "$status"
          }
          trap cleanup_fixture EXIT
          dbus-run-session -- bash -euo pipefail <<'KURU_NATIVE_STORE'
            printf '%s' 'kuru-ci-fixture-only-password' |
              gnome-keyring-daemon --foreground --unlock --components=secrets \
                >"$XDG_RUNTIME_DIR/daemon.log" 2>&1 &
            daemon_pid=$!
            cleanup_daemon() {
              status=$?
              trap - EXIT
              kill "$daemon_pid" 2>/dev/null || true
              wait "$daemon_pid" 2>/dev/null || true
              exit "$status"
            }
            trap cleanup_daemon EXIT
            # NameHasOwner queries the bus itself and cannot auto-activate a
            # second keyring daemon before this owned one claims the name.
            owned=0
            for attempt in {1..10}; do
              if ! kill -0 "$daemon_pid" 2>/dev/null; then
                break
              fi
              owner_reply=$(dbus-send --session --print-reply \
                --dest=org.freedesktop.DBus /org/freedesktop/DBus \
                org.freedesktop.DBus.NameHasOwner \
                string:org.freedesktop.secrets 2>/dev/null || true)
              if [[ "$owner_reply" == *'boolean true'* ]]; then
                owned=1
                break
              fi
              sleep 1
            done
            if [ "$owned" -ne 1 ]; then
              echo 'Owned Secret Service daemon did not claim the session bus' >&2
              exit 1
            fi
            # Probe the default collection with fake bytes before running the
            # actual OS-store tests. A missing service fails setup, not coverage.
            ready=0
            for attempt in {1..10}; do
              if ! kill -0 "$daemon_pid" 2>/dev/null; then
                break
              fi
              if printf '%s' 'kuru-ci-probe-only' |
                timeout 5s secret-tool store --label='Kuru CI probe' kuru-ci-fixture probe \
                  >/dev/null 2>&1; then
                if [ "$(timeout 5s secret-tool lookup kuru-ci-fixture probe)" = 'kuru-ci-probe-only' ]; then
                  ready=1
                  break
                fi
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo 'Native Secret Service default collection did not start' >&2
              exit 1
            fi
            secret-tool clear kuru-ci-fixture probe >/dev/null
            mise run test
          KURU_NATIVE_STORE
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- mise.lock apps/kuru-docs/mise.lock apps/kuru-docs/package-lock.json packages/kuru-delivery/mise.lock Cargo.lock

  plan:
    if: github.ref == 'refs/heads/main'
    needs: [source-quality, tests]
    runs-on: ubuntu-latest
    env:
      MISE_NO_HOOKS: "1"
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GitHub preserves this event SHA when rerunning all jobs.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check release prerequisites
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_COMMUNIQUE }}
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
          HOMEBREW_APP_ID: ${{ vars.HOMEBREW_APP_ID }}
          HOMEBREW_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
        run: |
          test -n "$RELEASE_APP_ID" || { echo 'Missing RELEASE_APP_ID variable'; exit 1; }
          test -n "$RELEASE_APP_PRIVATE_KEY" || { echo 'Missing RELEASE_APP_PRIVATE_KEY secret'; exit 1; }
          test -n "$ANTHROPIC_API_KEY" || { echo 'Missing ANTHROPIC_API_KEY_COMMUNIQUE secret'; exit 1; }
          for setting in MACOS_SIGNING_P12_BASE64 MACOS_SIGNING_P12_PASSWORD MACOS_SIGNING_IDENTITY \
            APPLE_TEAM_ID APPLE_NOTARY_KEY_P8 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID \
            AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_SIGNING_ENDPOINT \
            AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE WINDOWS_SIGNING_SUBJECT \
            HOMEBREW_APP_ID HOMEBREW_APP_PRIVATE_KEY; do
            test -n "${!setting}" || { echo "Missing $setting signing/tap configuration"; exit 1; }
          done
      - run: mise run //packages/kuru-delivery:setup:test-tools
      - name: Select immutable release base and version
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
        run: mise run release:tool -- plan --bump "$BUMP"

  bump:
    needs: plan
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          install_args: rust aqua:jdx/hk
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify tool setup preserved the release source
        run: git diff --exit-code --name-only HEAD
      - name: Stamp workspace package versions
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: mise run release:tool -- stamp "$RELEASE_VERSION"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Create or recover the exact signed version commit
        id: commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          EXPECTED_SHA: ${{ needs.plan.outputs.base_sha }}
        run: mise run release:tool -- commit --version "$RELEASE_VERSION" --expected-sha "$EXPECTED_SHA"

  verify:
    needs: bump
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}
      artifact-prefix: validation-verify

  # The Windows on Arm engine is built from source, never downloaded: its legs
  # import this pin-verified input, and bundle:prepare checks the pin again.
  dolt-windows-arm64:
    needs: bump
    uses: ./.github/workflows/bundle-build.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}

  build:
    name: Build native package (${{ matrix.target }})
    needs: [plan, bump, verify, dolt-windows-arm64]
    permissions:
      contents: read
      actions: read
    env:
      # Archive jobs do not write Git commits or need repository-hook setup.
      MISE_NO_HOOKS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Release archives keep a fixed Ubuntu 24.04 glibc floor instead of
          # following the rolling ubuntu-latest alias.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Find retained signed native package
        id: retained
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.bump.outputs.sha }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          mise run release:tool -- retained-package --version $env:RELEASE_VERSION --sha $env:RELEASE_SHA --target $env:RELEASE_TARGET --run-id $env:RELEASE_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw 'Retained package lookup failed' }
      - name: Restore retained signed native package
        if: steps.retained.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.retained.outputs.name }}
          path: dist
      - name: Validate retained signed native package
        if: steps.retained.outputs.found == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          mise run release:tool -- verify-package --directory dist --version $env:RELEASE_VERSION --target $env:RELEASE_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Retained package validation failed' }
      - name: Select private bundle build inputs
        if: matrix.target == 'aarch64-pc-windows-msvc' && steps.retained.outputs.found != 'true'
        shell: pwsh
        # Leave the leaf absent so the preparer creates this runner's private ACLs.
        run: Add-Content -LiteralPath $env:GITHUB_ENV "KURU_DOLT_BUNDLE_DIR=$env:RUNNER_TEMP/kuru-bundles-release"
      - name: Download the Windows arm64 engine input
        if: matrix.target == 'aarch64-pc-windows-msvc' && steps.retained.outputs.found != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.dolt-windows-arm64.outputs.artifact }}
          path: ${{ runner.temp }}/bundle-input
      - name: Import the pin-verified Windows arm64 engine
        if: matrix.target == 'aarch64-pc-windows-msvc' && steps.retained.outputs.found != 'true'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'bundle-input/dolt-windows-arm64.zip'
          mise run //packages/kuru-memory:bundle:prepare -- --target aarch64-pc-windows-msvc --archive $archive --offline
          if ($LASTEXITCODE -ne 0) { throw 'Windows arm64 engine import failed' }
      - name: Build and package native executable
        if: runner.os != 'Windows' && steps.retained.outputs.found != 'true'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mise run //apps/kuru-tui:build:release -- --target "$RELEASE_TARGET"
          binary="$PWD/target/$RELEASE_TARGET/release/kuru"
          test "$("$binary" --version)" = "kuru $RELEASE_VERSION"
          before="$(openssl dgst -sha256 "$binary")"
          export KURU_SHELL_SUPPORT_BINARY="$binary"
          export KURU_SHELL_SUPPORT_OUTPUT="$RUNNER_TEMP/kuru-shell-support-$RELEASE_TARGET"
          mise run //apps/kuru-tui:shell-support:generate
          mise run //packages/kuru-delivery:package:shell-support -- --input "$KURU_SHELL_SUPPORT_OUTPUT" --target "$RELEASE_TARGET" --version "$RELEASE_VERSION"
          test "$before" = "$(openssl dgst -sha256 "$binary")"
      - name: Sign and notarize private macOS executable
        if: runner.os == 'macOS' && steps.retained.outputs.found != 'true'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          KURU_SIGNING_BINARY: ${{ runner.temp }}/kuru-signing-output/kuru
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          binary="$PWD/target/$RELEASE_TARGET/release/kuru"
          before="$(openssl dgst -sha256 "$binary")"
          mise run release:tool -- signing-prepare --binary "$binary" --target "$RELEASE_TARGET" --output "$RUNNER_TEMP/kuru-signing-output"
          mise run //packages/kuru-delivery:sign:macos
          mise run release:tool -- signing-verify --binary "$KURU_SIGNING_BINARY" --target "$RELEASE_TARGET" --publisher "$APPLE_TEAM_ID"
          test "$before" = "$(openssl dgst -sha256 "$binary")"
      - name: Package verified Unix executable
        if: runner.os != 'Windows' && steps.retained.outputs.found != 'true'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          binary="$PWD/target/$RELEASE_TARGET/release/kuru"
          if [ "$RUNNER_OS" = macOS ]; then binary="$RUNNER_TEMP/kuru-signing-output/kuru"; fi
          mise run package -- --binary "$binary" --target "$RELEASE_TARGET" --version "$RELEASE_VERSION"
      - name: Build and package native Windows executable
        if: runner.os == 'Windows' && steps.retained.outputs.found != 'true'
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mise run //apps/kuru-tui:build:release -- --target $env:RELEASE_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          $binary = (Resolve-Path "target/$env:RELEASE_TARGET/release/kuru.exe").Path
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "kuru $env:RELEASE_VERSION") { throw 'Release version mismatch' }
          $before = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash
          $env:KURU_SHELL_SUPPORT_BINARY = $binary
          $env:KURU_SHELL_SUPPORT_OUTPUT = Join-Path $env:RUNNER_TEMP "kuru-shell-support-$env:RELEASE_TARGET"
          mise run //apps/kuru-tui:shell-support:generate
          if ($LASTEXITCODE -ne 0) { throw 'Shell support generation failed' }
          mise run release:tool -- signing-prepare --binary $binary --target $env:RELEASE_TARGET --output "$env:RUNNER_TEMP/kuru-signing-input"
          if ($LASTEXITCODE -ne 0) { throw 'Signing copy preparation failed' }
          mise run //packages/kuru-delivery:package:shell-support -- --input $env:KURU_SHELL_SUPPORT_OUTPUT --target $env:RELEASE_TARGET --version $env:RELEASE_VERSION --output "$env:RUNNER_TEMP/kuru-signing-input"
          if ($LASTEXITCODE -ne 0) { throw 'Shell support packaging failed' }
          if ($before -ne (Get-FileHash -Algorithm SHA256 -LiteralPath $binary).Hash) { throw 'Release binary changed during support generation' }
      - name: Verify packaged offline runtime
        if: steps.retained.outputs.found != 'true'
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/kuru${{ runner.os == 'Windows' && '.exe' || '' }}
        run: mise run //apps/kuru-tui:test:embedded-runtime
      - name: Inspect native shipping DLL imports
        if: runner.os == 'Windows' && steps.retained.outputs.found != 'true'
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/kuru.exe
        run: mise run //apps/kuru-tui:verify:windows-imports
      - name: Retain unsigned Windows signing inputs
        if: runner.os == 'Windows' && steps.retained.outputs.found != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-input-${{ needs.plan.outputs.version }}-${{ needs.bump.outputs.sha }}-${{ matrix.target }}
          path: ${{ runner.temp }}/kuru-signing-input/*
          if-no-files-found: error
          overwrite: true
      - name: Retain signed native package
        if: runner.os != 'Windows' && steps.retained.outputs.found != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.retained.outputs.name }}
          path: dist/*
          if-no-files-found: error

  sign-windows:
    name: Sign Windows package (${{ matrix.target }})
    needs: [plan, bump, build]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      MISE_NO_HOOKS: "1"
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Find retained signed native package
        id: retained
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.bump.outputs.sha }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          mise run release:tool -- retained-package --version $env:RELEASE_VERSION --sha $env:RELEASE_SHA --target $env:RELEASE_TARGET --run-id $env:RELEASE_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw 'Retained package lookup failed' }
      - name: Restore retained signed native package
        if: steps.retained.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.retained.outputs.name }}
          path: dist
      - name: Download native Windows signing inputs
        if: steps.retained.outputs.found != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signing-input-${{ needs.plan.outputs.version }}-${{ needs.bump.outputs.sha }}-${{ matrix.target }}
          path: signing-input
      - name: Prepare private Windows signing copy
        if: steps.retained.outputs.found != 'true'
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          mise run release:tool -- signing-prepare --binary "$PWD/signing-input/kuru.exe" --target $env:RELEASE_TARGET --output "$env:RUNNER_TEMP/kuru-signing-output"
          if ($LASTEXITCODE -ne 0) { throw 'Windows signing preparation failed' }
      - name: Authenticate to Azure with OIDC
        if: steps.retained.outputs.found != 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign exact Windows executable
        if: steps.retained.outputs.found != 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ runner.temp }}/kuru-signing-output/kuru.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-managed-identity-credential: true
          exclude-workload-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          exclude-azure-cli-credential: false
      - name: Verify signature and package Windows executable
        if: steps.retained.outputs.found != 'true'
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          $binary = "$env:RUNNER_TEMP/kuru-signing-output/kuru.exe"
          mise run release:tool -- signing-verify --binary $binary --target $env:RELEASE_TARGET --publisher $env:WINDOWS_SIGNING_SUBJECT
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed' }
          mise run package -- --binary $binary --target $env:RELEASE_TARGET --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Signed Windows packaging failed' }
          Copy-Item -LiteralPath (Get-ChildItem 'signing-input/*shell-support*').FullName -Destination dist
      - name: Validate signed native package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          mise run release:tool -- verify-package --directory dist --version $env:RELEASE_VERSION --target $env:RELEASE_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Signed package validation failed' }
      - name: Retain signed native package
        if: steps.retained.outputs.found != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.retained.outputs.name }}
          path: dist/*
          if-no-files-found: error

  notes:
    # Generate read-only notes alongside final validation to surface failures
    # earlier. Publication still requires every native build.
    needs: [plan, bump]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          install_args: rust aqua:jdx/hk
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install package-owned release tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run //packages/kuru-delivery:setup:test-tools
      - name: Generate notes without publishing
        env:
          # Communiqué's OpenAI wire adapter calls Anthropic's compatibility API.
          OPENAI_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_COMMUNIQUE }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.bump.outputs.sha }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: mise run release:tool -- notes --sha "$RELEASE_SHA" --version "$RELEASE_VERSION" --output RELEASE_NOTES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error
          overwrite: true

  assemble-candidate:
    needs: [plan, bump, build, sign-windows, notes]
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          install_args: rust aqua:jdx/hk
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-package-${{ needs.plan.outputs.version }}-${{ needs.bump.outputs.sha }}-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
      - name: Validate the complete release candidate
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: mise run release:tool -- assemble --version "$RELEASE_VERSION" --directory dist --notes RELEASE_NOTES.md
      - name: Select this candidate's artifact
        id: artifact
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: printf 'name=release-candidate-%s\n' "$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            dist/*
            RELEASE_NOTES.md
          if-no-files-found: error

  verify-staged:
    # Every leg must pass: jobs that need this matrix wait for all of its legs.
    name: Verify staged release (${{ matrix.target }})
    needs: [plan, bump, assemble-candidate, dolt-windows-arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MISE_NO_HOOKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
      - name: Select private bundle build inputs
        shell: pwsh
        # Leave the leaf absent so the preparer creates this runner's private ACLs.
        run: Add-Content -LiteralPath $env:GITHUB_ENV "KURU_DOLT_BUNDLE_DIR=$env:RUNNER_TEMP/kuru-bundles-staged"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.assemble-candidate.outputs.artifact_name }}
          path: candidate
      # Interim Unix leg: it proves the exact staged executable's checksum, cold
      # offline runtime and previous-release update, but not the mise
      # installation route that the Windows leg proves.
      - name: Extract the exact staged Unix archive
        if: runner.os != 'Windows'
        env:
          RELEASE_ARCHIVE: kuru-${{ needs.plan.outputs.version }}-${{ matrix.target }}.tar.gz
        run: |
          grep -F "  $RELEASE_ARCHIVE" candidate/dist/SHA256SUMS > "$RUNNER_TEMP/kuru-staged.sha256"
          test "$(wc -l < "$RUNNER_TEMP/kuru-staged.sha256")" -eq 1
          (cd candidate/dist && shasum -a 256 -c "$RUNNER_TEMP/kuru-staged.sha256")
          mkdir "$RUNNER_TEMP/kuru-staged"
          tar -xzf "candidate/dist/$RELEASE_ARCHIVE" -C "$RUNNER_TEMP/kuru-staged"
          test -x "$RUNNER_TEMP/kuru-staged/kuru"
      - name: Verify exact staged publisher signature
        if: runner.os != 'Linux'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          if ($env:RUNNER_OS -eq 'Windows') {
            $archive = "$PWD/candidate/dist/kuru-$env:RELEASE_VERSION-$env:RELEASE_TARGET.zip"
            $extract = "$env:RUNNER_TEMP/kuru-signature-input"
            Expand-Archive -LiteralPath $archive -DestinationPath $extract
            $binary = "$extract/kuru.exe"
            $publisher = $env:WINDOWS_SIGNING_SUBJECT
            $name = 'kuru.exe'
          } else {
            $binary = "$env:RUNNER_TEMP/kuru-staged/kuru"
            $publisher = $env:APPLE_TEAM_ID
            $name = 'kuru'
          }
          mise run release:tool -- signing-prepare --binary $binary --target $env:RELEASE_TARGET --output "$env:RUNNER_TEMP/kuru-signature-check"
          if ($LASTEXITCODE -ne 0) { throw 'Staged signature copy failed' }
          mise run release:tool -- signing-verify --binary "$env:RUNNER_TEMP/kuru-signature-check/$name" --target $env:RELEASE_TARGET --publisher $publisher
          if ($LASTEXITCODE -ne 0) { throw 'Staged publisher signature failed' }
      - name: Verify the staged Unix executable's offline runtime
        if: runner.os != 'Windows'
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ runner.temp }}/kuru-staged/kuru
        run: mise run //apps/kuru-tui:test:embedded-runtime
      - name: Set up native Homebrew
        if: runner.os != 'Windows'
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          stable: true
      - name: Accept native Homebrew install and previous-release upgrade
        if: runner.os != 'Windows'
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          KURU_HOMEBREW_RELEASE_DIR: ${{ github.workspace }}/candidate/dist
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run //packages/kuru-delivery:test:homebrew
      - name: Accept the staged Unix executable from the previous published release
        if: runner.os != 'Windows'
        env:
          KURU_UPDATE_CANDIDATE_BINARY: ${{ runner.temp }}/kuru-staged/kuru
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run //packages/kuru-delivery:test:previous-release-update
      - name: Download the Windows arm64 engine input
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.dolt-windows-arm64.outputs.artifact }}
          path: ${{ runner.temp }}/bundle-input
      - name: Import the pin-verified Windows arm64 engine
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'bundle-input/dolt-windows-arm64.zip'
          mise run //packages/kuru-memory:bundle:prepare -- --target aarch64-pc-windows-msvc --archive $archive --offline
          if ($LASTEXITCODE -ne 0) { throw 'Windows arm64 engine import failed' }
      - name: Verify the exact staged package
        if: runner.os == 'Windows'
        env:
          KURU_STAGED_WINDOWS_ARCHIVE: ${{ github.workspace }}/candidate/dist/kuru-${{ needs.plan.outputs.version }}-${{ matrix.target }}.zip
          # The task re-runs previous-release update acceptance; the token
          # authenticates only its release listing on api.github.com.
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run //apps/kuru-tui:verify:staged-windows

  # Documentation and staged acceptance must finish before public promotion.
  build-docs:
    name: Build docs
    needs: [bump, assemble-candidate]
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          install_args: rust aqua:jdx/hk
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install app-owned documentation tools before task activation
        # With automatic installation disabled, setup's PATH must see the pins
        # before it starts; the runner's preinstalled Node/npm are not substitutes.
        run: mise run //apps/kuru-docs:setup:tools
      - run: mise run //apps/kuru-docs:setup
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Build and validate public documentation
        env:
          KURU_DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          mise run docs:build
          mise run //packages/kuru-delivery:tool -- docs --base "$KURU_DOCS_BASE"
      - name: Select this build attempt's Pages artifact
        id: artifact
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: printf 'name=github-pages-%s\n' "$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: apps/kuru-docs/.vitepress/dist

  deploy-docs:
    name: Deploy docs
    needs: [build-docs, verify-staged]
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        with:
          # A deploy-only retry retains the prior successful build's output.
          artifact_name: ${{ needs.build-docs.outputs.artifact_name }}

  # Public promotion follows every acceptance gate. Public-download verification
  # below observes the immutable release and never rolls publication back.
  publish:
    needs: [plan, bump, assemble-candidate, verify-staged, deploy-docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          install_args: rust aqua:jdx/hk
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.assemble-candidate.outputs.artifact_name }}
      - name: Publish the verified complete candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.bump.outputs.sha }}
        run: mise run release:tool -- publish --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --directory dist --notes RELEASE_NOTES.md

  publish-homebrew:
    name: Update Homebrew tap
    needs: [plan, bump, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_NO_HOOKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap
        with:
          app-id: ${{ vars.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: replygirl
          repositories: homebrew-kuru
          permission-contents: write
      - name: Update tap from the actual immutable public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HOMEBREW_TOKEN: ${{ steps.tap.outputs.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.bump.outputs.sha }}
        run: mise run release:tool -- homebrew-publish --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"


  verify-published-windows:
    name: Verify published Windows download (${{ matrix.target }})
    needs: [plan, bump, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MISE_NO_HOOKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.18
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify the exact public download and cold offline reopen
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ needs.bump.outputs.sha }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KURU_PUBLISHED_TARGET: ${{ matrix.target }}
          KURU_PUBLISHED_WINDOWS_RECEIPT: ${{ runner.temp }}/published-windows-${{ matrix.target }}-receipt.json
        run: mise run //packages/kuru-delivery:verify:published-windows
      - name: Retain public-download verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-windows-${{ matrix.target }}-${{ needs.plan.outputs.version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-windows-${{ matrix.target }}-receipt.json
          if-no-files-found: error
