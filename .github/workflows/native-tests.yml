name: Native tests

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to validate
        required: true
        type: string
      os:
        type: string
        default: ubuntu-latest
      install:
        description: Also verify source installation and the shipping offline runtime
        type: boolean
        default: false
      artifact-prefix:
        required: true
        type: string

permissions:
  contents: read

env:
  MISE_LOCKED: "1"
  # CI and release builds stay outside the maintainer mr-boxington cache.
  KURU_MBX: "0"
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  shard:
    # Receipts name their exact run attempt, and each uploaded artifact holds
    # one attempt-<n> directory. Rerunning failed jobs reruns only the failed
    # shards and the report, which requires every shard job to have succeeded,
    # takes each shard's latest uploaded (successful) attempt and requires
    # identical source, tree, toolchain and inventory across them. The shard's
    # inner test deadline sits inside this job limit, derived from
    # KURU_COVERAGE_JOB_MINUTES, so a stalled test executable fails with
    # evidence, not a cancel; compilation is not under that deadline.
    name: Coverage shard (${{ inputs.os }}, ${{ matrix.shard }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: delivery-archive
            packages: kuru-delivery,kuru-archive
          - shard: application
            packages: kuru
          - shard: memory
            packages: kuru-memory
          - shard: runtime
            packages: kuru-runtime
          - shard: connectors-core-platform
            packages: kuru-connectors,kuru-core,kuru-platform
    steps:
      - name: Record the job start for the inner test deadline
        shell: bash
        run: printf 'KURU_COVERAGE_JOB_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select private bundle build inputs
        shell: bash
        # Leave the leaf absent so the preparer creates this runner's private ACLs.
        # Cargo's restored target/ cache must not supply these directory grants.
        run: printf 'KURU_DOLT_BUNDLE_DIR=%s/kuru-bundles-${{ matrix.shard }}-${{ github.run_attempt }}\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Reserve space for bundled runtime coverage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # This Rust/Node job does not use the hosted image's mobile or Swift SDKs.
          # Keep Cargo outputs, coverage and the runner's own runtime intact.
          df -h /
          for sdk in /usr/local/lib/android /usr/share/swift; do
            if [ -d "$sdk" ]; then
              sudo du -sh "$sdk"
              sudo rm -rf -- "$sdk"
            fi
          done
          df -h /
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          # Cospec is exercised by delivery's real standalone contract tests.
          install_args: rust cargo:cargo-llvm-cov github:aligned-team/cospec
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install coverage components
        run: rustup component add llvm-tools-preview --toolchain 1.98.1
      - name: Install package-owned test tools
        run: mise run //packages/kuru-delivery:setup:test-tools
      - name: Install Ubuntu native secret-store fixture tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus gnome-keyring libsecret-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          # One key per OS for every shard: they build the same helper and
          # fetch the same registry. Only one shard saves it; the rest restore.
          # Instrumented shard targets live in runner.temp and are never cached.
          shared-key: native-coverage-${{ inputs.os }}
          save-if: ${{ matrix.shard == 'connectors-core-platform' }}
      - name: Run one checked coverage shard
        if: runner.os != 'Linux'
        shell: bash
        env:
          KURU_COVERAGE_OS: ${{ inputs.os }}
          KURU_COVERAGE_TARGET: ${{ runner.temp }}/kuru-coverage-${{ matrix.shard }}-${{ github.run_attempt }}
          KURU_COVERAGE_SOURCE: ${{ inputs.ref }}
          KURU_COVERAGE_ATTEMPT: ${{ github.run_attempt }}
          KURU_COVERAGE_SHARD: ${{ matrix.shard }}
          KURU_COVERAGE_PACKAGES: ${{ matrix.packages }}
          KURU_COVERAGE_OUTPUT: ${{ runner.temp }}/kuru-coverage-evidence-${{ matrix.shard }}-${{ github.run_attempt }}
          KURU_COVERAGE_DIAGNOSTICS: ${{ runner.temp }}/kuru-coverage-diagnostics-${{ matrix.shard }}-${{ github.run_attempt }}
          # Must equal this job's timeout-minutes.
          KURU_COVERAGE_JOB_MINUTES: "75"
          # Coverage maps remain available without Linux test-profile debug
          # info, keeping the genuine packaged Kuru input below its production
          # archive bound. The report job must repeat this value exactly: it is
          # part of the artifact inventory every receipt is validated against.
          CARGO_PROFILE_TEST_DEBUG: ${{ runner.os == 'Linux' && '0' || 'line-tables-only' }}
        run: mise run //packages/kuru-delivery:coverage:shard
      - name: Run one checked coverage shard with the OS secret store
        if: runner.os == 'Linux'
        shell: bash
        env:
          KURU_COVERAGE_OS: ${{ inputs.os }}
          KURU_COVERAGE_TARGET: ${{ runner.temp }}/kuru-coverage-${{ matrix.shard }}-${{ github.run_attempt }}
          KURU_COVERAGE_SOURCE: ${{ inputs.ref }}
          KURU_COVERAGE_ATTEMPT: ${{ github.run_attempt }}
          KURU_COVERAGE_SHARD: ${{ matrix.shard }}
          KURU_COVERAGE_PACKAGES: ${{ matrix.packages }}
          KURU_COVERAGE_OUTPUT: ${{ runner.temp }}/kuru-coverage-evidence-${{ matrix.shard }}-${{ github.run_attempt }}
          KURU_COVERAGE_DIAGNOSTICS: ${{ runner.temp }}/kuru-coverage-diagnostics-${{ matrix.shard }}-${{ github.run_attempt }}
          # Must equal this job's timeout-minutes.
          KURU_COVERAGE_JOB_MINUTES: "75"
          # Coverage maps remain available without Linux test-profile debug
          # info, keeping the genuine packaged Kuru input below its production
          # archive bound. The report job must repeat this value exactly: it is
          # part of the artifact inventory every receipt is validated against.
          CARGO_PROFILE_TEST_DEBUG: ${{ runner.os == 'Linux' && '0' || 'line-tables-only' }}
        run: |
          # The Linux keyring backend requires the real Secret Service default
          # collection. Give this headless runner its own session and fixture
          # collection; never use a file-backed replacement or provider store.
          fixture_root=$(mktemp -d "$RUNNER_TEMP/kuru-native-store.XXXXXX")
          chmod 700 "$fixture_root"
          mkdir -m 700 "$fixture_root/data" "$fixture_root/runtime"
          # Preserve the installed pinned tools before XDG_DATA_HOME is made
          # private for this test session's native keyring.
          export MISE_DATA_DIR="${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}"
          export XDG_DATA_HOME="$fixture_root/data"
          export XDG_RUNTIME_DIR="$fixture_root/runtime"
          cleanup_fixture() {
            status=$?
            trap - EXIT
            rm -rf -- "$fixture_root"
            exit "$status"
          }
          trap cleanup_fixture EXIT
          dbus-run-session -- bash -euo pipefail <<'KURU_NATIVE_STORE'
            printf '%s' 'kuru-ci-fixture-only-password' |
              gnome-keyring-daemon --foreground --unlock --components=secrets \
                >"$XDG_RUNTIME_DIR/daemon.log" 2>&1 &
            daemon_pid=$!
            cleanup_daemon() {
              status=$?
              trap - EXIT
              kill "$daemon_pid" 2>/dev/null || true
              wait "$daemon_pid" 2>/dev/null || true
              exit "$status"
            }
            trap cleanup_daemon EXIT
            # NameHasOwner queries the bus itself and cannot auto-activate a
            # second keyring daemon before this owned one claims the name.
            owned=0
            for attempt in {1..10}; do
              if ! kill -0 "$daemon_pid" 2>/dev/null; then
                break
              fi
              owner_reply=$(dbus-send --session --print-reply \
                --dest=org.freedesktop.DBus /org/freedesktop/DBus \
                org.freedesktop.DBus.NameHasOwner \
                string:org.freedesktop.secrets 2>/dev/null || true)
              if [[ "$owner_reply" == *'boolean true'* ]]; then
                owned=1
                break
              fi
              sleep 1
            done
            if [ "$owned" -ne 1 ]; then
              echo 'Owned Secret Service daemon did not claim the session bus' >&2
              exit 1
            fi
            # Probe the default collection with fake bytes before running the
            # actual OS-store tests. A missing service fails setup, not coverage.
            ready=0
            for attempt in {1..10}; do
              if ! kill -0 "$daemon_pid" 2>/dev/null; then
                break
              fi
              if printf '%s' 'kuru-ci-probe-only' |
                timeout 5s secret-tool store --label='Kuru CI probe' kuru-ci-fixture probe \
                  >/dev/null 2>&1; then
                if [ "$(timeout 5s secret-tool lookup kuru-ci-fixture probe)" = 'kuru-ci-probe-only' ]; then
                  ready=1
                  break
                fi
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo 'Native Secret Service default collection did not start' >&2
              exit 1
            fi
            secret-tool clear kuru-ci-fixture probe >/dev/null
            mise run //packages/kuru-delivery:coverage:shard
          KURU_NATIVE_STORE
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- mise.lock apps/kuru-docs/mise.lock apps/kuru-docs/package-lock.json packages/kuru-delivery/mise.lock Cargo.lock
      # Only a successful shard publishes receipt evidence under the name the
      # report accepts; a failed shard publishes its diagnostics separately.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.os }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuru-coverage-evidence-${{ matrix.shard }}-${{ github.run_attempt }}
          if-no-files-found: error
      - name: Upload failed shard diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.os }}-${{ matrix.shard }}-diagnostics-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuru-coverage-diagnostics-${{ matrix.shard }}-${{ github.run_attempt }}
          if-no-files-found: warn

  collect:
    if: always()
    needs: shard
    name: Coverage report (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    # Downloads include every uploaded attempt of each shard in this run, each
    # bounded by the receipt profile limits. If repeated reruns push the report
    # past this limit, dispatch a fresh run instead of rerunning this one.
    timeout-minutes: 30
    steps:
      # Failed shards upload no receipt, so an older successful attempt would
      # otherwise stand in for a shard whose latest attempt failed.
      - name: Require every coverage shard job to have succeeded
        shell: bash
        env:
          KURU_COVERAGE_SHARDS_RESULT: ${{ needs.shard.result }}
        run: |
          if [ "$KURU_COVERAGE_SHARDS_RESULT" != success ]; then
            echo "Coverage shards finished as '$KURU_COVERAGE_SHARDS_RESULT'; the report requires success" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select private bundle build inputs
        shell: bash
        run: printf 'KURU_DOLT_BUNDLE_DIR=%s/kuru-bundles-report-${{ github.run_attempt }}\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Reserve space for bundled runtime coverage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # This Rust/Node job does not use the hosted image's mobile or Swift SDKs.
          # Keep Cargo outputs, coverage and the runner's own runtime intact.
          df -h /
          for sdk in /usr/local/lib/android /usr/share/swift; do
            if [ -d "$sdk" ]; then
              sudo du -sh "$sdk"
              sudo rm -rf -- "$sdk"
            fi
          done
          df -h /
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          # Cospec is exercised by delivery's real standalone contract tests.
          install_args: rust cargo:cargo-llvm-cov github:aligned-team/cospec
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install coverage components
        run: rustup component add llvm-tools-preview --toolchain 1.98.1
      # Restore only: the shard key is already warm and saves collect's cold
      # registry fetch. The instrumented inventory is rebuilt in runner.temp.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: native-coverage-${{ inputs.os }}
          save-if: false
      - name: Download delivery and archive evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.os }}-delivery-archive-attempt-*
          merge-multiple: false
          path: ${{ runner.temp }}/kuru-coverage-inputs/delivery-archive
      - name: Download application evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.os }}-application-attempt-*
          merge-multiple: false
          path: ${{ runner.temp }}/kuru-coverage-inputs/application
      - name: Download memory evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.os }}-memory-attempt-*
          merge-multiple: false
          path: ${{ runner.temp }}/kuru-coverage-inputs/memory
      - name: Download runtime evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.os }}-runtime-attempt-*
          merge-multiple: false
          path: ${{ runner.temp }}/kuru-coverage-inputs/runtime
      - name: Download connectors, core and platform evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.os }}-connectors-core-platform-attempt-*
          merge-multiple: false
          path: ${{ runner.temp }}/kuru-coverage-inputs/connectors-core-platform
      # Pattern downloads include earlier attempts of this run. download-artifact
      # extracts one matching artifact directly into the shard directory
      # (<shard>/attempt-<n>) and several into one directory per artifact name
      # (<shard>/<name>/attempt-<n>); collection accepts both layouts and
      # validates each shard's latest uploaded attempt.
      - name: Collect all checked profiles and require 90% coverage
        shell: bash
        env:
          KURU_COVERAGE_OS: ${{ inputs.os }}
          KURU_COVERAGE_TARGET: ${{ runner.temp }}/kuru-coverage-report-target-${{ github.run_attempt }}
          KURU_COVERAGE_SOURCE: ${{ inputs.ref }}
          KURU_COVERAGE_ATTEMPT: ${{ github.run_attempt }}
          KURU_COVERAGE_INPUTS: ${{ runner.temp }}/kuru-coverage-inputs
          KURU_COVERAGE_REPORT: ${{ runner.temp }}/kuru-coverage-report-${{ github.run_attempt }}/coverage.lcov
          # Must equal the shard step: the rebuilt inventory includes it.
          CARGO_PROFILE_TEST_DEBUG: ${{ runner.os == 'Linux' && '0' || 'line-tables-only' }}
        run: |
          mkdir -p "$(dirname "$KURU_COVERAGE_REPORT")"
          mise run //packages/kuru-delivery:coverage:collect
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- mise.lock apps/kuru-docs/mise.lock apps/kuru-docs/package-lock.json packages/kuru-delivery/mise.lock Cargo.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuru-coverage-report-${{ github.run_attempt }}/coverage.lcov
          if-no-files-found: error

  install:
    if: inputs.install
    name: Installation, offline runtime and update (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select private bundle build inputs
        shell: bash
        run: printf 'KURU_DOLT_BUNDLE_DIR=%s/kuru-bundles-install-${{ github.run_attempt }}\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: native-install-${{ inputs.os }}
      - name: Fetch locked Cargo inputs before offline verification
        shell: bash
        run: cargo fetch --locked
      - name: Prepare package-owned bundle and test tools
        shell: bash
        run: |
          mise run //packages/kuru-memory:bundle:prepare
          mise run //packages/kuru-memory:bundle:test-fixtures
          mise run //packages/kuru-delivery:setup:test-tools
      - name: Source install smoke
        shell: bash
        env:
          KURU_INSTALL_DIR: ${{ runner.temp }}/kuru-bin
          KURU_INSTALLED_BINARY: ${{ runner.temp }}/kuru-bin/kuru${{ runner.os == 'Windows' && '.exe' || '' }}
          CARGO_NET_OFFLINE: "true"
          KURU_DOLT_BUNDLE_OFFLINE: "true"
        run: |
          mise run install
          "$KURU_INSTALLED_BINARY" --version
      - name: Verify native offline Cargo input failures
        if: runner.os == 'Windows'
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ runner.temp }}/kuru-bin/kuru.exe
        run: mise run //packages/kuru-memory:bundle:verify-native-build
      - name: Verify installed offline runtime
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ runner.temp }}/kuru-bin/kuru${{ runner.os == 'Windows' && '.exe' || '' }}
        run: mise run //apps/kuru-tui:test:embedded-runtime
      - name: Inspect native shipping DLL imports
        if: runner.os == 'Windows'
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ runner.temp }}/kuru-bin/kuru.exe
        run: mise run //apps/kuru-tui:verify:windows-imports
      - name: Accept an update from the previous published release
        env:
          KURU_UPDATE_CANDIDATE_BINARY: ${{ runner.temp }}/kuru-bin/kuru${{ runner.os == 'Windows' && '.exe' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run //packages/kuru-delivery:test:previous-release-update
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- mise.lock apps/kuru-docs/mise.lock apps/kuru-docs/package-lock.json packages/kuru-delivery/mise.lock Cargo.lock

  native-gate:
    if: always()
    needs: [shard, collect, install]
    name: Require native coverage and installation checks
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected native topology
        env:
          KURU_NATIVE_INSTALL: ${{ inputs.install }}
          KURU_NATIVE_SHARDS: ${{ needs.shard.result }}
          KURU_NATIVE_REPORT: ${{ needs.collect.result }}
          KURU_NATIVE_INSTALL_RESULT: ${{ needs.install.result }}
        run: |
          set -e
          test "$KURU_NATIVE_SHARDS" = success
          test "$KURU_NATIVE_REPORT" = success
          if [ "$KURU_NATIVE_INSTALL" = true ]; then
            test "$KURU_NATIVE_INSTALL_RESULT" = success
          else
            test "$KURU_NATIVE_INSTALL_RESULT" = skipped
          fi
