name: Native tests

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to validate
        required: true
        type: string
      os:
        type: string
        default: ubuntu-latest
      install:
        description: Also verify source installation, the shipping offline runtime and the previous release's update
        type: boolean
        default: false
      artifact-prefix:
        required: true
        type: string

permissions:
  contents: read

env:
  MISE_LOCKED: "1"
  # CI and release builds stay outside the maintainer mr-boxington cache.
  KURU_MBX: "0"
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  shard:
    # Each partition compiles the full instrumented workspace inventory, lists
    # every test executable and runs only the tests its deterministic hash
    # assignment selects, by exact name. Receipts name their exact run attempt,
    # and each uploaded artifact holds one attempt-<n> directory. Rerunning
    # failed jobs reruns only the failed partitions and the merge, which
    # requires every partition job to have succeeded, takes each partition's
    # latest uploaded (successful) attempt and requires the receipts to agree.
    # The inner test deadline sits inside this job limit, derived from
    # KURU_COVERAGE_JOB_MINUTES, so a stalled test executable fails with
    # evidence, not a cancel; compilation is not under that deadline.
    name: Coverage partition (${{ inputs.os }}, ${{ matrix.partition }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Must equal PARTITIONS in packages/kuru-delivery/src/coverage.rs.
        # macOS uses four so its partitions and the install job fit the
        # account's five concurrent macOS jobs without queueing.
        partition: ${{ fromJSON(inputs.os == 'macos-latest' && '[1,2,3,4]' || '[1,2,3,4,5,6,7,8]') }}
    steps:
      - name: Record the job start for the inner test deadline
        shell: bash
        run: printf 'KURU_COVERAGE_JOB_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select private bundle build inputs
        shell: bash
        # Leave the leaf absent so the preparer creates this runner's private ACLs.
        # Cargo's restored target/ cache must not supply these directory grants.
        run: printf 'KURU_DOLT_BUNDLE_DIR=%s/kuru-bundles-partition-${{ matrix.partition }}-${{ github.run_attempt }}\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Reserve space for bundled runtime coverage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # This Rust/Node job does not use the hosted image's mobile or Swift SDKs.
          # Keep Cargo outputs, coverage and the runner's own runtime intact.
          df -h /
          for sdk in /usr/local/lib/android /usr/share/swift; do
            if [ -d "$sdk" ]; then
              sudo du -sh "$sdk"
              sudo rm -rf -- "$sdk"
            fi
          done
          df -h /
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          # Cospec is exercised by delivery's real standalone contract tests.
          install_args: rust aqua:taiki-e/cargo-llvm-cov github:aligned-team/cospec
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install coverage components
        run: rustup component add llvm-tools-preview --toolchain 1.98.1
      - name: Install package-owned test tools
        run: mise run //packages/kuru-delivery:setup:test-tools
      - name: Install Ubuntu native secret-store fixture tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus gnome-keyring libsecret-tools
      - id: helper-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          # One key per OS for every partition: they build the same helper and
          # fetch the same registry. Only one partition saves it; the rest restore.
          # Instrumented targets live in runner.temp and are never cached here.
          # Also restrict that save to main so PR runs never thrash the cache.
          shared-key: native-coverage-${{ inputs.os }}
          save-if: ${{ matrix.partition == 1 && github.ref == 'refs/heads/main' }}
      # The seed holds only allow-listed non-workspace dependency outputs that
      # the orchestrator exported from a successful main partition. The
      # partition still builds into a fresh target and imports from the seed
      # itself; a missing or evicted seed only makes the build slower. Restore
      # and save must name the same path, which is part of the cache version.
      - id: seed
        name: Restore the instrumented dependency seed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kuru-coverage-seed
          key: kuru-coverage-seed-v1-${{ inputs.os }}-instrumented-${{ hashFiles('Cargo.lock', 'mise.toml', 'mise.lock') }}
          restore-keys: kuru-coverage-seed-v1-${{ inputs.os }}-instrumented-
      - name: Select the dependency seed export
        if: github.ref == 'refs/heads/main' && matrix.partition == 1 && steps.seed.outputs.cache-hit != 'true'
        shell: bash
        # Absent everywhere else, so only this partition exports after its receipt.
        run: printf 'KURU_COVERAGE_SEED_EXPORT=%s/kuru-coverage-seed-export\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      # DRAFT: not for merge. Samples macOS process headroom every 15 s into a
      # separate directory; the evidence and diagnostics directories stay
      # orchestrator-owned so receipts and their fail-closed checks are unchanged.
      - name: "DRAFT: sample macOS process counts (not for merge)"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dir="$RUNNER_TEMP/kuru-draft-procs-${{ matrix.partition }}-${{ github.run_attempt }}"
          mkdir -p "$dir"
          (
            while true; do
              echo "$(date -u +%T) procs=$(ps -A | wc -l | tr -d ' ') maxproc=$(sysctl -n kern.maxproc)" >> "$dir/procs.log"
              sleep 15
            done
          ) < /dev/null > /dev/null 2>&1 &
          disown
      - name: Run one checked coverage partition
        if: runner.os != 'Linux'
        shell: bash
        env:
          KURU_COVERAGE_OS: ${{ inputs.os }}
          # One fixed path per job, so seeded build-script and dep-info paths match.
          KURU_COVERAGE_TARGET: ${{ runner.temp }}/kuru-coverage-target
          KURU_COVERAGE_SOURCE: ${{ inputs.ref }}
          KURU_COVERAGE_ATTEMPT: ${{ github.run_attempt }}
          KURU_COVERAGE_PARTITION: ${{ matrix.partition }}
          KURU_COVERAGE_PARTITIONS: ${{ inputs.os == 'macos-latest' && '4' || '8' }}
          KURU_COVERAGE_OUTPUT: ${{ runner.temp }}/kuru-coverage-evidence-${{ matrix.partition }}-${{ github.run_attempt }}
          KURU_COVERAGE_DIAGNOSTICS: ${{ runner.temp }}/kuru-coverage-diagnostics-${{ matrix.partition }}-${{ github.run_attempt }}
          KURU_COVERAGE_SEED: ${{ runner.temp }}/kuru-coverage-seed
          KURU_COVERAGE_HELPER_CACHE: ${{ steps.helper-cache.outputs.cache-hit }}
          KURU_COVERAGE_SEED_CACHE: ${{ steps.seed.outputs.cache-hit }}
          KURU_COVERAGE_SEED_MATCHED_KEY: ${{ steps.seed.outputs.cache-matched-key }}
          # Must equal this job's timeout-minutes.
          KURU_COVERAGE_JOB_MINUTES: "45"
          # Coverage maps remain available without Linux test-profile debug
          # info, keeping the genuine packaged Kuru input below its production
          # archive bound. It is part of the profile identity and artifact
          # inventory on which every partition's receipt must agree.
          CARGO_PROFILE_TEST_DEBUG: ${{ runner.os == 'Linux' && '0' || 'line-tables-only' }}
        run: mise run //packages/kuru-delivery:coverage:shard
      - name: Run one checked coverage partition with the OS secret store
        if: runner.os == 'Linux'
        shell: bash
        env:
          KURU_COVERAGE_OS: ${{ inputs.os }}
          # One fixed path per job, so seeded build-script and dep-info paths match.
          KURU_COVERAGE_TARGET: ${{ runner.temp }}/kuru-coverage-target
          KURU_COVERAGE_SOURCE: ${{ inputs.ref }}
          KURU_COVERAGE_ATTEMPT: ${{ github.run_attempt }}
          KURU_COVERAGE_PARTITION: ${{ matrix.partition }}
          KURU_COVERAGE_PARTITIONS: ${{ inputs.os == 'macos-latest' && '4' || '8' }}
          KURU_COVERAGE_OUTPUT: ${{ runner.temp }}/kuru-coverage-evidence-${{ matrix.partition }}-${{ github.run_attempt }}
          KURU_COVERAGE_DIAGNOSTICS: ${{ runner.temp }}/kuru-coverage-diagnostics-${{ matrix.partition }}-${{ github.run_attempt }}
          KURU_COVERAGE_SEED: ${{ runner.temp }}/kuru-coverage-seed
          KURU_COVERAGE_HELPER_CACHE: ${{ steps.helper-cache.outputs.cache-hit }}
          KURU_COVERAGE_SEED_CACHE: ${{ steps.seed.outputs.cache-hit }}
          KURU_COVERAGE_SEED_MATCHED_KEY: ${{ steps.seed.outputs.cache-matched-key }}
          # Must equal this job's timeout-minutes.
          KURU_COVERAGE_JOB_MINUTES: "45"
          # Coverage maps remain available without Linux test-profile debug
          # info, keeping the genuine packaged Kuru input below its production
          # archive bound. It is part of the profile identity and artifact
          # inventory on which every partition's receipt must agree.
          CARGO_PROFILE_TEST_DEBUG: ${{ runner.os == 'Linux' && '0' || 'line-tables-only' }}
        run: |
          # The Linux keyring backend requires the real Secret Service default
          # collection. Give this headless runner its own session and fixture
          # collection; never use a file-backed replacement or provider store.
          fixture_root=$(mktemp -d "$RUNNER_TEMP/kuru-native-store.XXXXXX")
          chmod 700 "$fixture_root"
          mkdir -m 700 "$fixture_root/data" "$fixture_root/runtime"
          # Preserve the installed pinned tools before XDG_DATA_HOME is made
          # private for this test session's native keyring.
          export MISE_DATA_DIR="${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}"
          export XDG_DATA_HOME="$fixture_root/data"
          export XDG_RUNTIME_DIR="$fixture_root/runtime"
          cleanup_fixture() {
            status=$?
            trap - EXIT
            rm -rf -- "$fixture_root"
            exit "$status"
          }
          trap cleanup_fixture EXIT
          dbus-run-session -- bash -euo pipefail <<'KURU_NATIVE_STORE'
            printf '%s' 'kuru-ci-fixture-only-password' |
              gnome-keyring-daemon --foreground --unlock --components=secrets \
                >"$XDG_RUNTIME_DIR/daemon.log" 2>&1 &
            daemon_pid=$!
            cleanup_daemon() {
              status=$?
              trap - EXIT
              kill "$daemon_pid" 2>/dev/null || true
              wait "$daemon_pid" 2>/dev/null || true
              exit "$status"
            }
            trap cleanup_daemon EXIT
            # NameHasOwner queries the bus itself and cannot auto-activate a
            # second keyring daemon before this owned one claims the name.
            owned=0
            for attempt in {1..10}; do
              if ! kill -0 "$daemon_pid" 2>/dev/null; then
                break
              fi
              owner_reply=$(dbus-send --session --print-reply \
                --dest=org.freedesktop.DBus /org/freedesktop/DBus \
                org.freedesktop.DBus.NameHasOwner \
                string:org.freedesktop.secrets 2>/dev/null || true)
              if [[ "$owner_reply" == *'boolean true'* ]]; then
                owned=1
                break
              fi
              sleep 1
            done
            if [ "$owned" -ne 1 ]; then
              echo 'Owned Secret Service daemon did not claim the session bus' >&2
              exit 1
            fi
            # Probe the default collection with fake bytes before running the
            # actual OS-store tests. A missing service fails setup, not coverage.
            ready=0
            for attempt in {1..10}; do
              if ! kill -0 "$daemon_pid" 2>/dev/null; then
                break
              fi
              if printf '%s' 'kuru-ci-probe-only' |
                timeout 5s secret-tool store --label='Kuru CI probe' kuru-ci-fixture probe \
                  >/dev/null 2>&1; then
                if [ "$(timeout 5s secret-tool lookup kuru-ci-fixture probe)" = 'kuru-ci-probe-only' ]; then
                  ready=1
                  break
                fi
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo 'Native Secret Service default collection did not start' >&2
              exit 1
            fi
            secret-tool clear kuru-ci-fixture probe >/dev/null
            mise run //packages/kuru-delivery:coverage:shard
          KURU_NATIVE_STORE
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- mise.lock apps/kuru-docs/mise.lock apps/kuru-docs/package-lock.json packages/kuru-delivery/mise.lock Cargo.lock
      # Only a successful partition publishes receipt evidence under the name
      # the merge downloads; a failed partition publishes its diagnostics under
      # a name that the merge's pattern cannot match.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.os }}-partition-${{ matrix.partition }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuru-coverage-evidence-${{ matrix.partition }}-${{ github.run_attempt }}
          if-no-files-found: error
      - name: Upload failed partition diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-coverage-diagnostics-${{ inputs.os }}-partition-${{ matrix.partition }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuru-coverage-diagnostics-${{ matrix.partition }}-${{ github.run_attempt }}
          if-no-files-found: warn
      # DRAFT: not for merge. Always uploads the sampler log under a name the
      # merge's download pattern cannot match.
      - name: "DRAFT: upload macOS process samples (not for merge)"
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-draft-procs-${{ inputs.os }}-partition-${{ matrix.partition }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuru-draft-procs-${{ matrix.partition }}-${{ github.run_attempt }}
          if-no-files-found: warn
      # The export exists only after a successful receipt on main; replace the
      # consumed seed path with it so save and restore name the same path.
      - name: Stage the exported dependency seed
        if: env.KURU_COVERAGE_SEED_EXPORT != ''
        shell: bash
        run: |
          # Import moved entries out of the restored seed; never save that remainder.
          rm -rf -- "$RUNNER_TEMP/kuru-coverage-seed"
          if [ -d "$KURU_COVERAGE_SEED_EXPORT" ]; then
            mv -- "$KURU_COVERAGE_SEED_EXPORT" "$RUNNER_TEMP/kuru-coverage-seed"
            echo 'KURU_COVERAGE_SEED_READY=true' >> "$GITHUB_ENV"
          else
            echo '::notice::No dependency seed export was produced; nothing will be saved'
          fi
      - name: Save the instrumented dependency seed
        if: env.KURU_COVERAGE_SEED_READY == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kuru-coverage-seed
          key: ${{ steps.seed.outputs.cache-primary-key }}

  merge:
    if: always()
    needs: shard
    # Every OS merges on Ubuntu: the partitions already exported their LCOV
    # and self-checked line exports against their own instrumented
    # executables, so the merge rebuilds nothing. Its fail-closed check is the
    # agreement of the independently built partitions: identical source,
    # toolchain, profile and inventory identity, and per-executable test lists
    # that are disjoint and complete against every partition's recorded --list
    # output. It then unions each instantiation's covered lines and enforces
    # this OS's 90% line gate by the local coverage task's own metric,
    # reproduced exactly (see docs/development.md).
    name: Coverage merge (${{ inputs.os }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Failed partitions upload no receipt, so an older successful attempt
      # would otherwise stand in for a partition whose latest attempt failed.
      - name: Require every coverage partition job to have succeeded
        shell: bash
        env:
          KURU_COVERAGE_SHARDS_RESULT: ${{ needs.shard.result }}
        run: |
          if [ "$KURU_COVERAGE_SHARDS_RESULT" != success ]; then
            echo "Coverage partitions finished as '$KURU_COVERAGE_SHARDS_RESULT'; the merge requires success" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          # The merge builds only the delivery helper; it runs no tests and
          # reads no profiles, so it needs neither llvm-tools nor a bundle.
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: native-coverage-merge
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Pattern downloads include earlier attempts of this run. download-artifact
      # extracts one matching artifact directly into the inputs directory and
      # several into one directory per artifact name; the merge accepts both
      # layouts and validates each partition's latest uploaded attempt.
      - name: Download every partition's evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.os }}-partition-*
          merge-multiple: false
          path: ${{ runner.temp }}/kuru-coverage-inputs
      - name: Require agreeing partition receipts and the 90% line gate
        shell: bash
        env:
          KURU_COVERAGE_OS: ${{ inputs.os }}
          KURU_COVERAGE_SOURCE: ${{ inputs.ref }}
          KURU_COVERAGE_ATTEMPT: ${{ github.run_attempt }}
          KURU_COVERAGE_MODE: instrumented
          KURU_COVERAGE_PARTITIONS: ${{ inputs.os == 'macos-latest' && '4' || '8' }}
          KURU_COVERAGE_INPUTS: ${{ runner.temp }}/kuru-coverage-inputs
          KURU_COVERAGE_REPORT: ${{ runner.temp }}/kuru-coverage-report-${{ github.run_attempt }}/coverage.lcov
        run: |
          mkdir -p "$(dirname "$KURU_COVERAGE_REPORT")"
          mise run //packages/kuru-delivery:coverage:merge
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- mise.lock apps/kuru-docs/mise.lock apps/kuru-docs/package-lock.json packages/kuru-delivery/mise.lock Cargo.lock
      # The merged LCOV and merge-summary.json, whose per-partition table
      # records cache hits, phase times and profile counts.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuru-coverage-report-${{ github.run_attempt }}
          if-no-files-found: error

  install:
    if: inputs.install
    # One installation and update job per OS. The installed release-profile
    # executable is also the previous-release updater candidate.
    name: Installation, offline runtime and update
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select private bundle build inputs
        shell: pwsh
        # Leave the leaf absent so the preparer creates this runner's private ACLs.
        # Cargo's restored target/ cache must not supply these directory grants.
        run: Add-Content -LiteralPath $env:GITHUB_ENV "KURU_DOLT_BUNDLE_DIR=$env:RUNNER_TEMP/kuru-bundles-install-${{ github.run_attempt }}"
      - name: Reserve space for release and test builds
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # This Rust job does not use the hosted image's mobile or Swift SDKs.
          df -h /
          for sdk in /usr/local/lib/android /usr/share/swift; do
            if [ -d "$sdk" ]; then
              sudo du -sh "$sdk"
              sudo rm -rf -- "$sdk"
            fi
          done
          df -h /
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: native-install-${{ inputs.os }}
          # Restrict saves to main so PR runs never thrash the shared cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch locked Cargo inputs before offline verification
        run: cargo fetch --locked
      - name: Prepare the package-owned bundle
        run: mise run //packages/kuru-memory:bundle:prepare
      - name: Prepare the package-owned bundle fixtures
        if: runner.os == 'Windows'
        run: mise run //packages/kuru-memory:bundle:test-fixtures
      - name: Install package-owned test tools
        run: mise run //packages/kuru-delivery:setup:test-tools
      - name: Source install smoke
        if: runner.os != 'Windows'
        env:
          KURU_INSTALL_DIR: ${{ runner.temp }}/kuru-bin
          CARGO_NET_OFFLINE: "true"
          KURU_DOLT_BUNDLE_OFFLINE: "true"
        run: |
          mise run install
          "$KURU_INSTALL_DIR/kuru" --version
      - name: Native Windows source install smoke
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KURU_INSTALL_DIR: ${{ runner.temp }}/kuru-bin
          CARGO_NET_OFFLINE: "true"
          KURU_DOLT_BUNDLE_OFFLINE: "true"
        run: |
          mise run install
          if ($LASTEXITCODE -ne 0) { throw 'Source installation failed' }
          & "$env:KURU_INSTALL_DIR/kuru.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed Kuru failed' }
      - name: Verify native offline Cargo input failures
        if: runner.os == 'Windows'
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ runner.temp }}/kuru-bin/kuru.exe
        run: mise run //packages/kuru-memory:bundle:verify-native-build
      - name: Verify installed offline runtime
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ runner.temp }}/kuru-bin/kuru${{ runner.os == 'Windows' && '.exe' || '' }}
        run: mise run //apps/kuru-tui:test:embedded-runtime
      - name: Inspect native shipping DLL imports
        if: runner.os == 'Windows'
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ runner.temp }}/kuru-bin/kuru.exe
        run: mise run //apps/kuru-tui:verify:windows-imports
      # The previous published release's own updater installs this tree's
      # release build. This step is online: the task lists releases on
      # api.github.com (the token authenticates only that request) and
      # downloads the previous release's assets anonymously.
      - name: Accept an update from the previous published release
        env:
          # The installed copy is the verified shipping build. On Windows the
          # earlier bundle:verify-native-build step has already relinked Cargo's
          # release output with all features, so that is not the candidate.
          KURU_UPDATE_CANDIDATE_BINARY: ${{ runner.temp }}/kuru-bin/kuru${{ runner.os == 'Windows' && '.exe' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run //packages/kuru-delivery:test:previous-release-update
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- mise.lock apps/kuru-docs/mise.lock apps/kuru-docs/package-lock.json packages/kuru-delivery/mise.lock Cargo.lock

  native-gate:
    if: always()
    needs: [shard, merge, install]
    name: Require native coverage and installation checks
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected native topology
        env:
          KURU_NATIVE_INSTALL: ${{ inputs.install }}
          KURU_NATIVE_SHARDS: ${{ needs.shard.result }}
          KURU_NATIVE_REPORT: ${{ needs.merge.result }}
          KURU_NATIVE_INSTALL_RESULT: ${{ needs.install.result }}
        run: |
          set -e
          test "$KURU_NATIVE_SHARDS" = success
          test "$KURU_NATIVE_REPORT" = success
          if [ "$KURU_NATIVE_INSTALL" = true ]; then
            test "$KURU_NATIVE_INSTALL_RESULT" = success
          else
            test "$KURU_NATIVE_INSTALL_RESULT" = skipped
          fi
