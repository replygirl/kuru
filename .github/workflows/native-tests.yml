name: Native tests

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to validate
        required: true
        type: string
      os:
        type: string
        default: ubuntu-24.04
      install:
        description: Also verify source installation and the shipping offline runtime
        type: boolean
        default: false
      artifact-prefix:
        required: true
        type: string

permissions:
  contents: read

env:
  MISE_LOCKED: "1"
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  coverage:
    if: inputs.os != 'windows-2025'
    name: Coverage and native behavior
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select private bundle build inputs
        shell: bash
        # Leave the leaf absent so the preparer creates this runner's private ACLs.
        # Cargo's restored target/ cache must not supply these directory grants.
        run: printf 'KURU_DOLT_BUNDLE_DIR=%s/kuru-bundles\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Reserve space for bundled runtime coverage
        if: inputs.os == 'ubuntu-24.04'
        shell: bash
        run: |
          # This Rust/Node job does not use the hosted image's mobile or Swift SDKs.
          # Keep Cargo outputs, coverage and the runner's own runtime intact.
          df -h /
          for sdk in /usr/local/lib/android /usr/share/swift; do
            if [ -d "$sdk" ]; then
              sudo du -sh "$sdk"
              sudo rm -rf -- "$sdk"
            fi
          done
          df -h /
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          # Cospec is exercised by delivery's real standalone contract tests.
          install_args: rust cargo:cargo-llvm-cov github:aligned-team/cospec
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install coverage components
        run: rustup component add llvm-tools-preview --toolchain 1.98.1
      - name: Install package-owned test tools
        run: mise run //packages/kuru-delivery:setup:test-tools
      - name: Install Ubuntu native secret-store fixture tools
        if: inputs.os == 'ubuntu-24.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus gnome-keyring libsecret-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: native-coverage
      - name: Run macOS instrumented native tests and require 90% coverage
        if: inputs.os != 'ubuntu-24.04'
        env:
          # Coverage maps remain available without test-profile debug info. Keep
          # the genuine packaged Kuru input below its production archive bound.
          CARGO_PROFILE_TEST_DEBUG: ${{ inputs.os == 'ubuntu-24.04' && '0' || 'line-tables-only' }}
        run: mise run coverage
      - name: Run Ubuntu instrumented native tests with the OS secret store
        if: inputs.os == 'ubuntu-24.04'
        shell: bash
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          # The Linux keyring backend requires the real Secret Service default
          # collection. Give this headless runner its own session and fixture
          # collection; never use a file-backed replacement or provider store.
          fixture_root=$(mktemp -d "$RUNNER_TEMP/kuru-native-store.XXXXXX")
          chmod 700 "$fixture_root"
          mkdir -m 700 "$fixture_root/data" "$fixture_root/runtime"
          # Preserve the installed pinned tools before XDG_DATA_HOME is made
          # private for this test session's native keyring.
          export MISE_DATA_DIR="${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}"
          export XDG_DATA_HOME="$fixture_root/data"
          export XDG_RUNTIME_DIR="$fixture_root/runtime"
          cleanup_fixture() {
            status=$?
            trap - EXIT
            rm -rf -- "$fixture_root"
            exit "$status"
          }
          trap cleanup_fixture EXIT
          dbus-run-session -- bash -euo pipefail <<'KURU_NATIVE_STORE'
            printf '%s' 'kuru-ci-fixture-only-password' |
              gnome-keyring-daemon --foreground --unlock --components=secrets \
                >"$XDG_RUNTIME_DIR/daemon.log" 2>&1 &
            daemon_pid=$!
            cleanup_daemon() {
              status=$?
              trap - EXIT
              kill "$daemon_pid" 2>/dev/null || true
              wait "$daemon_pid" 2>/dev/null || true
              exit "$status"
            }
            trap cleanup_daemon EXIT
            # NameHasOwner queries the bus itself and cannot auto-activate a
            # second keyring daemon before this owned one claims the name.
            owned=0
            for attempt in {1..10}; do
              if ! kill -0 "$daemon_pid" 2>/dev/null; then
                break
              fi
              owner_reply=$(dbus-send --session --print-reply \
                --dest=org.freedesktop.DBus /org/freedesktop/DBus \
                org.freedesktop.DBus.NameHasOwner \
                string:org.freedesktop.secrets 2>/dev/null || true)
              if [[ "$owner_reply" == *'boolean true'* ]]; then
                owned=1
                break
              fi
              sleep 1
            done
            if [ "$owned" -ne 1 ]; then
              echo 'Owned Secret Service daemon did not claim the session bus' >&2
              exit 1
            fi
            # Probe the default collection with fake bytes before running the
            # actual OS-store tests. A missing service fails setup, not coverage.
            ready=0
            for attempt in {1..10}; do
              if ! kill -0 "$daemon_pid" 2>/dev/null; then
                break
              fi
              if printf '%s' 'kuru-ci-probe-only' |
                timeout 5s secret-tool store --label='Kuru CI probe' kuru-ci-fixture probe \
                  >/dev/null 2>&1; then
                if [ "$(timeout 5s secret-tool lookup kuru-ci-fixture probe)" = 'kuru-ci-probe-only' ]; then
                  ready=1
                  break
                fi
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo 'Native Secret Service default collection did not start' >&2
              exit 1
            fi
            secret-tool clear kuru-ci-fixture probe >/dev/null
            mise run coverage
          KURU_NATIVE_STORE
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- mise.lock apps/kuru-docs/mise.lock apps/kuru-docs/package-lock.json packages/kuru-delivery/mise.lock Cargo.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-coverage-${{ inputs.os }}-attempt-${{ github.run_attempt }}
          path: target/coverage.lcov
          if-no-files-found: error
      - name: Source install smoke
        if: inputs.install
        env:
          KURU_INSTALL_DIR: ${{ runner.temp }}/kuru-bin
          CARGO_NET_OFFLINE: "true"
          KURU_DOLT_BUNDLE_OFFLINE: "true"
        run: |
          mise run install
          "$KURU_INSTALL_DIR/kuru" --version
      - name: Verify installed offline runtime
        if: inputs.install
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ runner.temp }}/kuru-bin/kuru
        run: mise run //apps/kuru-tui:test:embedded-runtime

  windows-coverage:
    if: inputs.os == 'windows-2025'
    # Receipts are exact run-attempt evidence. Recovery reruns every shard and
    # this report; it never combines a new attempt with prior shard artifacts.
    name: Windows coverage (${{ matrix.shard }})
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: delivery-archive
            packages: kuru-delivery,kuru-archive
          - shard: application
            packages: kuru
          - shard: memory-runtime
            packages: kuru-memory,kuru-runtime
          - shard: connectors-core-platform
            packages: kuru-connectors,kuru-core,kuru-platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select private bundle build inputs
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV "KURU_DOLT_BUNDLE_DIR=$env:RUNNER_TEMP/kuru-bundles-${{ matrix.shard }}-${{ github.run_attempt }}"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust cargo:cargo-llvm-cov github:aligned-team/cospec
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install coverage components
        run: rustup component add llvm-tools-preview --toolchain 1.98.1
      - name: Install package-owned test tools
        run: mise run //packages/kuru-delivery:setup:test-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: native-coverage-windows-${{ matrix.shard }}
      - name: Run one checked coverage shard
        shell: pwsh
        env:
          KURU_COVERAGE_TARGET: ${{ runner.temp }}/kuru-coverage-${{ matrix.shard }}-${{ github.run_attempt }}
          KURU_COVERAGE_SOURCE: ${{ inputs.ref }}
          KURU_COVERAGE_ATTEMPT: ${{ github.run_attempt }}
          KURU_COVERAGE_SHARD: ${{ matrix.shard }}
          KURU_COVERAGE_PACKAGES: ${{ matrix.packages }}
          KURU_COVERAGE_OUTPUT: ${{ runner.temp }}/kuru-coverage-evidence-${{ matrix.shard }}-${{ github.run_attempt }}
        run: mise run //packages/kuru-delivery:coverage:windows:shard
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- mise.lock apps/kuru-docs/mise.lock apps/kuru-docs/package-lock.json packages/kuru-delivery/mise.lock Cargo.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.artifact-prefix }}-coverage-windows-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuru-coverage-evidence-${{ matrix.shard }}-${{ github.run_attempt }}
          if-no-files-found: error

  windows-coverage-report:
    if: inputs.os == 'windows-2025' && always()
    needs: windows-coverage
    name: Windows coverage report
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select private bundle build inputs
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV "KURU_DOLT_BUNDLE_DIR=$env:RUNNER_TEMP/kuru-bundles-report-${{ github.run_attempt }}"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust cargo:cargo-llvm-cov github:aligned-team/cospec
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install coverage components
        run: rustup component add llvm-tools-preview --toolchain 1.98.1
      - name: Download delivery and archive evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-coverage-windows-delivery-archive-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuru-coverage-inputs/delivery-archive
      - name: Download application evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-coverage-windows-application-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuru-coverage-inputs/application
      - name: Download memory and runtime evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-coverage-windows-memory-runtime-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuru-coverage-inputs/memory-runtime
      - name: Download connectors, core and platform evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-prefix }}-coverage-windows-connectors-core-platform-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuru-coverage-inputs/connectors-core-platform
      - name: Collect all checked profiles and require 90% coverage
        shell: pwsh
        env:
          KURU_COVERAGE_TARGET: ${{ runner.temp }}/kuru-coverage-report-target-${{ github.run_attempt }}
          KURU_COVERAGE_SOURCE: ${{ inputs.ref }}
          KURU_COVERAGE_ATTEMPT: ${{ github.run_attempt }}
          KURU_COVERAGE_INPUTS: ${{ runner.temp }}/kuru-coverage-inputs
          KURU_COVERAGE_REPORT: ${{ runner.temp }}/kuru-coverage-report-${{ github.run_attempt }}/coverage.lcov
        run: |
          New-Item -ItemType Directory -Path (Split-Path -Parent $env:KURU_COVERAGE_REPORT) | Out-Null
          mise run //packages/kuru-delivery:coverage:windows:collect
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- mise.lock apps/kuru-docs/mise.lock apps/kuru-docs/package-lock.json packages/kuru-delivery/mise.lock Cargo.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.artifact-prefix }}-coverage-windows-2025-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kuru-coverage-report-${{ github.run_attempt }}/coverage.lcov
          if-no-files-found: error

  windows-install:
    if: inputs.os == 'windows-2025' && inputs.install
    name: Windows installation and offline runtime
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select private bundle build inputs
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV "KURU_DOLT_BUNDLE_DIR=$env:RUNNER_TEMP/kuru-bundles-install-${{ github.run_attempt }}"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: native-install-windows
      - name: Fetch locked Cargo inputs before offline verification
        shell: pwsh
        run: |
          & cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'Locked Cargo fetch failed' }
      - name: Prepare package-owned bundle and test tools
        shell: pwsh
        run: |
          mise run //packages/kuru-memory:bundle:prepare
          if ($LASTEXITCODE -ne 0) { throw 'Bundle preparation failed' }
          mise run //packages/kuru-memory:bundle:test-fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Bundle fixture preparation failed' }
          mise run //packages/kuru-delivery:setup:test-tools
          if ($LASTEXITCODE -ne 0) { throw 'Package-owned test-tool setup failed' }
      - name: Native Windows source install smoke
        shell: pwsh
        env:
          KURU_INSTALL_DIR: ${{ runner.temp }}/kuru-bin
          CARGO_NET_OFFLINE: "true"
          KURU_DOLT_BUNDLE_OFFLINE: "true"
        run: |
          mise run install
          if ($LASTEXITCODE -ne 0) { throw 'Source installation failed' }
          & "$env:KURU_INSTALL_DIR/kuru.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed Kuru failed' }
      - name: Verify native offline Cargo input failures
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ runner.temp }}/kuru-bin/kuru.exe
        run: mise run //packages/kuru-memory:bundle:verify-native-build
      - name: Verify installed offline runtime
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ runner.temp }}/kuru-bin/kuru.exe
        run: mise run //apps/kuru-tui:test:embedded-runtime
      - name: Inspect native shipping DLL imports
        env:
          KURU_EMBEDDED_TEST_BINARY: ${{ runner.temp }}/kuru-bin/kuru.exe
        run: mise run //apps/kuru-tui:verify:windows-imports
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- mise.lock apps/kuru-docs/mise.lock apps/kuru-docs/package-lock.json packages/kuru-delivery/mise.lock Cargo.lock

  native-gate:
    if: always()
    needs: [coverage, windows-coverage, windows-coverage-report, windows-install]
    name: Require native coverage and installation checks
    runs-on: ubuntu-24.04
    steps:
      - name: Require the selected native topology
        env:
          KURU_NATIVE_OS: ${{ inputs.os }}
          KURU_NATIVE_INSTALL: ${{ inputs.install }}
          KURU_NATIVE_COVERAGE: ${{ needs.coverage.result }}
          KURU_NATIVE_WINDOWS_SHARDS: ${{ needs.windows-coverage.result }}
          KURU_NATIVE_WINDOWS_REPORT: ${{ needs.windows-coverage-report.result }}
          KURU_NATIVE_WINDOWS_INSTALL: ${{ needs.windows-install.result }}
        run: |
          set -e
          if [ "$KURU_NATIVE_OS" = windows-2025 ]; then
            test "$KURU_NATIVE_COVERAGE" = skipped
            test "$KURU_NATIVE_WINDOWS_SHARDS" = success
            test "$KURU_NATIVE_WINDOWS_REPORT" = success
            if [ "$KURU_NATIVE_INSTALL" = true ]; then
              test "$KURU_NATIVE_WINDOWS_INSTALL" = success
            else
              test "$KURU_NATIVE_WINDOWS_INSTALL" = skipped
            fi
          else
            test "$KURU_NATIVE_COVERAGE" = success
            test "$KURU_NATIVE_WINDOWS_SHARDS" = skipped
            test "$KURU_NATIVE_WINDOWS_REPORT" = skipped
            test "$KURU_NATIVE_WINDOWS_INSTALL" = skipped
          fi
