name: Bundle build

# Source-built Dolt engine archives (manifest `provenance: built`) are pinned
# only from this linux-x64 job: two builds in fresh private directories must be
# byte-identical before their pins can be trusted, and once pinned every build
# must reproduce the committed bytes exactly.
#
# Workflows with a Windows on Arm leg call this workflow for its one import
# input. The call path restores a cached archive or builds once, and fails
# unless the bytes match the committed pin. The artifact is transport only:
# each consumer's `bundle:prepare --archive` checks the same pin again.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit whose committed pin and recipe produce the input
        required: true
        type: string
    outputs:
      artifact:
        description: Workflow artifact holding the pin-verified engine archive
        value: ${{ jobs.windows-arm64-input.outputs.artifact }}
  pull_request:
    paths:
      - .github/workflows/bundle-build.yml
      - Cargo.lock
      - packages/kuru-archive/src/zip.rs
      - packages/kuru-delivery/src/bundle.rs
      - packages/kuru-delivery/src/bundle/**
      - packages/kuru-delivery/src/main.rs
      - packages/kuru-memory/mise.lock
      - packages/kuru-memory/mise.toml
      - packages/kuru-memory/support/bundle.rs
      - packages/kuru-memory/support/dolt-assets.json
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_LOCKED: "1"
  # CI builds stay outside the maintainer mr-boxington cache.
  KURU_MBX: "0"
  # Jobs install only their mise-action install_args. Windows exe shims run
  # `mise x`, which would otherwise download every other configured tool.
  MISE_EXEC_AUTO_INSTALL: "false"
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  CARGO_INCREMENTAL: "0"
  BUILT_TARGET: aarch64-pc-windows-msvc
  BUILT_ARCHIVE: dolt-windows-arm64.zip

jobs:
  windows-arm64-engine:
    name: Reproducible Windows arm64 engine
    # A called workflow sees its caller's event, so the input selects the path.
    if: ${{ !inputs.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Job-level, so a caller's run on the same ref is never cancelled by it.
    concurrency:
      group: bundle-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: bundle-build
      - name: Install the pinned Go and llvm-mingw toolchains
        run: mise run //packages/kuru-memory:setup:build-tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build twice in fresh private directories
        run: |
          set -eu
          for run in 1 2; do
            mise run //packages/kuru-memory:bundle:build -- \
              --target "$BUILT_TARGET" --print-pins \
              --work-dir "$RUNNER_TEMP/bundle-build-$run/work" \
              --output "$RUNNER_TEMP/bundle-build-$run/out"
          done
      - name: Require byte-identical archives
        run: |
          set -eu
          first="$RUNNER_TEMP/bundle-build-1/out"
          second="$RUNNER_TEMP/bundle-build-2/out"
          sha256sum "$first/$BUILT_ARCHIVE" "$second/$BUILT_ARCHIVE"
          if ! cmp "$first/$BUILT_ARCHIVE" "$second/$BUILT_ARCHIVE"; then
            echo "::error::The two builds produced different archive bytes"
            diff "$first/pins.json" "$second/pins.json" || true
            exit 1
          fi
          cmp "$first/pins.json" "$second/pins.json"
          sha="$(sha256sum "$first/$BUILT_ARCHIVE" | cut -d ' ' -f 1)"
          size="$(stat -c %s "$first/$BUILT_ARCHIVE")"
          echo "archive sha256: $sha"
          echo "archive bytes: $size"
          artifact="$RUNNER_TEMP/bundle-artifact"
          mkdir "$artifact"
          cp "$first/$BUILT_ARCHIVE" "$first/pins.json" "$artifact/"
          printf '%s  %s\n' "$sha" "$BUILT_ARCHIVE" > "$artifact/SHA256SUMS"
          {
            echo "### $BUILT_TARGET engine"
            echo
            echo "Two fresh builds were byte-identical."
            echo
            echo "- archive sha256: \`$sha\`"
            echo "- archive bytes: $size"
            echo
            echo '```json'
            cat "$first/pins.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the committed pin
        run: |
          set -eu
          manifest=packages/kuru-memory/support/dolt-assets.json
          pinned="$(jq -r --arg target "$BUILT_TARGET" '.assets[] | select(.target == $target) | .archive_sha256' "$manifest")"
          pinned_size="$(jq -r --arg target "$BUILT_TARGET" '.assets[] | select(.target == $target) | .compressed_bytes' "$manifest")"
          archive="$RUNNER_TEMP/bundle-artifact/$BUILT_ARCHIVE"
          observed="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          observed_size="$(stat -c %s "$archive")"
          if [ "$pinned" = unpinned ]; then
            echo "::notice::unpinned: pin verification not yet possible (observed $observed, $observed_size bytes)"
          elif [ "$pinned" != "$observed" ] || [ "$pinned_size" != "$observed_size" ]; then
            echo "::error::Built archive differs from the committed pin: pinned $pinned ($pinned_size bytes), observed $observed ($observed_size bytes)"
            exit 1
          else
            echo "Built archive matches the committed pin $pinned ($pinned_size bytes)"
          fi
      - name: Require unchanged dependency locks
        run: git diff --exit-code -- mise.lock packages/kuru-memory/mise.lock Cargo.lock
      - name: Upload the built archive and its pins
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-build-aarch64-pc-windows-msvc
          path: ${{ runner.temp }}/bundle-artifact
          if-no-files-found: error
          retention-days: 30
      - name: Upload both builds for diagnosis
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-build-diagnostics
          path: |
            ${{ runner.temp }}/bundle-build-1/out
            ${{ runner.temp }}/bundle-build-2/out
          if-no-files-found: ignore
          retention-days: 14

  windows-arm64-input:
    name: Pin-verified Windows arm64 engine input
    if: ${{ inputs.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Cargo.lock names in kuru-archive's locked dependency closure, which
      # holds the ZIP writer and its deflate code. The closure follows every
      # edge the lock records, for any feature; the digest covers every
      # locked version of each name. bundle_build.rs recomputes the closure
      # from Cargo.lock and requires exactly this list.
      ENGINE_ARCHIVE_CRATES: >-
        adler2 allocator-api2 anyhow cfg-if crc32fast equivalent flate2 foldhash
        hashbrown indexmap memchr miniz_oxide proc-macro2 quote serde serde_core
        serde_derive simd-adler32 syn typed-path unicode-ident zip zlib-rs
    outputs:
      artifact: ${{ steps.input.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Read the committed pin
        id: pin
        run: |
          set -eu
          manifest=packages/kuru-memory/support/dolt-assets.json
          sha="$(jq -r --arg target "$BUILT_TARGET" '.assets[] | select(.target == $target and .provenance == "built") | .archive_sha256' "$manifest")"
          size="$(jq -r --arg target "$BUILT_TARGET" '.assets[] | select(.target == $target and .provenance == "built") | .compressed_bytes' "$manifest")"
          if ! printf '%s' "$sha" | grep -Eqx '[0-9a-f]{64}' || ! printf '%s' "$size" | grep -Eqx '[1-9][0-9]*'; then
            echo "::error::$BUILT_TARGET has no committed archive pin; an import input requires one"
            exit 1
          fi
          {
            echo "sha256=$sha"
            echo "bytes=$size"
          } >> "$GITHUB_OUTPUT"
      # Cargo.lock records of the writer closure only: other lock edits cannot
      # change the archive bytes. A missing name fails the job.
      - name: Digest the locked archive writer crates
        id: crates
        run: |
          set -eu
          records="$(awk -v wanted="$ENGINE_ARCHIVE_CRATES" '
            BEGIN {
              RS = ""
              count = split(wanted, names, " ")
              for (i = 1; i <= count; i++) want[names[i]] = 1
            }
            $1 == "[[package]]" && $2 == "name" && $3 == "=" {
              name = $4
              gsub(/"/, "", name)
              if (name in want) {
                print $0 "\n"
                seen[name] = 1
              }
            }
            END {
              for (name in want) {
                if (!(name in seen)) {
                  print "::error::Cargo.lock has no " name " package" > "/dev/stderr"
                  missing = 1
                }
              }
              exit missing
            }
          ' Cargo.lock)"
          printf 'sha256=%s\n' "$(printf '%s\n' "$records" | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      # The key names the pinned bytes and every recipe input that decides
      # them, so a recipe change is rebuilt once. bundle_build.rs derives
      # those inputs from the bundle:build task and requires exactly these.
      - name: Restore a previously verified archive
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bundle-input
          key: bundle-input-${{ env.BUILT_TARGET }}-${{ steps.pin.outputs.sha256 }}-${{ hashFiles('packages/kuru-archive/src/zip.rs', 'packages/kuru-delivery/src/bundle.rs', 'packages/kuru-delivery/src/bundle/build.rs', 'packages/kuru-delivery/src/main.rs', 'packages/kuru-memory/support/dolt-assets.json') }}-${{ steps.crates.outputs.sha256 }}
      - name: Verify restored bytes against the pin
        id: restored
        if: steps.restore.outputs.cache-hit == 'true'
        env:
          PINNED_SHA256: ${{ steps.pin.outputs.sha256 }}
          PINNED_BYTES: ${{ steps.pin.outputs.bytes }}
        run: |
          set -eu
          archive="$RUNNER_TEMP/bundle-input/$BUILT_ARCHIVE"
          if [ -f "$archive" ] && [ ! -L "$archive" ] \
            && [ "$(stat -c %s "$archive")" = "$PINNED_BYTES" ] \
            && [ "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$PINNED_SHA256" ]; then
            echo "Restored archive matches the committed pin $PINNED_SHA256 ($PINNED_BYTES bytes)"
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Restored archive differs from the committed pin; rebuilding"
            rm -rf -- "$RUNNER_TEMP/bundle-input"
          fi
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: steps.restored.outputs.verified != 'true'
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.restored.outputs.verified != 'true'
        with:
          cache-bin: false
          shared-key: bundle-build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the pinned Go and llvm-mingw toolchains
        if: steps.restored.outputs.verified != 'true'
        run: mise run //packages/kuru-memory:setup:build-tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Without the pin-printing flag the helper refuses output that differs from the
      # committed pins and reports both digests.
      - name: Build once against the committed pin
        if: steps.restored.outputs.verified != 'true'
        run: |
          set -eu
          mise run //packages/kuru-memory:bundle:build -- \
            --target "$BUILT_TARGET" \
            --work-dir "$RUNNER_TEMP/bundle-build/work" \
            --output "$RUNNER_TEMP/bundle-build/out"
          mkdir "$RUNNER_TEMP/bundle-input"
          cp "$RUNNER_TEMP/bundle-build/out/$BUILT_ARCHIVE" "$RUNNER_TEMP/bundle-input/"
      - name: Verify built bytes against the pin
        if: steps.restored.outputs.verified != 'true'
        env:
          PINNED_SHA256: ${{ steps.pin.outputs.sha256 }}
          PINNED_BYTES: ${{ steps.pin.outputs.bytes }}
        run: |
          set -eu
          archive="$RUNNER_TEMP/bundle-input/$BUILT_ARCHIVE"
          observed="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          observed_size="$(stat -c %s "$archive")"
          if [ "$observed" != "$PINNED_SHA256" ] || [ "$observed_size" != "$PINNED_BYTES" ]; then
            echo "::error::Built archive differs from the committed pin: pinned $PINNED_SHA256 ($PINNED_BYTES bytes), observed $observed ($observed_size bytes)"
            exit 1
          fi
          echo "Built archive matches the committed pin $PINNED_SHA256 ($PINNED_BYTES bytes)"
      - name: Require unchanged dependency locks
        if: steps.restored.outputs.verified != 'true'
        run: git diff --exit-code -- mise.lock packages/kuru-memory/mise.lock Cargo.lock
      # Like the Cargo caches, only main saves; a rebuilt archive is saved
      # only after it matched the pin.
      - name: Save the verified archive
        if: steps.restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bundle-input
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: Select the input artifact
        id: input
        run: printf 'artifact=bundle-input-%s\n' "$BUILT_TARGET" >> "$GITHUB_OUTPUT"
      - name: Upload the pin-verified archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.input.outputs.artifact }}
          path: ${{ runner.temp }}/bundle-input/${{ env.BUILT_ARCHIVE }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7
