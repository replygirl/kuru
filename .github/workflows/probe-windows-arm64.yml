# TEMPORARY step-zero probe for windows-arm64-support task 3.2.
# REMOVE BEFORE MERGE. It records what the windows-11-arm image provides;
# it is not a product check and gates nothing (every step continues on error).
name: Probe Windows on Arm (temporary, remove before merge)

on:
  pull_request:

permissions:
  contents: read

env:
  MISE_LOCKED: "1"
  KURU_MBX: "0"
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

defaults:
  run:
    shell: pwsh

jobs:
  probe:
    name: Probe windows-11-arm (temporary)
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - name: Runner image
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output '===== PROBE: runner image ====='
          Write-Output "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Output "OS=$([Environment]::OSVersion.VersionString)"
          (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List | Out-String).Trim()
          Write-Output '===== END: runner image ====='

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          persist-credentials: false

      - name: Write machine probe script
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $script = @'
          $ErrorActionPreference = 'Continue'
          Write-Output "PSEdition=$($PSVersionTable.PSEdition) PSVersion=$($PSVersionTable.PSVersion)"
          ($PSVersionTable | Format-Table -AutoSize | Out-String).Trim()
          Write-Output "ProcessPath=$((Get-Process -Id $PID).Path)"
          Write-Output "Is64BitProcess=$([Environment]::Is64BitProcess)"
          try { Write-Output "RuntimeInformation.ProcessArchitecture=$([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture) OSArchitecture=$([Runtime.InteropServices.RuntimeInformation]::OSArchitecture)" } catch { Write-Output "RuntimeInformation unavailable: $($_.Exception.Message)" }
          Write-Output "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE PROCESSOR_ARCHITEW6432=$env:PROCESSOR_ARCHITEW6432"
          try {
            if (-not ('KuruProbe.Native' -as [type])) {
              Add-Type -TypeDefinition @"
          using System;
          using System.ComponentModel;
          using System.Diagnostics;
          using System.Runtime.InteropServices;
          namespace KuruProbe {
          public static class Native {
              [DllImport("kernel32.dll", SetLastError=true)]
              static extern bool IsWow64Process2(IntPtr process, out ushort processMachine, out ushort nativeMachine);
              public static ushort[] Machines() {
                  ushort processMachine, nativeMachine;
                  using (Process self = Process.GetCurrentProcess()) {
                      if (!IsWow64Process2(self.Handle, out processMachine, out nativeMachine)) throw new Win32Exception(Marshal.GetLastWin32Error());
                  }
                  return new ushort[]{ processMachine, nativeMachine };
              }
          }
          }
          "@
            }
            Write-Output 'Add-Type=ok'
            $m = [KuruProbe.Native]::Machines()
            Write-Output ('IsWow64Process2 processMachine=0x{0:X4} nativeMachine=0x{1:X4}' -f $m[0], $m[1])
          } catch {
            Write-Output "Add-Type/IsWow64Process2 FAILED: $($_.Exception.Message)"
          }
          '@
          $script | Set-Content -Encoding UTF8 -Path "$env:RUNNER_TEMP\machine.ps1"
          $pe = @'
          param([string]$Path)
          try {
            $fs = [IO.File]::OpenRead($Path)
            try {
              $br = New-Object IO.BinaryReader($fs)
              $fs.Position = 0x3C; $off = $br.ReadInt32()
              $fs.Position = $off + 4; $machine = $br.ReadUInt16()
              '0x{0:X4}' -f $machine
            } finally { $fs.Dispose() }
          } catch { "unreadable: $($_.Exception.Message)" }
          '@
          $pe | Set-Content -Encoding UTF8 -Path "$env:RUNNER_TEMP\pe-machine.ps1"
          Write-Output 'probe scripts written'

      - name: Native machine under stock Windows PowerShell
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output '===== PROBE: native machine, stock Windows PowerShell ====='
          & "$env:RUNNER_TEMP\machine.ps1"
          Write-Output '===== END: native machine, stock Windows PowerShell ====='

      - name: Native machine under pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output '===== PROBE: native machine, pwsh ====='
          & "$env:RUNNER_TEMP\machine.ps1"
          Write-Output '===== END: native machine, pwsh ====='

      - name: x64 PowerShell host launch
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output '===== PROBE: x64 PowerShell host ====='
          $candidates = @(
            "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe",
            "$env:SystemRoot\SysWOW64\WindowsPowerShell\v1.0\powershell.exe",
            "$env:SystemRoot\SysArm32\WindowsPowerShell\v1.0\powershell.exe"
          )
          foreach ($root in @($env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:ProgramW6432)) {
            if ($root -and (Test-Path $root)) {
              $candidates += Get-ChildItem -Path $root -Filter pwsh.exe -Recurse -ErrorAction SilentlyContinue -Depth 4 | ForEach-Object FullName
              $candidates += Get-ChildItem -Path $root -Filter powershell.exe -Recurse -ErrorAction SilentlyContinue -Depth 4 | ForEach-Object FullName
            }
          }
          $x64 = @()
          foreach ($c in ($candidates | Select-Object -Unique)) {
            if (-not (Test-Path $c)) { Write-Output "absent: $c"; continue }
            $machine = & "$env:RUNNER_TEMP\pe-machine.ps1" -Path $c
            Write-Output "candidate: $c machine=$machine"
            if ($machine -eq '0x8664') { $x64 += $c }
          }
          if ($x64.Count -eq 0) { Write-Output 'RESULT: no x64 PowerShell host found' }
          foreach ($h in $x64) {
            Write-Output "--- launching x64 host: $h"
            $saved = $env:PSModulePath
            Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
            & $h -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\machine.ps1" 2>&1 | ForEach-Object { "$_" }
            Write-Output "exit=$LASTEXITCODE"
            $env:PSModulePath = $saved
          }
          Write-Output '===== END: x64 PowerShell host ====='

      - name: Visual Studio ARM64 tools, dumpbin and clang-cl
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output '===== PROBE: Visual Studio ====='
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Output "vswhere=$vswhere exists=$(Test-Path $vswhere) machine=$(& "$env:RUNNER_TEMP\pe-machine.ps1" -Path $vswhere)"
          & $vswhere -latest -products * -format json 2>&1 | ConvertFrom-Json | ForEach-Object {
            Write-Output "displayName=$($_.displayName) installationVersion=$($_.installationVersion) productId=$($_.productId) path=$($_.installationPath)"
          }
          $arm = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath 2>&1
          Write-Output "requires VC.Tools.ARM64 -> [$arm]"
          $clang = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath 2>&1
          Write-Output "requires VC.Llvm.Clang -> [$clang]"
          Write-Output '--- dumpbin.exe:'
          & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\dumpbin.exe' 2>&1 | ForEach-Object { "$_ machine=$(& "$env:RUNNER_TEMP\pe-machine.ps1" -Path "$_")" }
          Write-Output '--- clang-cl.exe:'
          & $vswhere -latest -products * -find '**\clang-cl.exe' 2>&1 | ForEach-Object { "$_ machine=$(& "$env:RUNNER_TEMP\pe-machine.ps1" -Path "$_")" }
          Write-Output '--- PATH lookup:'
          Get-Command clang-cl, clang, dumpbin, cmake, nasm -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name) -> $($_.Source)" }
          Write-Output '===== END: Visual Studio ====='

      - name: Image Rust toolchain (not the pinned 1.98.1)
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output '===== PROBE: image toolchain (not pinned) ====='
          Set-Location $env:RUNNER_TEMP
          rustc -vV 2>&1 | ForEach-Object { "$_" }
          rustup show 2>&1 | ForEach-Object { "$_" }
          Write-Output '===== END: image toolchain (not pinned) ====='

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        continue-on-error: true
        with:
          experimental: true
          version: 2026.9.4
          install_args: rust
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Pinned Rust host tuple and targets
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output '===== PROBE: pinned toolchain ====='
          # The image's rustup proxies, not mise shims: a shim first installs
          # every configured tool, and this lock lacks a windows-arm64
          # cargo-llvm-cov entry, so the shim fails before running cargo.
          $env:PATH = "$env:USERPROFILE\.cargo\bin;" + $env:PATH
          Write-Output "direct cargo=$((Get-Command cargo).Source) rustup=$((Get-Command rustup).Source)"
          mise --version 2>&1 | ForEach-Object { "$_" }
          Write-Output "mise machine=$(& "$env:RUNNER_TEMP\pe-machine.ps1" -Path (Get-Command mise).Source)"
          Write-Output "PATH cargo=$((Get-Command cargo -ErrorAction SilentlyContinue).Source) rustc=$((Get-Command rustc -ErrorAction SilentlyContinue).Source)"
          rustup run 1.98.1 rustc -vV 2>&1 | ForEach-Object { "$_" }
          rustup run 1.98.1 rustc --print host-tuple 2>&1 | ForEach-Object { "$_" }
          rustup target list --installed --toolchain 1.98.1 2>&1 | ForEach-Object { "$_" }
          Write-Output '===== END: pinned toolchain ====='

      - name: Locked repository toolchain install
        continue-on-error: true
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output '===== PROBE: mise install (MISE_LOCKED=1) ====='
          Write-Output "MISE_LOCKED=$env:MISE_LOCKED"
          mise install 2>&1 | ForEach-Object { "$_" }
          Write-Output "mise install exit=$LASTEXITCODE"
          mise ls --current 2>&1 | ForEach-Object { "$_" }
          git status --porcelain -- mise.lock packages/kuru-delivery/mise.lock apps/kuru-docs/mise.lock 2>&1 | ForEach-Object { "lock changed: $_" }
          Write-Output '===== END: mise install (MISE_LOCKED=1) ====='

      - name: cospec and cog under emulation
        continue-on-error: true
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output '===== PROBE: cospec and cog ====='
          $cospec = (mise which cospec 2>&1 | Select-Object -Last 1)
          Write-Output "cospec binary=$cospec machine=$(& "$env:RUNNER_TEMP\pe-machine.ps1" -Path "$cospec")"
          mise run cospec -- --version 2>&1 | ForEach-Object { "$_" }
          Write-Output "cospec exit=$LASTEXITCODE"
          mise run //packages/kuru-delivery:setup:test-tools 2>&1 | ForEach-Object { "$_" }
          Write-Output "setup:test-tools exit=$LASTEXITCODE"
          Push-Location packages/kuru-delivery
          $cog = (mise which --tool aqua:cocogitto/cocogitto@7.0.0 cog 2>&1 | Select-Object -Last 1)
          Write-Output "cog binary=$cog machine=$(& "$env:RUNNER_TEMP\pe-machine.ps1" -Path "$cog")"
          mise x aqua:cocogitto/cocogitto@7.0.0 -- cog --version 2>&1 | ForEach-Object { "$_" }
          Write-Output "cog exit=$LASTEXITCODE"
          Pop-Location
          git status --porcelain -- mise.lock packages/kuru-delivery/mise.lock 2>&1 | ForEach-Object { "lock changed: $_" }
          Write-Output '===== END: cospec and cog ====='

      - name: aws-lc-sys build smoke
        continue-on-error: true
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output '===== PROBE: aws-lc-sys build smoke ====='
          # The image's rustup proxies, not mise shims: a shim first installs
          # every configured tool, and this lock lacks a windows-arm64
          # cargo-llvm-cov entry, so the shim fails before running cargo.
          $env:PATH = "$env:USERPROFILE\.cargo\bin;" + $env:PATH
          Write-Output "direct cargo=$((Get-Command cargo).Source) rustup=$((Get-Command rustup).Source)"
          cargo +1.98.1 check -p kuru-delivery --features tooling --locked 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\aws-lc.log" | ForEach-Object { "$_" }
          Write-Output "cargo check exit=$LASTEXITCODE"
          Write-Output '--- aws-lc-sys build script lines mentioning clang/cmake/cc-builder/requires/error:'
          Get-ChildItem target\debug\build -Directory -Filter 'aws-lc-sys-*' -ErrorAction SilentlyContinue | ForEach-Object {
            foreach ($f in @('output', 'stderr')) {
              $p = Join-Path $_.FullName $f
              if (Test-Path -LiteralPath $p) {
                Select-String -LiteralPath $p -Pattern 'clang|cmake|cc-builder|cc_builder|requires|error|CC_|compiler' | ForEach-Object { "$($_.Filename)[$($_.LineNumber)]: $($_.Line)" }
              }
            }
          }
          Write-Output '===== END: aws-lc-sys build smoke ====='

      - name: Instrumented cargo llvm-cov smoke
        continue-on-error: true
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output '===== PROBE: instrumented llvm-cov smoke ====='
          # The image's rustup proxies, not mise shims: a shim first installs
          # every configured tool, and this lock lacks a windows-arm64
          # cargo-llvm-cov entry, so the shim fails before running cargo.
          $env:PATH = "$env:USERPROFILE\.cargo\bin;" + $env:PATH
          Write-Output "direct cargo=$((Get-Command cargo).Source) rustup=$((Get-Command rustup).Source)"
          rustup component add llvm-tools-preview --toolchain 1.98.1 2>&1 | ForEach-Object { "$_" }
          # Probe only: this lock has no windows-arm64 cargo-llvm-cov entry, so
          # install the pinned version unlocked in this ephemeral checkout.
          $env:MISE_LOCKED = '0'
          mise install aqua:taiki-e/cargo-llvm-cov@0.9.1 2>&1 | ForEach-Object { "$_" }
          Write-Output "unlocked mise install cargo-llvm-cov exit=$LASTEXITCODE"
          $llvmcov = (mise which --tool aqua:taiki-e/cargo-llvm-cov@0.9.1 cargo-llvm-cov 2>&1 | Select-Object -Last 1)
          $env:MISE_LOCKED = '1'
          Write-Output "cargo-llvm-cov=$llvmcov"
          if ($llvmcov -and (Test-Path -LiteralPath $llvmcov)) {
            Write-Output "cargo-llvm-cov machine=$(& "$env:RUNNER_TEMP\pe-machine.ps1" -Path "$llvmcov")"
            $env:PATH = (Split-Path -Parent $llvmcov) + ';' + $env:PATH
          }
          cargo +1.98.1 llvm-cov --version 2>&1 | ForEach-Object { "$_" }
          cargo +1.98.1 llvm-cov --no-report -p kuru-archive --lib --locked -- stored_deflated 2>&1 | ForEach-Object { "$_" }
          Write-Output "cargo llvm-cov --no-report exit=$LASTEXITCODE"
          $sysroot = (rustup run 1.98.1 rustc --print sysroot 2>&1 | Select-Object -Last 1)
          $profdata = Join-Path "$sysroot" 'lib\rustlib\aarch64-pc-windows-msvc\bin\llvm-profdata.exe'
          $exists = Test-Path -LiteralPath $profdata
          Write-Output "llvm-profdata=$profdata exists=$exists"
          if ($exists) {
            & $profdata --version 2>&1 | ForEach-Object { "$_" }
            $raws = @(Get-ChildItem target -Recurse -Filter *.profraw -ErrorAction SilentlyContinue | ForEach-Object FullName)
            Write-Output "profraw files: $($raws.Count)"
            if ($raws.Count -gt 0) {
              & $profdata merge -sparse @raws -o "$env:RUNNER_TEMP\probe.profdata" 2>&1 | ForEach-Object { "llvm-profdata merge -sparse: $_" }
              Write-Output "llvm-profdata merge -sparse exit=$LASTEXITCODE"
            }
          }
          cargo +1.98.1 llvm-cov report 2>&1 | ForEach-Object { "$_" }
          Write-Output "cargo llvm-cov report exit=$LASTEXITCODE"
          Write-Output '===== END: instrumented llvm-cov smoke ====='
