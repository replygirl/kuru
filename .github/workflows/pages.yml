name: Documentation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Main commit or tag to deploy (defaults to current main)
        type: string
        default: main
  workflow_call:
    inputs:
      ref:
        description: Exact released commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve an immutable main revision
        id: source
        env:
          DOCS_REF: ${{ inputs.ref }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          DOCS_SHA=$(git rev-parse --verify --end-of-options "${DOCS_REF}^{commit}")
          git merge-base --is-ancestor "$DOCS_SHA" origin/main
          git checkout --detach "$DOCS_SHA"
          echo "sha=$DOCS_SHA" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          version: 2026.9.3
          install_args: rust aqua:jdx/hk
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise run //apps/kuru-docs:setup
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Build and validate public documentation
        env:
          KURU_DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          mise run docs:build
          mise run //packages/kuru-delivery:tool -- docs --base "$KURU_DOCS_BASE"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/kuru-docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
