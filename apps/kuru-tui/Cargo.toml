[package]
name = "kuru"
default-run = "kuru"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A chat harness with a native pool of persistent peer agents"

[features]
default = []
test-support = ["kuru-platform/test-support"]

[[bin]]
name = "kuru-terminal-windows-fixture"
path = "tests/fixtures/windows_terminal.rs"
required-features = ["test-support"]

[[bin]]
name = "kuru-cli-windows-fixture"
path = "tests/fixtures/windows_cli.rs"
required-features = ["test-support"]

[dependencies]
kuru-delivery.workspace = true
anyhow.workspace = true
clap.workspace = true
crossterm = { workspace = true, features = ["event-stream"] }
futures.workspace = true
kuru-core.workspace = true
kuru-platform.workspace = true
kuru-memory.workspace = true
kuru-connectors.workspace = true
kuru-runtime.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true

sha2.workspace = true
unicode-width.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
axum.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
sqlx.workspace = true
tar.workspace = true
flate2.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix.workspace = true
rustix.workspace = true
vt100.workspace = true

[target.'cfg(windows)'.dev-dependencies]
portable-pty.workspace = true
vt100.workspace = true

[lints]
workspace = true
