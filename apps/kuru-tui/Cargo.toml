[package]
name = "kuru"
default-run = "kuru"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A chat harness with a native pool of persistent peer agents"

[features]
default = []
test-support = ["kuru-platform/test-support", "kuru-core/test-support"]

[[bin]]
name = "kuru-terminal-windows-fixture"
path = "tests/fixtures/windows_terminal.rs"
required-features = ["test-support"]

[[bin]]
name = "kuru-cli-windows-fixture"
path = "tests/fixtures/windows_cli.rs"
required-features = ["test-support"]

[dependencies]
kuru-delivery.workspace = true
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
usage-lib.workspace = true
usage-cli.workspace = true
usage-argv.workspace = true
crossterm = { workspace = true, features = ["event-stream", "use-dev-tty"] }
futures.workspace = true
kuru-core.workspace = true
kuru-platform.workspace = true
kuru-memory.workspace = true
kuru-connectors.workspace = true
kuru-runtime.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
uuid.workspace = true

sha2.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
base64.workspace = true
# Always compiled in for test builds only (dev-dependencies never reach the
# shipping binary): unlocks the KURU_TEST_MODEL_CATALOG_PATH fixture seam so
# `cargo test -p kuru` need not be run with --all-features for tests that
# depend on it, such as the /cost known-price frame test in tests/terminal.rs.
kuru-core = { workspace = true, features = ["test-support"] }
kuru-memory = { workspace = true, features = ["test-support"] }
kuru-delivery = { workspace = true, features = ["tooling"] }
kuru-connectors = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
axum.workspace = true
reqwest.workspace = true
rcgen.workspace = true
tokio-rustls.workspace = true
rusqlite.workspace = true
sqlx.workspace = true
tar.workspace = true
flate2.workspace = true
portable-pty.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix.workspace = true
vt100.workspace = true

[target.'cfg(windows)'.dev-dependencies]
vt100.workspace = true

[lints]
workspace = true
